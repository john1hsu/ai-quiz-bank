topic: Principal component analysis
topic_type: Algorithm
maturity: foundational
true_statement: PCA keeps the covariance eigenvectors with the largest eigenvalues, because each eigenvalue is the variance captured along that component.
false_statement: PCA keeps the covariance eigenvectors with the smallest eigenvalues, because each eigenvalue is the variance captured along that component.
explanation: Sorting by eigenvalue ranks directions by how much spread they hold, so the discarded eigenvalues add up to exactly the variance the projection throws away. For high-dimensional data, implementations get the same directions from an SVD of the centred data instead.
