topic: Bias-variance tradeoff
topic_type: Concept
maturity: foundational
true_statement: When training error is low but test error is high, the usual remedies are more data, a simpler model or bagging.
false_statement: When training error is low but test error is high, the usual remedies are a more expressive model, more features or boosting.
explanation: That pattern signals high variance (overfitting), so you reduce flexibility or average it out with bagging. A more expressive model, more features or boosting are the fixes for high bias, when even training error is too high.
