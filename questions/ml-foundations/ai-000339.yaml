true_statement: Leslie Valiant's 1984 paper "A Theory of the Learnable" gave learning a computational footing, the template later called probably approximately correct (PAC) learning.
false_statement: Leslie Valiant's 1994 paper "A Theory of the Learnable" gave learning a computational footing, the template later called probably approximately correct (PAC) learning.
explanation: Valiant's 1984 Communications of the ACM paper asked a learner to produce, in polynomial time, a rule whose error is small with high probability. That framing underlies the formal theory of supervised learning taught today.
