true_statement: Ng and Jordan (2001) found logistic regression reaches a lower asymptotic error than naive Bayes, but naive Bayes approaches its own asymptote faster, so it can win on scarce data.
false_statement: Ng and Jordan (2001) found naive Bayes reaches a lower asymptotic error than logistic regression, but logistic regression approaches its own asymptote faster, so it can win on scarce data.
explanation: The result challenged the folk wisdom that discriminative training is nearly always better. With little data the generative model's stronger assumptions help it converge quickly; with plenty of data the discriminative model's flexibility wins.
