true_statement: In deep double descent, more training data shifts the error peak toward larger models, so adding samples can temporarily make a model worse.
false_statement: In deep double descent, more training data shifts the error peak toward smaller models, so adding samples can never make a model worse.
explanation: The peak sits where the model can only just fit its training set, and a bigger dataset needs a bigger model to reach that point. Nakkiran et al. saw a Transformer get worse at translation with 4.5 times more data.
