id: ai-000205
area: ml-foundations
kind: definition
topic: Conditional random field
topic_type: Concept
maturity: established
true_statement: Because a CRF models the conditional probability of labels given the inputs, it can use rich, overlapping input features without modelling how the inputs were generated.
false_statement: Because a CRF models the joint probability of labels and inputs, it can use rich, overlapping input features without modelling how the inputs were generated.
explanation: A generative model such as an HMM must describe the observations themselves, which forces independence assumptions on features. A discriminative CRF only scores labelings of a given input, so features can look anywhere in the sentence and overlap freely; it is in effect sequence-wide logistic regression.
