topic: Regularization
topic_type: Concept
maturity: foundational
true_statement: An L1 penalty, as in the lasso, drives some coefficients to exactly zero, while an L2 penalty spreads weight across many correlated features.
false_statement: An L2 penalty, as in the lasso, drives some coefficients to exactly zero, while an L1 penalty spreads weight across many correlated features.
explanation: Because L1 sets some coefficients to zero, the lasso doubles as feature selection and gives sparse, interpretable models. L2 (ridge or weight decay) shrinks all weights smoothly but rarely to zero, which is why it spreads weight across correlated inputs.
