true_statement: The Viterbi algorithm has the same dynamic-programming structure as the forward algorithm but takes a maximum over previous states where the forward algorithm sums.
false_statement: The forward algorithm has the same dynamic-programming structure as the Viterbi algorithm but takes a maximum over previous states where the Viterbi algorithm sums.
explanation: Summing over all paths gives the likelihood of the observations (the forward algorithm), while keeping only the best predecessor plus a back-pointer recovers the single most likely hidden-state path (Viterbi). Both avoid the exponential cost of enumerating every path.
