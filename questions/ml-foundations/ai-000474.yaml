true_statement: Leo Breiman introduced bagging (bootstrap aggregating) in 1996 and later combined it with random feature selection to create random forests in 2001.
false_statement: Yoav Freund and Robert Schapire introduced bagging (bootstrap aggregating) in 1996 and later combined it with random feature selection to create random forests in 2001.
explanation: Both bagging and random forests are Breiman's work, five years apart. Freund and Schapire are the names behind the other main family, boosting, whose AdaBoost algorithm appeared in their 1997 paper.
