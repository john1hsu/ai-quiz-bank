true_statement: In 2016 Lample et al.'s LSTM-CRF scored 90.94 F1 on CoNLL-2003 English named-entity recognition, with the CRF layer adding about 1.8 F1 over the LSTM alone.
false_statement: In 2016 Lample et al.'s LSTM-CRF scored 90.94 F1 on CoNLL-2003 English named-entity recognition, with the CRF layer costing about 1.8 F1 against the LSTM alone.
explanation: The bidirectional LSTM scores each token's tags, and the CRF layer adds learned tag-to-tag transitions, so it can rule out sequences like I-PER right after B-LOC. That is why CRFs survived the neural era as output layers rather than standalone models.
