true_statement: Karl Pearson (1901) derived PCA as fitting the closest lines and planes to a cloud of points; Harold Hotelling (1933) derived it as the projection that maximises variance.
false_statement: Harold Hotelling (1901) derived PCA as fitting the closest lines and planes to a cloud of points; Karl Pearson (1933) derived it as the projection that maximises variance.
explanation: Pearson's geometric view minimises squared reconstruction error, and Hotelling's statistical view maximises projected variance. The two derivations give the same components, which is why PCA can be explained either way.
