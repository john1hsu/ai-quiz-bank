true_statement: The VC dimension of a hypothesis class is the size of the largest set of points it can shatter, and linear classifiers in n dimensions have VC dimension n + 1.
false_statement: The VC dimension of a hypothesis class is the size of the largest set of points it can shatter, and linear classifiers in n dimensions have VC dimension 2n.
explanation: 'Shattering means the class can realise every possible labelling of the points, so the VC dimension measures capacity: for linear classifiers it is one more than the input dimension. Generalisation bounds grow with this capacity and shrink with the sample size.'
