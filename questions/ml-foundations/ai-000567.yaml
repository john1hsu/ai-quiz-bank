true_statement: Normalizing flows compute exact likelihoods by change of variables, which forces every layer to be invertible with a tractable Jacobian and to keep input and output the same size.
false_statement: Normalizing flows compute exact likelihoods by optimizing an evidence lower bound, which forces every layer to be invertible with a tractable Jacobian and to keep input and output the same size.
explanation: Each deep generative family pays for tractability somewhere. Flows get exact densities but pay with architectural restrictions; the evidence lower bound (ELBO) is the variational autoencoder's trick, which gives only a bound on the likelihood.
