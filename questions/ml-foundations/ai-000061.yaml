true_statement: In Mitchell's definition a program learns if performance P at task T improves with experience E; for a checkers player, P is the share of games won.
false_statement: In Mitchell's definition a program learns if performance P at task T improves with experience E; for a checkers player, E is the share of games won.
explanation: For checkers, T is playing the game, P is the fraction of games won and E is practice games against itself. Naming all three forces you to say exactly what 'getting better' means before you build a learner.
