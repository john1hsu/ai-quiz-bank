true_statement: HMMs were applied to speech recognition in the 1970s by Baker at Carnegie Mellon and Jelinek's group at IBM, building on mathematics by Baum and colleagues.
false_statement: HMMs were applied to speech recognition in the 1970s by Rabiner's group at Bell Labs and Lafferty at Carnegie Mellon, building on mathematics by Baum and colleagues.
explanation: Baum and Petrie's 1966 work supplied the theory, and Baker and Jelinek brought it to speech. Rabiner's 1989 tutorial later popularised the method, noting that adoption lagged because the theory sat in mathematics journals engineers rarely read.
