topic: Generative model
topic_type: Concept
maturity: foundational
true_statement: A generative model learns the distribution of the data itself, p(x) or the joint p(x, y), while a discriminative model learns only p(y | x).
false_statement: A discriminative model learns the distribution of the data itself, p(x) or the joint p(x, y), while a generative model learns only p(y | x).
explanation: Because a generative model accounts for how inputs are spread across the whole input space, it can score how likely an example is and sample new ones. A discriminative model takes the input as given and only learns a boundary, which is an easier task but cannot produce data.
