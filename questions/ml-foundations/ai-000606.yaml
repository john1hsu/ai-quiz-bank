true_statement: Because k-means and EM only reach a local optimum or stationary point, Stanford's CS229 notes advise running them from several random initialisations.
false_statement: Because k-means and EM reach the global optimum from any starting point, Stanford's CS229 notes advise running them once from a single random initialisation.
explanation: Each iteration of either algorithm can only improve its objective, but that just guarantees it settles somewhere, not that it finds the best solution. Several restarts and keeping the best result is the cheap practical fix.
