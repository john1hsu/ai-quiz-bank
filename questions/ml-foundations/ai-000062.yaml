true_statement: Arthur Samuel reported in 1959 that his checkers program learned to play better than its author after roughly 8 to 10 hours of machine time.
false_statement: Arthur Samuel reported in 1959 that his checkers program learned to play better than its author after roughly 8 to 10 weeks of machine time.
explanation: Samuel's IBM Journal paper, with 'machine learning' in its title, started from little more than the rules and unweighted evaluation terms. Beating its own programmer within hours made the case that learning from experience could replace hand programming.
