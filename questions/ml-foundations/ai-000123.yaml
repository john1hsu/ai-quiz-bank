true_statement: Nakkiran et al. (2021) proved that optimally tuned ℓ2 regularization makes test risk monotone in sample and model size for certain linear regression settings.
false_statement: Nakkiran et al. (2021) proved that optimally tuned ℓ2 regularization sharpens the double-descent peak in sample and model size for certain linear regression settings.
explanation: The spike belongs to unregularised interpolating learners. Tuned regularization, like optimal early stopping, damps it in neural networks too, so in practice the peak is mostly a warning about running near the threshold without them.
