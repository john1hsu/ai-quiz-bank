topic: Bias-variance tradeoff
topic_type: Concept
maturity: foundational
true_statement: For squared loss, expected test error splits into variance plus squared bias plus noise, and no learner can remove the noise term.
false_statement: For squared loss, expected test error splits into variance plus squared bias plus noise, and a flexible enough learner can remove the noise term.
explanation: Noise comes from ambiguity in the data and features themselves, so it sets a floor on error. Model choices only trade bias against variance; often a small rise in bias buys a large drop in variance.
