topic: Conditional random field
topic_type: Concept
maturity: established
true_statement: CRFs avoid the label bias problem of maximum entropy Markov models by normalising once over whole label sequences instead of separately at each state.
false_statement: Maximum entropy Markov models avoid the label bias problem of CRFs by normalising separately at each state instead of once over whole label sequences.
explanation: With per-state normalisation, a state's outgoing probability mass is fixed whatever is observed, so a state with one successor ignores its input. Normalising over entire sequences lets evidence anywhere raise or lower a whole path's score.
