topic: Dimensionality reduction
topic_type: Technique
maturity: foundational
true_statement: Isomap estimates geodesic distances as shortest paths through a k-nearest-neighbour graph, then embeds them with classical multidimensional scaling.
false_statement: Isomap estimates geodesic distances as straight-line Euclidean distances between all pairs of points, then embeds them with classical multidimensional scaling.
explanation: Hopping between near neighbours makes the distance follow the curved sheet the data lies on, which is how Isomap unrolls the Swiss roll where PCA and plain MDS fail. Straight-line distances would cut across the roll and keep the fold.
