true_statement: Caruana, Lawrence and Giles (NIPS 2000) found oversized networks trained by backpropagation with early stopping generalized well, while conjugate gradient tended to overfit.
false_statement: Caruana, Lawrence and Giles (NIPS 2000) found oversized networks trained by conjugate gradient with early stopping generalized well, while backpropagation tended to overfit.
explanation: They explained that networks of different sizes learn a task's subcomponents in a similar order, so with early stopping a big backprop-trained network can match a smaller one. Conjugate gradient was the method they found prone to overfitting smooth regions of the input space.
