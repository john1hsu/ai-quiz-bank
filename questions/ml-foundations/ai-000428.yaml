true_statement: Under minibatch SGD, an L2 penalty makes each update first shrink every weight by a factor of (1 − ηλ), which is why L2 regularization is called weight decay.
false_statement: Under minibatch SGD, an L1 penalty makes each update first shrink every weight by a factor of (1 − ηλ), which is why L1 regularization is called weight decay.
explanation: The gradient of (λ/2)‖w‖² is λw, so subtracting η times it scales each weight down in proportion to its size before the usual gradient step. Swapping in the L1 norm gives the lasso instead, which drives some weights to exactly zero rather than decaying them all by a common factor.
