topic: Dimensionality reduction
topic_type: Technique
maturity: foundational
true_statement: Distances between clusters in a t-SNE plot shouldn't be over-read, and a 2-D map where classes overlap doesn't prove the classes are inseparable.
false_statement: Distances between clusters in a t-SNE plot can be read as true separations, and a 2-D map where classes overlap proves the classes are inseparable.
explanation: t-SNE is built to keep local neighbourhoods, so the gaps between clusters depend on perplexity and the random seed rather than on real global distances. Squeezing many dimensions into two can hide separation that exists in the original space.
