true_statement: Zhang et al. (ICLR 2017) showed standard image classifiers trained with stochastic gradient methods can fit completely random labels, and explicit regularization does not change this qualitatively.
false_statement: Zhang et al. (ICLR 2017) showed standard image classifiers trained with stochastic gradient methods can fit completely random labels, but explicit regularization reliably prevents this.
explanation: The same networks that generalise on real labels can also memorise pure noise, even with regularizers switched on. So the model family's capacity alone cannot explain why deep learning generalises, which is where classical capacity bounds stop being useful.
