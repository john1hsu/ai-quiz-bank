true_statement: Krogh and Hertz (NIPS 1991) showed that in linear networks weight decay suppresses weight components irrelevant to the task by favouring the smallest solution.
false_statement: Krogh and Hertz (NIPS 1991) showed that in linear networks weight decay suppresses weight components irrelevant to the task by favouring the sparsest solution.
explanation: 'Their analysis explains why weight decay helps generalization: among solutions that fit the data, the penalty picks the one with the smallest weights, and a well-chosen strength also damps static noise in the targets. Favouring sparse solutions is the signature of an L1 penalty, not of weight decay.'
