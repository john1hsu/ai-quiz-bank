true_statement: Rabiner named state duration as perhaps the HMM's major weakness, because self-transitions imply an exponentially distributed stay in each state.
false_statement: Rabiner named state duration as perhaps the HMM's major weakness, because self-transitions force a fixed, constant stay in each state.
explanation: Staying in a state means repeatedly taking the same self-transition, so the chance of a long stay decays exponentially. Real signals such as speech sounds rarely have durations shaped like that, one of several limits that come from the same simplifying assumptions that make HMMs efficient.
