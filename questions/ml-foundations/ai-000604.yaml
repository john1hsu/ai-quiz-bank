true_statement: The procedure now taught as k-means comes from Stuart Lloyd's least-squares quantization method, circulated at Bell Labs in 1957 and published only in 1982.
false_statement: The procedure now taught as k-means comes from Stuart Lloyd's least-squares quantization method, circulated at IBM in 1957 and published only in 1982.
explanation: Lloyd was designing signal quantizers for pulse-code modulation, not clustering data. His alternation of moving each point to its cell's centroid and redrawing cells by nearest neighbour never increases squared error, which is exactly k-means.
