true_statement: Belkin and colleagues' double descent curve shows test error falling a second time as capacity grows past the point of fitting the training data exactly.
false_statement: Belkin and colleagues' double descent curve shows test error rising a second time as capacity grows past the point of fitting the training data exactly.
explanation: The classical U-curve predicts that interpolating the data means overfitting, yet over-parameterised networks generalise well. Double descent adds a second fall beyond the interpolation point, which helps explain why scaling past a perfect fit pays off.
