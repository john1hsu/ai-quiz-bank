true_statement: Bagging helps most with unstable base learners such as decision trees, whose output shifts a lot with small data changes; in Breiman's tests it left stable k-nearest-neighbour classifiers essentially unchanged.
false_statement: Bagging helps most with stable base learners such as k-nearest-neighbour classifiers, whose output shifts little with small data changes; in Breiman's tests it left unstable decision trees essentially unchanged.
explanation: Averaging over bootstrap resamples only helps if the resamples produce genuinely different models. Unstable trees do, so their errors partly cancel and test error fell sharply, while a stable learner gives nearly the same model every time and gains nothing.
