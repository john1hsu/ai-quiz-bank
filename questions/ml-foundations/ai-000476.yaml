true_statement: In Dietterich's decision-tree comparison, AdaBoost beat bagging on clean data but fell behind it when 20% of labels were corrupted, because boosting put much of its weight on the mislabelled examples.
false_statement: In Dietterich's decision-tree comparison, AdaBoost beat bagging on clean data and widened its lead when 20% of labels were corrupted, because boosting put much of its weight on the mislabelled examples.
explanation: Boosting keeps upweighting examples it gets wrong, and mislabelled examples are always wrong, so noise pulls the ensemble toward fitting errors. Bagging treats every example equally, which makes it, and random forests, far more tolerant of label noise.
