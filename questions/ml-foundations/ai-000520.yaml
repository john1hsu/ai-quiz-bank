true_statement: Vapnik's key theorem says empirical risk minimisation is consistent exactly when empirical risk converges to true risk uniformly over the whole hypothesis class.
false_statement: Vapnik's key theorem says empirical risk minimisation is consistent exactly when empirical risk converges to true risk for the single hypothesis it ends up choosing.
explanation: Because the learner picks the hypothesis that looks best on the sample, convergence for any one fixed hypothesis is not enough. The guarantee must hold across the whole class at once, which is why capacity measures like the VC dimension enter the analysis.
