true_statement: Scikit-learn's PCA centres each feature but doesn't scale it, so variables measured on large scales dominate the components unless you rescale them first.
false_statement: Scikit-learn's PCA centres each feature and scales it to unit variance, so variables measured on large scales can't dominate the components even if you skip rescaling.
explanation: Because PCA chases variance, a feature in large units looks important simply because its numbers are big. Whether to standardise is a real modelling choice; NIST's tutorial standardises and works from the correlation matrix instead.
