true_statement: Above the interpolation threshold many solutions fit the training data exactly, and training tends to pick a small-norm one, so test error can fall again.
false_statement: Below the interpolation threshold many solutions fit the training data exactly, and training tends to pick a small-norm one, so test error can fall again.
explanation: Exactly at the threshold there is essentially one interpolant, and it must contort itself through every noisy label, so its norm and error spike. With capacity to spare, the implicit preference for small norm acts like Occam's razor.
