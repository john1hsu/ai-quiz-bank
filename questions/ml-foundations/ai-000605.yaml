true_statement: When EM fits a Gaussian mixture, the E-step computes each point's soft membership in each component, and the M-step re-estimates the weights, means and covariances from them.
false_statement: When EM fits a Gaussian mixture, the M-step computes each point's soft membership in each component, and the E-step re-estimates the weights, means and covariances from them.
explanation: The E (expectation) step fills in the hidden component labels with probabilities from Bayes' rule; the M (maximization) step then does weighted maximum likelihood. It is like k-means with soft rather than hard assignments.
