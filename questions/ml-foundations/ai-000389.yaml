topic: Overfitting
topic_type: Concept
maturity: foundational
true_statement: Underfitting shows up as high error on both training and validation data with only a small gap between them, usually because the model is too simple.
false_statement: Underfitting shows up as high error on both training and validation data with only a small gap between them, usually because the model is too complex.
explanation: An underfit model cannot capture the pattern even on data it has seen, so both errors stay high. Excess complexity causes the opposite problem, overfitting, where training error is low but validation error is much higher.
