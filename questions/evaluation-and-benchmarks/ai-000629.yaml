true_statement: WMT 2014 mainly asked for constrained systems, trained only on the supplied data, so that comparisons would reflect methods rather than access to data.
false_statement: WMT 2014 mainly asked for unconstrained systems, trained on any data a team could obtain, so that comparisons would reflect methods rather than access to data.
explanation: If one team trains on far more text, its win says little about its method. Fixing the training data isolates the modelling choices, and systems that used substantial extra data had to be flagged.
