true_statement: To counter position bias, LLM judges are often run on both orders of the two answers, counting a win only when the verdict stays the same.
false_statement: To counter verbosity bias, LLM judges are often run on both orders of the two answers, counting a win only when the verdict stays the same.
explanation: Position bias means a judge favours an answer because of where it sits; in Zheng et al.'s tests GPT-4 kept its verdict after a swap only 65% of the time. Swapping the order does nothing about verbosity bias, the pull toward longer, padded answers.
