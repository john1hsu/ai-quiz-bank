true_statement: When a Transformer scores a long document, splitting it into disjoint fixed-length chunks gives a higher perplexity than a strided sliding window over the same text.
false_statement: When a Transformer scores a long document, splitting it into disjoint fixed-length chunks gives a lower perplexity than a strided sliding window over the same text.
explanation: With disjoint chunks the first tokens of each chunk are predicted with almost no context, which inflates their loss. A sliding window gives every token more history at the cost of extra forward passes, so the evaluation protocol alone can move the reported number noticeably.
