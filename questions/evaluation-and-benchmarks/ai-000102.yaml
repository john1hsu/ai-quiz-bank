true_statement: GSM-Symbolic (ICLR 2025) found models' accuracy fell when only the numbers in GSM8K-style problems changed, while changing only the names barely mattered.
false_statement: GSM-Symbolic (ICLR 2025) found models' accuracy fell when only the names in GSM8K-style problems changed, while changing only the numbers barely mattered.
explanation: A model that truly reasoned would be indifferent to which numbers appear. Sensitivity to numbers, and big drops when an irrelevant clause was added, led the Apple authors to suspect pattern matching on familiar problems.
