true_statement: 'TruthfulQA''s original study found inverse scaling: within model families such as GPT-3 and GPT-Neo/J, larger models were generally less truthful.'
false_statement: 'TruthfulQA''s original study found smooth positive scaling: within model families such as GPT-3 and GPT-Neo/J, larger models were generally more truthful.'
explanation: Bigger models imitate their training text more faithfully, misconceptions included. The authors argued that scaling alone would not fix truthfulness and that objectives beyond imitating web text were needed, a well-known counterexample to the bigger-is-better trend.
