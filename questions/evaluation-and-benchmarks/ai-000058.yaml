topic: Red teaming
topic_type: Technique
maturity: emerging
true_statement: Security red teaming is open-ended emulation of an adversary, whereas penetration testing checks a system against a list of known controls.
false_statement: Penetration testing is open-ended emulation of an adversary, whereas security red teaming checks a system against a list of known controls.
explanation: A red team plays a real opponent and looks for any way in, including ones nobody anticipated; a pen test or audit works through a checklist. That open-endedness is what AI red teaming borrows when it probes models for unexpected harms.
