true_statement: The Leaderboard Illusion (2025) argued that undisclosed private testing let some Chatbot Arena providers try many model variants and publish only the best.
false_statement: The Leaderboard Illusion (2025) argued that undisclosed private testing let some Chatbot Arena providers see other labs' test prompts in advance and tune on them.
explanation: 'The preprint''s concern was selection: if a provider can test many variants privately and publish only the top score, the ranking rewards trying often rather than being better. These are the study authors'' claims, but they show how a widely watched leaderboard invites Goodhart-style pressure.'
