id: ai-000537
area: evaluation-and-benchmarks
kind: definition
topic: Chatbot Arena
topic_type: Benchmark
maturity: established
true_statement: In a Chatbot Arena battle, a user's own prompt goes to two anonymous models, and the models' identities are revealed only after the user votes.
false_statement: In a Chatbot Arena battle, a user's own prompt goes to two named models, and the models' identities are shown to the user before the vote.
explanation: Hiding which model wrote which answer keeps brand loyalty out of the vote, so it reflects the answers themselves. Because prompts come from real users rather than a fixed test set, the evaluation is also harder to memorise than a static benchmark.
