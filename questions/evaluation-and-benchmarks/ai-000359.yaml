true_statement: In 2023, GPT-4 as a judge agreed with human experts on 85% of non-tied MT-Bench votes, slightly above the 81% at which the experts agreed with one another.
false_statement: In 2023, GPT-4 as a judge agreed with human experts on 81% of non-tied MT-Bench votes, slightly below the 85% at which the experts agreed with one another.
explanation: Zheng et al.'s headline finding was that a strong LLM judge matched human preferences about as well as humans match each other. That is why LLM judges are used as a cheap first pass, though they are still checked against samples of human ratings.
