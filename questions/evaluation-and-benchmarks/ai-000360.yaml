true_statement: G-Eval has the judge model first generate evaluation steps by chain-of-thought, then fill in a form with scores for criteria such as coherence or fluency.
false_statement: G-Eval has the judge model first fill in a form with scores for criteria such as coherence or fluency, then generate evaluation steps by chain-of-thought.
explanation: Reasoning before scoring lets the judge decide what to check before it commits to a number; writing the reasoning afterwards would only justify a verdict already made. With GPT-4 as backbone, G-Eval correlated with human summary ratings well above earlier automatic metrics.
