true_statement: Zheng et al. documented position, verbosity and self-enhancement biases when a strong LLM is used to grade other models' outputs.
false_statement: Zheng et al. documented recency, brevity and self-criticism biases when a strong LLM is used to grade other models' outputs.
explanation: Model judges can favour the answer shown first, longer answers, and outputs resembling their own. That is why LLM-as-a-judge scores should be checked against human labels even though agreement with humans was high.
