true_statement: In 2014 Sutskever, Vinyals and Le's deep LSTM scored 34.8 BLEU on WMT'14 English-to-French, beating a phrase-based statistical baseline at 33.3.
false_statement: In 2014 Sutskever, Vinyals and Le's deep LSTM scored 33.3 BLEU on WMT'14 English-to-French, trailing a phrase-based statistical baseline at 34.8.
explanation: It was one of the first times a pure neural sequence-to-sequence model beat a mature statistical system on a major benchmark. Using the LSTM to rerank the baseline's candidates pushed the score higher still, to 36.5.
