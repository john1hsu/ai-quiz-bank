true_statement: Hugging Face dropped TruthfulQA from its rebuilt Open LLM Leaderboard in 2024, partly because the benchmark had leaked into instruction-tuning datasets.
false_statement: Hugging Face added TruthfulQA to its rebuilt Open LLM Leaderboard in 2024, partly because the benchmark had been kept out of instruction-tuning datasets.
explanation: Once test questions appear in training data, scores measure memorisation rather than general ability. TruthfulQA's removal is a standard case study in benchmark contamination, alongside the authors' own caution that a high score says little about truthfulness in long-form or interactive use.
