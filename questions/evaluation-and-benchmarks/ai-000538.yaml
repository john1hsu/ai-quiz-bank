true_statement: Chatbot Arena fits Bradley-Terry coefficients to its pairwise votes, having moved away from an online Elo rating to get cleaner statistical estimates and confidence intervals.
false_statement: Chatbot Arena fits online Elo ratings to its pairwise votes, having moved away from Bradley-Terry coefficients to get cleaner statistical estimates and confidence intervals.
explanation: In the Bradley-Terry model the chance one model beats another is a logistic function of the gap in their scores, fitted to all votes at once. Unlike an online Elo update, which depends on vote order, this supports proper estimation and confidence intervals on each model's rank.
