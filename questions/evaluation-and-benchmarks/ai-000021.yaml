true_statement: In AI evaluation, Goodhart's law describes a metric that stops tracking the property it stood for once it becomes an optimisation target.
false_statement: In AI evaluation, benchmark contamination describes a metric that stops tracking the property it stood for once it becomes an optimisation target.
explanation: Both inflate scores, but differently. Goodhart's law is about optimising toward the metric itself; contamination is when test items leak into training data, so the model has effectively seen the answers.
