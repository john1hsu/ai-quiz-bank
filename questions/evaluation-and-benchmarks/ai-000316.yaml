id: ai-000316
area: evaluation-and-benchmarks
kind: mechanism
topic: Benchmark contamination
topic_type: Risk
maturity: emerging
true_statement: Oren et al.'s contamination test relies on a clean model finding every ordering of a benchmark's examples equally likely, so a preference for the published order signals memorisation.
false_statement: Oren et al.'s contamination test relies on a clean model preferring the published ordering of a benchmark's examples, so equal likelihood across shuffles signals memorisation.
explanation: A model that never saw the test set has no reason to favour the order the examples were published in. If it does, it has probably read that file, and because the test only needs output probabilities it works on black-box models with exact false-positive guarantees.
