true_statement: In 2020 Howcroft and colleagues found more than 200 different terms for the quality aspects judged across 165 NLG papers with human evaluations.
false_statement: In 2020 Howcroft and colleagues found only about 20 different terms for the quality aspects judged across 165 NLG papers with human evaluations.
explanation: Natural language generation (NLG) studies used a sprawl of often undefined criteria names, so two papers 'measuring fluency' might not measure the same thing. That confusion is why the authors called for standard definitions and evaluation sheets documenting each study's design.
