true_statement: LiveBench limits contamination by drawing questions from recent competitions, arXiv papers and news, refreshing them monthly and scoring against objective answers.
false_statement: LiveBench limits contamination by drawing questions from recent competitions, arXiv papers and news, refreshing them monthly and scoring them with LLM judges.
explanation: Fresh questions are unlikely to be in any model's training data yet, and objective answers avoid the biases of LLM judges or crowdworkers. Even so, its authors softened the claim from 'contamination-free' to 'contamination-limited'.
