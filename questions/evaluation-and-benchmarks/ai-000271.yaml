true_statement: MMLU (Massive Multitask Language Understanding) asks four-option multiple-choice questions across 57 subjects, from elementary mathematics to professional law.
false_statement: MMLU (Massive Multitask Language Understanding) asks ten-option multiple-choice questions across 57 subjects, from elementary mathematics to professional law.
explanation: With four options, random guessing scores 25%, the baseline every MMLU result is read against. Ten options belong to its successor MMLU-Pro, which added choices partly because four-option questions reward elimination more than reasoning.
