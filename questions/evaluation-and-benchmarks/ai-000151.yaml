true_statement: Because many BEIR datasets were labelled by pooling keyword-system results, documents found only by neural retrievers often went unjudged, understating neural retrievers' scores.
false_statement: Because many BEIR datasets were labelled by pooling neural-retriever results, documents found only by BM25 often went unjudged, understating BM25's scores.
explanation: Unjudged documents count as irrelevant, so a system that surfaces new, unlabelled hits is penalised. On TREC-COVID, labelling the missing pairs lifted DPR's score sharply while BM25 barely moved, a reminder that a benchmark score partly reflects how its labels were collected.
