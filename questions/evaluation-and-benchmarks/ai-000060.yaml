true_statement: Ganguli et al. found RLHF-trained models got harder to red team as they grew, while plain language models showed a roughly flat trend with scale.
false_statement: Ganguli et al. found plain language models got harder to red team as they grew, while RLHF-trained models showed a roughly flat trend with scale.
explanation: Anthropic's 2022 study red-teamed models at 2.7B, 13B and 52B parameters across four training types. Only the RLHF models became more robust with size, suggesting scale helps safety mainly when combined with preference training.
