topic: Perplexity
topic_type: Concept
maturity: foundational
true_statement: A language model that spreads probability uniformly over its vocabulary has a perplexity equal to the vocabulary size, a baseline any useful model must beat.
false_statement: A language model that spreads probability uniformly over its vocabulary has a perplexity equal to 1, a baseline any useful model must beat.
explanation: 'Perplexity reads as an effective branching factor: how many equally likely choices the model is torn between at each token. A uniform guess is torn between every word, so it scores the vocabulary size; a score of 1 belongs to a model that is always certain and right.'
