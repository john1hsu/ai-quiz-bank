true_statement: Fang et al. (ICLR 2025) found standard perplexity tracked long-context benchmarks only weakly, while their LongPPL, scored only on tokens that depend on distant context, tracked them closely.
false_statement: Fang et al. (ICLR 2025) found standard perplexity tracked long-context benchmarks closely, while their LongPPL, scored only on tokens that depend on distant context, tracked them only weakly.
explanation: Most tokens can be predicted from nearby text, so averaging over every token drowns out the few that test long-range memory. Scoring only those key tokens gives a metric that actually reflects long-context ability.
