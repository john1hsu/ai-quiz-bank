maturity: established
true_statement: 'TruthfulQA targets imitative falsehoods: wrong answers a model rates as likely precisely because they appear often in the human-written text it learned from.'
false_statement: 'TruthfulQA targets random hallucinations: wrong answers a model invents precisely because they never appear in the human-written text it learned from.'
explanation: Its 817 questions are built around common misconceptions and myths, so a model that simply imitates web text reproduces the popular wrong answer. That makes better next-token prediction a liability on this benchmark rather than a help.
