true_statement: In Perez et al.'s automated red teaming, a red language model writes the test inputs and a classifier flags harmful replies from the target model.
false_statement: In Perez et al.'s automated red teaming, human crowdworkers write the test inputs and a classifier flags harmful replies from the target model.
explanation: Using a model to generate attacks scales coverage far beyond what hand-written tests can afford. The trade-off is that the red model and the classifier bound which failures can be found, so it complements rather than replaces human red teams.
