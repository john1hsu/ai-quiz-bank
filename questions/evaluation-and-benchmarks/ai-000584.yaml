true_statement: Callison-Burch and colleagues reported that in the 2005 NIST evaluation the system human judges ranked first was ranked only sixth by BLEU.
false_statement: Callison-Burch and colleagues reported that in the 2005 NIST evaluation the system BLEU ranked first was ranked only sixth by human judges.
explanation: BLEU gives no credit for synonyms or paraphrases, so a good translation worded differently from the references scores low. Their conclusion was that a higher BLEU is neither necessary nor sufficient for better translation, and it is safest for comparing similar systems.
