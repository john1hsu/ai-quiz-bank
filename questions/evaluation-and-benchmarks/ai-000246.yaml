true_statement: Each CommonsenseQA question's hard distractors are other ConceptNet targets sharing the same source concept and relation as the correct answer.
false_statement: Each CommonsenseQA question's hard distractors are random ConceptNet concepts unrelated to the source concept and relation of the correct answer.
explanation: Because the wrong options relate to the question's concept in the same way as the right one, a shallow association cannot pick the answer. When the authors swapped in random distractors, BERT-large jumped above 92%, showing the difficulty came from those carefully chosen options.
