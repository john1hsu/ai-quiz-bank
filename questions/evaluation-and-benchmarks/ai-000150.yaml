true_statement: BEIR's headline metric is nDCG@10, chosen because it works with both binary and graded relevance labels across its mixed datasets.
false_statement: BEIR's headline metric is MRR@10, chosen because it works with both binary and graded relevance labels across its mixed datasets.
explanation: Normalised discounted cumulative gain rewards putting highly relevant documents near the top and can use graded judgments, which some BEIR datasets have. Mean reciprocal rank only looks at the first relevant hit and is offered in the package as an extra metric, not the headline one.
