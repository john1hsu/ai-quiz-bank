true_statement: In the 2020 MMLU paper, the largest GPT-3 model averaged 43.9% few-shot, while smaller GPT-3 variants stayed near the 25% chance level.
false_statement: In the 2020 MMLU paper, the largest GPT-3 model averaged 89.8% few-shot, while smaller GPT-3 variants stayed near the 25% chance level.
explanation: 89.8% was the authors' estimate of expert-level accuracy, far above what GPT-3 managed. That only the 175B model rose clearly above chance made MMLU an early example of scale-dependent jumps in ability.
