true_statement: SacreBLEU scores detokenized output using its own internal WMT-standard tokenization and prints a signature of its settings, so BLEU numbers can be compared across papers.
false_statement: SacreBLEU scores output pre-tokenized by each researcher's own tokenizer and prints a signature of its settings, so BLEU numbers can be compared across papers.
explanation: Matt Post showed that tokenization, casing and reference choices could move BLEU by up to 1.8 points, often more than a new method's claimed gain. Taking preprocessing out of users' hands is what makes the numbers comparable.
