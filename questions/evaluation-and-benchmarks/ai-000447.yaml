true_statement: InstructGPT's labelers ranked several model outputs from best to worst, and those rankings were used to train a reward model.
false_statement: InstructGPT's labelers scored each model output on a Likert scale, and those absolute ratings were used to train a reward model.
explanation: Ranking is one of three common human-evaluation formats, alongside absolute ratings and pairwise preferences. Relative judgments are easier for raters to make consistently than absolute scores, and they turn naturally into the comparison data a reward model learns from in RLHF.
