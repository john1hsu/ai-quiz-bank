true_statement: BLEU multiplies its score by a brevity penalty because n-gram precision alone would reward translations that are too short.
false_statement: BLEU multiplies its score by a brevity penalty because n-gram recall alone would reward translations that are too short.
explanation: A one-word output whose word appears in the reference has perfect precision, so BLEU needs a length check. Recall would punish short output on its own, but BLEU does not measure recall directly; the penalty is its only stand-in, applied over the whole corpus rather than per sentence.
