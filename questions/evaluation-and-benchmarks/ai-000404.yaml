true_statement: In SWE-bench grading, FAIL_TO_PASS tests must fail before the fix and pass after it, while PASS_TO_PASS tests must pass both before and after.
false_statement: In SWE-bench grading, PASS_TO_PASS tests must fail before the fix and pass after it, while FAIL_TO_PASS tests must pass both before and after.
explanation: The first set checks that the patch actually fixes the issue; the second guards against a patch that fixes it by breaking other behaviour. A task counts as resolved only if the patch applies cleanly and both sets pass.
