topic: Attention Is All You Need
topic_type: Work
maturity: foundational
true_statement: The Transformer paper put self-attention's per-layer cost at O(n²·d) against O(n·d²) for recurrence, so attention is cheaper when sequence length n is below width d.
false_statement: The Transformer paper put self-attention's per-layer cost at O(n²·d) against O(n·d²) for recurrence, so attention is cheaper when sequence length n is above width d.
explanation: Attention compares every pair of positions, so its cost grows with the square of sequence length, while needing only one sequential step. For typical sentences shorter than the 512-wide representations this wins; for very long inputs the advantage shrinks, which the authors flagged as future work.
