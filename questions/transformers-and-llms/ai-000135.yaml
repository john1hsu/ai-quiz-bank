true_statement: Sardana et al. (2024) found that once inference demand is counted, heavily used models should be smaller and trained on more tokens than Chinchilla-optimal.
false_statement: Sardana et al. (2024) found that once inference demand is counted, heavily used models should be larger and trained on fewer tokens than Chinchilla-optimal.
explanation: Chinchilla minimises training compute only, but a model served a billion times pays for its size on every request. Extra training is a one-off cost that buys a cheaper model to run, and quality kept rising up to 10,000 tokens per parameter.
