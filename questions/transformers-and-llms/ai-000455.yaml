true_statement: In 2015 Bahdanau and colleagues' RNNsearch-50 scored 26.75 BLEU on WMT '14 English-to-French, far above a plain encoder-decoder's 17.82 but still below the phrase-based Moses system.
false_statement: In 2015 Bahdanau and colleagues' RNNsearch-50 scored 26.75 BLEU on WMT '14 English-to-French, far above a plain encoder-decoder's 17.82 and also above the phrase-based Moses system.
explanation: Attention gave a large jump over the fixed-vector encoder-decoder, but on the full test set the first attention model had not yet overtaken mature phrase-based statistical translation. Its significance was the direction it opened, not an immediate win over every system.
