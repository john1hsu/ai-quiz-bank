topic: Self-attention
topic_type: Architecture
maturity: established
true_statement: 'Self-attention on its own ignores token order: shuffling the input tokens just shuffles the outputs the same way, so order must be added with positional encodings.'
false_statement: 'Self-attention on its own captures token order: shuffling the input tokens changes every output, so positional encodings are an optional extra.'
explanation: Each output is a weighted sum over all tokens, and the weights depend only on content, not position. Without positional encodings, learned or sinusoidal, a transformer would see a sentence as a bag of tokens.
