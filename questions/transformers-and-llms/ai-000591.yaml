true_statement: In the ALiBi paper's WikiText-103 tests, a sinusoidal model trained on 512 tokens improved for only about 20 extra tokens, while rotary embeddings stretched this to about 200.
false_statement: In the ALiBi paper's WikiText-103 tests, a rotary model trained on 512 tokens improved for only about 20 extra tokens, while sinusoidal embeddings stretched this to about 200.
explanation: Neither scheme extrapolated far past its training length, which motivated ALiBi's distance penalty on attention scores. Rotary did better than sinusoids, and later methods like position interpolation patched RoPE further.
