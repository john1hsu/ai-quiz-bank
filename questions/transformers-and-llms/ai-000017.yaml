true_statement: Kaplan et al. (2020) found language-model loss falls as a smooth power law in model size, data and compute, while width versus depth matters little.
false_statement: Kaplan et al. (2020) found language-model loss falls as a smooth power law in model size, data and compute, while width versus depth matters most.
explanation: The trend held across more than seven orders of magnitude, and architectural details like the width-to-depth ratio mattered little within a broad range. Scale itself was the main lever, which shaped how labs spent compute.
