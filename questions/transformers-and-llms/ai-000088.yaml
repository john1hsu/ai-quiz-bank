true_statement: Wei et al. (2022) borrowed the idea of emergence from physicist Philip Anderson's 1972 essay More Is Different.
false_statement: Wei et al. (2022) borrowed the idea of emergence from physicist Richard Feynman's 1972 essay More Is Different.
explanation: Anderson's point was that quantitative change in a system can produce qualitative change in behaviour. Wei et al. applied it to language models whose task scores sit at chance until some scale, then jump.
