true_statement: In 2024 the RULER benchmark found that only about half of 17 models claiming context windows of at least 32K tokens performed satisfactorily at 32K.
false_statement: In 2024 the RULER benchmark found that all but one of 17 models claiming context windows of at least 32K tokens performed satisfactorily at 32K.
explanation: RULER added multi-needle, multi-hop tracing and aggregation tasks because the simple needle-in-a-haystack test only checks shallow retrieval. Models that nearly aced that basic test still degraded as length and difficulty grew, separating advertised from effective context.
