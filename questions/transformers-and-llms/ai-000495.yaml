topic: KV cache
topic_type: Technique
maturity: established
true_statement: A KV cache keeps earlier tokens' keys and values but not their queries, since each decoding step attends only from the current token's query over the cached prefix.
false_statement: A KV cache keeps earlier tokens' queries and keys but not their values, since each decoding step attends only from the current token's value over the cached prefix.
explanation: At each decode step only the new token asks the question (its query); every earlier token contributes its key, to be scored, and its value, to be averaged. So keys and values are worth storing, while old queries are never used again.
