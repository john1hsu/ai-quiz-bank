topic: Language Models are Few-Shot Learners
topic_type: Work
maturity: foundational
true_statement: A filtering bug left some benchmark test data in GPT-3's training set, so the authors scored the model on clean subsets instead of retraining it.
false_statement: A filtering bug left some benchmark test data in GPT-3's training set, so the authors removed the overlap and retrained the model before scoring it.
explanation: Retraining a 175-billion-parameter model was too expensive, so the authors compared scores on contaminated and clean subsets. Most benchmarks barely moved, though PIQA and Winograd were flagged, which made the paper an early case study in contamination analysis.
