true_statement: In the 2017 Transformer paper, learned position embeddings performed nearly the same as sinusoids, but the authors kept sinusoids hoping they would extrapolate to longer sequences.
false_statement: In the 2017 Transformer paper, sinusoids performed nearly the same as learned position embeddings, but the authors kept learned embeddings hoping they would extrapolate to longer sequences.
explanation: A learned table has no entry for positions beyond the training length, while a sine-and-cosine formula can be evaluated at any position. The hope was reasonable, but later tests showed sinusoids extrapolate only a little.
