topic: Transformer architecture
topic_type: Architecture
maturity: established
true_statement: Xiong et al. (2020) showed that Post-LN Transformers have large gradients near the output at initialization, so they need learning-rate warm-up, while Pre-LN ones can train without it.
false_statement: Xiong et al. (2020) showed that Pre-LN Transformers have large gradients near the output at initialization, so they need learning-rate warm-up, while Post-LN ones can train without it.
explanation: The original Transformer normalized after each residual addition (Post-LN). Moving layer normalization inside the residual branch (Pre-LN) keeps gradients well behaved, which is why later models such as LLaMA normalize sub-layer inputs.
