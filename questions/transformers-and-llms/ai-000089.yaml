true_statement: 'Schaeffer et al. (2023) argued many emergent abilities are metric artefacts: re-scoring with token edit distance instead of exact match gave smooth curves.'
false_statement: 'Schaeffer et al. (2023) argued many emergent abilities are metric artefacts: re-scoring with exact match instead of token edit distance gave smooth curves.'
explanation: Exact match is all-or-nothing, so steady per-token gains show up as a sudden jump once whole answers come out right. A continuous metric reveals the gradual improvement underneath, though the authors did not claim emergence is impossible.
