true_statement: The 2019 RoBERTa study concluded BERT was significantly undertrained, and a more carefully tuned recipe matched or beat every model published after BERT on GLUE, RACE and SQuAD.
false_statement: The 2019 RoBERTa study concluded BERT was significantly overtrained, and a shorter, lighter recipe matched or beat every model published after BERT on GLUE, RACE and SQuAD.
explanation: Liu and colleagues showed many of BERT's gains-to-be were hiding in training choices and hyperparameters, not new architectures. It is a reminder that a baseline's recipe needs tuning before newer methods are credited with beating it.
