true_statement: Decoder-only Transformers apply a causal mask that sets attention scores for future positions to negative infinity, so each token can attend only to earlier tokens.
false_statement: Encoder-only Transformers apply a causal mask that sets attention scores for future positions to negative infinity, so each token can attend only to earlier tokens.
explanation: The causal mask is what makes a decoder-only model a left-to-right generator that can still train on all positions in parallel. Encoder-only models such as BERT use no mask, so every token sees both left and right context.
