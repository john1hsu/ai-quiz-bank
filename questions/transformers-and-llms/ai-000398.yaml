true_statement: Cheng, Dong and Lapata's Long Short-Term Memory-Network (EMNLP 2016) was an early form of self-attention, scoring each token against all earlier hidden states.
false_statement: Cheng, Dong and Lapata's Long Short-Term Memory-Network (EMNLP 2019) was an early form of self-attention, scoring each token against all earlier hidden states.
explanation: Attention between two sequences came first; attending within one sequence emerged around 2016, a year before the Transformer. The LSTMN replaced the LSTM's single memory cell with a tape of one vector per earlier token, so 2019 is too late to be a precursor.
