true_statement: In 2011 Collobert, Weston and colleagues used one neural architecture for tagging, chunking, named-entity recognition and semantic role labeling, learning representations from mostly unlabeled text.
false_statement: In 2011 Collobert, Weston and colleagues used one neural architecture for tagging, chunking, named-entity recognition and semantic role labeling, relying on hand-engineered, task-specific features.
explanation: 'This work marked NLP''s neural turn: instead of crafting features for each task, a single network learned shared internal representations, largely from unlabeled text. Hand-engineered features were exactly what it set out to replace.'
