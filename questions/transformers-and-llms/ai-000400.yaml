maturity: established
true_statement: Jain and Wallace (NAACL 2019) found attention weights often correlate poorly with gradient-based importance, and quite different attention patterns can give the same prediction.
false_statement: Jain and Wallace (NAACL 2019) found attention weights closely track gradient-based importance, and quite different attention patterns always change the prediction.
explanation: If very different attention maps can produce the same output, a map cannot be taken as the reason for that output. Their result is why raw attention heatmaps should not be read as faithful explanations of model behaviour.
