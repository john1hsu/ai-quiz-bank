true_statement: Liu et al. found long-context models answered best when the relevant information sat at the start or end of the input, and markedly worse when it sat in the middle.
false_statement: Liu et al. found long-context models answered best when the relevant information sat in the middle of the input, and markedly worse when it sat at the start or end.
explanation: This U-shaped "lost in the middle" curve held even for models built for long contexts. It means a big window is not used evenly, so in retrieval pipelines where you place the key passages matters, not just whether they fit.
