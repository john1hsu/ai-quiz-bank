true_statement: Du et al. (2024) found that language models with the same pretraining loss performed similarly on tasks, whatever their parameter and data counts.
false_statement: Du et al. (2024) found that language models with the same parameter count performed similarly on tasks, whatever their pretraining loss.
explanation: This suggests loss, not size, is the better scale variable for predicting when a capability appears. Even with continuous metrics some tasks stayed near chance until loss fell below a threshold, so not all emergence is a metric artefact.
