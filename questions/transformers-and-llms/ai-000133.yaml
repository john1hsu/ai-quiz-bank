true_statement: Kaplan et al. (2020) advised growing model size much faster than data as compute rises, whereas Hoffmann et al. (2022) found parameters and tokens should scale equally.
false_statement: Hoffmann et al. (2022) advised growing model size much faster than data as compute rises, whereas Kaplan et al. (2020) found parameters and tokens should scale equally.
explanation: Kaplan's fits implied model size growing about as C^0.73 and data only as C^0.27, favouring huge, undertrained models. DeepMind's Chinchilla study, with three estimation methods, concluded that doubling the model should mean doubling the data.
