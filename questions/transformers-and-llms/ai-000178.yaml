true_statement: In 2017 the large Transformer scored 28.4 BLEU on WMT 2014 English-German translation, more than 2 points above previous results including ensembles.
false_statement: In 2017 the large Transformer scored 41.0 BLEU on WMT 2014 English-German translation, more than 2 points above previous results including ensembles.
explanation: 41.0 was the large model's English-French score, a different and easier language pair. The German result mattered because a single attention-only model beat ensembles of recurrent and convolutional systems while training in about 3.5 days on eight GPUs.
