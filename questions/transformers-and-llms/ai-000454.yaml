true_statement: Xu et al.'s Show, Attend and Tell (ICML 2015) carried attention into image captioning, attending over regions of convolutional image features as each word was generated.
false_statement: Luong et al.'s Show, Attend and Tell (ICML 2015) carried attention into image captioning, attending over regions of convolutional image features as each word was generated.
explanation: 'Xu and colleagues showed that attention was not tied to translation: the decoder could look at image regions instead of source words. Luong, Pham and Manning wrote a 2015 translation paper on attention scoring, which makes the names easy to mix up.'
