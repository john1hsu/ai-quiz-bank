id: ai-000353
area: transformers-and-llms
kind: definition
topic: In-context learning
topic_type: Concept
maturity: established
true_statement: In-context learning picks up a task from instructions or demonstrations placed in the prompt, within a forward pass and with the model's weights left unchanged.
false_statement: In-context learning picks up a task from instructions or demonstrations placed in the prompt, by taking a few gradient steps that update the model's weights.
explanation: In-context learning changes only the input, never the parameters, which is what separates it from fine-tuning. That is why one deployed model can switch tasks just by changing its prompt, even though its training only ever asked it to predict the next token.
