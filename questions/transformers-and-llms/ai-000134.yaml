true_statement: In 2022 DeepMind's 70-billion-parameter Chinchilla, given the same compute as the 280-billion-parameter Gopher, beat it by training on four times more data.
false_statement: In 2022 DeepMind's 280-billion-parameter Chinchilla, given the same compute as the 70-billion-parameter Gopher, beat it by training on four times more data.
explanation: Chinchilla was the smaller model, trained at roughly 20 tokens per parameter. Its win over Gopher, GPT-3 and Megatron-Turing NLG showed that many large models of the time were undertrained for their size.
