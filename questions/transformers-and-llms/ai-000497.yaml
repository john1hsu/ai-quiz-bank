true_statement: The grouped-query attention authors reported that uptraining multi-head checkpoints with about 5% of pre-training compute gave quality close to multi-head attention at speeds near multi-query attention.
false_statement: The grouped-query attention authors reported that uptraining multi-head checkpoints with about 5% of pre-training compute gave quality close to multi-query attention at speeds near multi-head attention.
explanation: 'Grouped-query attention sits between the two extremes and aims for the best of each: the quality of full multi-head attention and the speed of a single shared key-value head. The false twin swaps which property comes from which end.'
