maturity: foundational
true_statement: GPT-3 kept GPT-2's architecture but alternated dense attention layers with locally banded sparse attention layers, in the style of the Sparse Transformer.
false_statement: GPT-3 kept GPT-2's architecture but replaced every dense attention layer with locally banded sparse attention, in the style of the Sparse Transformer.
explanation: 'The only architectural change from GPT-2 was interleaving: dense and sparse layers alternate rather than all layers going sparse. Banded sparse attention trims the cost of attending over a long context while the dense layers keep full token-to-token access.'
