id: ai-000265
area: transformers-and-llms
kind: definition
topic: Neural Machine Translation by Jointly Learning to Align and Translate
topic_type: Work
maturity: foundational
true_statement: Bahdanau attention lets a translation decoder build a fresh context vector from all source positions at every output step, instead of relying on one fixed-length sentence vector.
false_statement: Bahdanau attention lets a translation decoder build one context vector from all source positions per sentence, then reuse that fixed-length vector at every output step.
explanation: Plain encoder-decoders squeezed the whole source into a single vector, a bottleneck that hurt long sentences. Recomputing the context per target word lets the decoder look at whichever source words matter right now.
