topic: Positional encoding
topic_type: Technique
maturity: established
true_statement: Rotary position embedding rotates slices of each query and key by an angle proportional to the token's position, so their dot product depends only on the offset between tokens.
false_statement: Rotary position embedding rotates slices of each query and key by an angle proportional to the token's position, so their dot product depends on each token's absolute position.
explanation: Rotating both sides means the angles subtract in the dot product, leaving only m − n. RoPE therefore encodes absolute positions yet yields relative attention, which is why it became the scheme behind models such as LLaMA.
