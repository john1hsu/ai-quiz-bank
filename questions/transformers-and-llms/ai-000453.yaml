topic: Attention mechanism
topic_type: Architecture
maturity: foundational
true_statement: Luong and colleagues' local attention looks only at a window centred on a predicted aligned source position, while their global attention looks at every source position.
false_statement: Luong and colleagues' global attention looks only at a window centred on a predicted aligned source position, while their local attention looks at every source position.
explanation: Local attention narrows the softmax to a Gaussian-weighted window around where the model predicts the alignment is, cutting cost; global attention is the full version that scores every source word. The names describe scope, so the false twin has them backwards.
