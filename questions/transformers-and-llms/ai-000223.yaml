id: ai-000223
area: transformers-and-llms
kind: mechanism
topic: Context window
topic_type: Concept
maturity: established
true_statement: Position Interpolation extends a RoPE model's context by rescaling position indices so a longer input fits inside the range seen in training, rather than extrapolating beyond it.
false_statement: Position Interpolation extends a RoPE model's context by letting position indices run past the range seen in training, rather than rescaling them to fit inside it.
explanation: Running past the trained length can produce huge attention scores that break self-attention, while interpolating keeps positions familiar. Chen et al. bounded interpolation's error far below extrapolation's and stretched LLaMA models to 32,768 tokens with at most 1,000 fine-tuning steps.
