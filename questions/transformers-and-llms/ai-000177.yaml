topic: Attention Is All You Need
topic_type: Work
maturity: foundational
true_statement: Scaled dot-product attention divides QKᵀ by √d_k because large dot products would push the softmax into regions with tiny gradients.
false_statement: Scaled dot-product attention divides QKᵀ by √d_k because small dot products would make the softmax weights fail to sum to one.
explanation: As the key dimension grows, raw dot products grow in magnitude, so the softmax saturates toward a near one-hot output whose gradients vanish. Scaling keeps the scores in a range where learning still works; the softmax sums to one regardless of scale.
