topic: KV cache
topic_type: Technique
maturity: established
true_statement: Multi-query attention has all query heads share a single key-value head, while grouped-query attention uses an intermediate number of key-value heads.
false_statement: Grouped-query attention has all query heads share a single key-value head, while multi-query attention uses an intermediate number of key-value heads.
explanation: Both shrink the KV cache by storing fewer key-value heads than query heads. Multi-query is the extreme with just one, and grouped-query, published at EMNLP 2023, sits between it and full multi-head attention, which is why the names are easy to swap.
