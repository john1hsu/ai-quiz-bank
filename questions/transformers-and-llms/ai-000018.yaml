true_statement: Perplexity, the exponential of the mean cross-entropy, is only comparable between language models that share the same tokenizer.
false_statement: Perplexity, the exponential of the mean cross-entropy, is comparable between any two language models whatever tokenizers they use.
explanation: Perplexity is computed per token, so models that split text into different tokens are scored on different units. A model with longer tokens faces a harder per-token prediction, which makes cross-tokenizer comparisons misleading.
