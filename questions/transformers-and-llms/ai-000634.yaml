true_statement: In BERT's next sentence prediction, the second sentence is the real next sentence half the time and a random one otherwise, and a classifier on the classification token predicts which.
false_statement: In BERT's next sentence prediction, the second sentence is the real next sentence half the time and a random one otherwise, and a classifier on the separator token predicts which.
explanation: The special classification token's final vector summarises the whole input, which is why sentence-level heads sit on it. Both NSP labels come free from raw text, and dropping NSP lowered BERT's scores on QNLI, MNLI and SQuAD in the paper's ablation.
