topic: Sequence-to-sequence learning
topic_type: Paradigm
maturity: established
true_statement: With teacher forcing, a seq2seq decoder is trained on the ground-truth target shifted right by one position, starting with a beginning-of-sequence token.
false_statement: With teacher forcing, a seq2seq decoder is trained on its own earlier predictions shifted right by one position, starting with a beginning-of-sequence token.
explanation: Feeding the true previous tokens during training keeps each step's input correct even while the model's own guesses are still poor. Only at inference does the decoder consume its own predictions, stopping when it emits the end-of-sequence token.
