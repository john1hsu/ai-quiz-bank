kind: mechanism
topic: In-context learning
topic_type: Concept
maturity: established
true_statement: An induction head is an attention circuit that finds an earlier occurrence of the current token and copies the token that followed it.
false_statement: An induction head is an attention circuit that finds an earlier occurrence of the current token and copies the token that preceded it.
explanation: Copying what came next last time lets a model continue a pattern it has already seen in the prompt, a simple form of learning from context. Anthropic researchers linked these heads to in-context learning; copying the preceding token would not help predict what comes next.
