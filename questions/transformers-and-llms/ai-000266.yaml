true_statement: In RNNsearch, a small feed-forward network scores the previous decoder state against each encoder annotation, which is why Bahdanau attention is called additive attention.
false_statement: In RNNsearch, a scaled dot product scores the previous decoder state against each encoder annotation, which is why Bahdanau attention is called multiplicative attention.
explanation: 'The score is v_a tanh(W_a s + U_a h): the two vectors are projected and added inside a learned network. That lets training decide which similarities matter and lets encoder and decoder vectors differ in size, unlike a plain dot-product score.'
