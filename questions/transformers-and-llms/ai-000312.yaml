true_statement: As of 2026, almost no large Transformer language models use anything but standard quadratic attention, because cheaper attention variants often underperform at scale.
false_statement: As of 2026, most large Transformer language models have replaced standard quadratic attention, because cheaper attention variants usually match it at scale.
explanation: Self-attention compares every pair of positions, so cost grows with the square of sequence length and limits the context window. Many sub-quadratic variants exist, but Stanford's CS224N notes they rarely survive at scale, so better long-context designs remain an open question.
