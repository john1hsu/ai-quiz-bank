true_statement: EO 13859, signed in February 2019, launched the American AI Initiative and set five guiding principles for US federal AI policy.
false_statement: EO 14110, signed in February 2019, launched the American AI Initiative and set five guiding principles for US federal AI policy.
explanation: EO 13859 was an early AI-focused order; its principles covered research, technical standards, workforce training, public trust and protecting US technological advantage. EO 14110 came later, in October 2023, and was far broader, with eight guiding principles and tasks for dozens of agencies.
