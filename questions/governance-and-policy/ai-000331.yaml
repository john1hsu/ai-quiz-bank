true_statement: 'Dafoe''s AI governance research agenda has three clusters: the technical landscape, AI politics, and ideal governance, which asks what institutions would best ensure beneficial AI.'
false_statement: 'Dafoe''s AI governance research agenda has three clusters: the technical landscape, AI politics, and ideal governance, which asks what AI will be able to do and when.'
explanation: Forecasting what AI can do and when belongs to the technical landscape cluster. Ideal governance is the normative part, asking which norms, institutions and systems should steer AI toward beneficial use.
