topic: Algorithmic bias and fairness
topic_type: Risk
maturity: established
true_statement: Demographic parity requires equal acceptance rates across groups, while equalized odds requires equal true-positive and false-positive rates across groups.
false_statement: Equalized odds requires equal acceptance rates across groups, while demographic parity requires equal true-positive and false-positive rates across groups.
explanation: Demographic parity (independence) ignores the true outcome, so it can be met by accepting random people in one group. Equalized odds (separation), from Hardt, Price and Srebro, conditions on the outcome and so allows a perfect predictor.
