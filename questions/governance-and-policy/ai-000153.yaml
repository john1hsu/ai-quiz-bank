true_statement: OMB memo M-25-21 merged M-24-10's two risk categories, safety-impacting and rights-impacting AI, into a single category of high-impact AI.
false_statement: OMB memo M-25-21 split M-24-10's single category of high-impact AI into two risk categories, safety-impacting and rights-impacting AI.
explanation: The 2024 memo sorted risky federal AI into two buckets; the April 2025 rewrite kept the idea of minimum practices but folded both into high-impact AI, meaning AI whose output is a principal basis for decisions with significant effects on rights or safety.
