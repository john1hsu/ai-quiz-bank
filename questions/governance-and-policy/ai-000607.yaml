topic: Council of Europe Framework Convention on Artificial Intelligence
topic_type: Policy
maturity: emerging
true_statement: The Council of Europe adopted its Framework Convention on AI in May 2024 and opened it for signature that September, calling it the first legally binding international AI treaty.
false_statement: The European Union adopted its Framework Convention on AI in May 2024 and opened it for signature that September, calling it the first legally binding international AI treaty.
explanation: The Council of Europe is a separate, larger human-rights body with 46 member states; the EU was a negotiator and early signatory, not the author. Unlike the EU AI Act, the convention is a treaty open to non-European countries, and the United States signed on day one.
