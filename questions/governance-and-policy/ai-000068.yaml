topic: AI safety institutes
topic_type: Organization
maturity: emerging
true_statement: Because AI safety institutes depend on developers' voluntary commitments for model access, critics warn their close ties to labs risk regulatory capture.
false_statement: Because AI safety institutes can legally compel developers to hand over models, critics warn their close ties to labs risk regulatory overreach.
explanation: First-wave institutes have no regulatory or enforcement powers, so testing happens only with the labs' cooperation. Critics fear that dependence can soften scrutiny and ease pressure for binding rules.
