true_statement: The October 2023 update to US AI chip export controls dropped interconnect bandwidth as a criterion and added a performance density test.
false_statement: The October 2023 update to US AI chip export controls dropped performance density as a criterion and added an interconnect bandwidth test.
explanation: Chips are caught by technical thresholds, not product names. Vendors had shipped chips that kept high compute but cut interconnect speed to stay under the 2022 limits; testing performance per unit of die area closed that loophole.
