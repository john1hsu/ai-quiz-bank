true_statement: The OECD AI Principles set out five values-based principles addressed to all AI actors, plus five recommendations addressed to governments.
false_statement: The OECD AI Principles set out five values-based principles addressed to governments, plus five recommendations addressed to all AI actors.
explanation: Values such as transparency, robustness and accountability apply to everyone who takes part in an AI system's lifecycle. The policy recommendations, such as investing in research and preparing the labour market, are things only governments can do.
