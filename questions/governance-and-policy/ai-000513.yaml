true_statement: Model cards were proposed by Margaret Mitchell, Timnit Gebru and colleagues, most of them at Google, in the paper Model Cards for Model Reporting at FAT* 2019.
false_statement: Model cards were proposed by Margaret Mitchell, Timnit Gebru and colleagues, most of them at Microsoft, in the paper Model Cards for Model Reporting at FAT* 2019.
explanation: The Google-based team argued that models were entering high-stakes uses such as hiring and health care with no standard way to report how they perform, so biases surfaced only after deployment. Their one-to-two-page cards became a template that Hugging Face and others adopted.
