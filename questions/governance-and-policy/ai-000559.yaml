true_statement: The OECD Council adopted its Recommendation on Artificial Intelligence in May 2019, and the following month G20 leaders in Osaka welcomed G20 AI Principles drawn from it.
false_statement: G20 leaders in Osaka adopted the G20 AI Principles in May 2019, and the following month the OECD Council drew its Recommendation on Artificial Intelligence from them.
explanation: The OECD text came first and the G20 borrowed from it, which is how the principles reached large economies outside the OECD. The OECD describes its Recommendation as the first intergovernmental standard on AI.
