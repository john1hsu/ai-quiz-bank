topic: OMB AI memoranda
topic_type: Policy
maturity: emerging
true_statement: The OMB AI memoranda govern only US federal agencies' own use and purchasing of AI, whereas the EU AI Act regulates AI placed on the private market.
false_statement: The OMB AI memoranda regulate AI products sold on the private US market, whereas the EU AI Act governs only EU institutions' own use of AI.
explanation: OMB directs executive agencies, so its memos bind agencies directly, with deadlines, named officials and the power to stop a non-compliant system, but they say nothing to private companies selling to the public. The EU AI Act is market regulation aimed at providers and deployers generally.
