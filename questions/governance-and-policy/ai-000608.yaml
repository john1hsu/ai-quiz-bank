topic: Council of Europe Framework Convention on Artificial Intelligence
topic_type: Policy
maturity: emerging
true_statement: The Council of Europe AI Convention applies fully to public authorities, while for other private-sector activity each party declares whether to apply its principles directly or by other measures.
false_statement: The Council of Europe AI Convention applies fully to private companies, while for public authorities each party declares whether to apply its principles directly or by other measures.
explanation: The private-sector option was a negotiated compromise, and commentators such as Marc Rotenberg flag it as one reason the treaty's obligations are less direct than a regulation's. Public bodies, and private firms acting for them, get no such choice.
