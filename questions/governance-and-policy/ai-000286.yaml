area: governance-and-policy
kind: definition
topic: Compute governance
topic_type: Concept
maturity: emerging
true_statement: Compute governance treats compute as a policy lever because, unlike data and algorithms, its use is detectable, access is excludable, it is quantifiable and its supply chain is concentrated.
false_statement: Compute governance treats data as a policy lever because, unlike compute and algorithms, its use is detectable, access is excludable, it is quantifiable and its supply chain is concentrated.
explanation: Sastry, Heim and co-authors argued in 2024 that data and algorithms are easy to copy and hard to observe, whereas chips are physical, countable and made by very few producers. That is what makes reporting, allocation and export controls workable.
