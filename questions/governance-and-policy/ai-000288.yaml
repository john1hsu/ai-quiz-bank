true_statement: Sara Hooker argues fixed training-compute thresholds are shortsighted because the link between compute and risk is uncertain and shifting.
false_statement: Sara Hooker argues fixed training-compute thresholds are reliable because the link between compute and risk is predictable and stable.
explanation: Compute is only a good proxy for risk while capability rises predictably with scale, the scaling-law assumption Hooker challenges. Efficiency gains also erode any fixed cut-off, and small narrow models can still be dangerous.
