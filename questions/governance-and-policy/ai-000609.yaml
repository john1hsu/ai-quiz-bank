topic: Council of Europe Framework Convention on Artificial Intelligence
topic_type: Policy
maturity: emerging
true_statement: The Council of Europe AI Convention leaves national defence outside its scope, and parties need not apply it to national security activities so long as they respect international law.
false_statement: The Council of Europe AI Convention brings national defence fully within its scope, though parties need not apply it to national security activities so long as they respect international law.
explanation: Defence and security carve-outs were the price of getting many states to sign. Research on systems not yet available for use is also excluded unless testing could interfere with rights, democracy or the rule of law.
