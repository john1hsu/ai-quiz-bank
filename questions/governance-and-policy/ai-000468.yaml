true_statement: ISO/IEC 42001, the international standard for AI management systems, was developed by the joint ISO/IEC committee JTC 1/SC 42 and published in December 2023.
false_statement: ISO/IEC 42001, the international standard for AI management systems, was developed by the joint ISO/IEC committee JTC 1/SC 42 and published in December 2021.
explanation: Edition 1.0 appeared on 18 December 2023, and ISO promoted it as the first AI management system standard. Its certification companion, ISO/IEC 42006 for audit bodies, followed in July 2025.
