true_statement: In December 2025 the International Network of AI Safety Institutes renamed itself around advanced AI measurement, evaluation and science, with the UK as coordinator.
false_statement: In December 2025 the International Network of AI Safety Institutes renamed itself around advanced AI measurement, evaluation and science, with the US as coordinator.
explanation: The ten-member network launched in November 2024 and, at a meeting alongside NeurIPS in San Diego, refocused on shared methods for measuring capabilities. The new name mirrors the wider 2025 shift away from 'safety' branding.
