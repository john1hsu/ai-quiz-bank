topic: Algorithmic bias and fairness
topic_type: Risk
maturity: established
true_statement: Kleinberg and colleagues proved that calibration within groups and balance for both outcome classes can all hold only with perfect prediction or equal base rates.
false_statement: Kleinberg and colleagues proved that calibration within groups and balance for both outcome classes can all hold whenever every group is well represented in the training data.
explanation: When groups differ in base rates, any imperfect predictor must trade one criterion against another. Choosing a fairness metric is therefore a value judgement about which errors matter, not something more data can settle.
