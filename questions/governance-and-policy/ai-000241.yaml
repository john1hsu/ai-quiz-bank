true_statement: The Export Control Reform Act of 2018 gave BIS permanent authority, after decades in which US export controls were mostly kept in force under emergency powers.
false_statement: The Export Control Reform Act of 2018 gave BIS authority that expires after five years, after decades in which US export controls rested on a permanent statute.
explanation: The Export Administration Act of 1979 lapsed, so controls ran under the International Emergency Economic Powers Act. ECRA put them on a permanent footing with no expiry and was the first export statute to treat economic security as part of national security.
