true_statement: In September 2024 BIS proposed quarterly reports from US developers of AI models trained with more than 10^26 operations, covering training plans, weight security and red-team results.
false_statement: In September 2024 BIS proposed quarterly reports from US developers of AI models trained with more than 10^20 operations, covering training plans, weight security and red-team results.
explanation: The rule used Defense Production Act information-gathering powers to implement Executive Order 14110, using training compute as a proxy for frontier capability. That order was revoked in January 2025, removing the basis the proposal was written for.
