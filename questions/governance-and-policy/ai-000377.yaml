true_statement: US executive orders on AI bind only the executive branch, cannot override statutes, and can be revoked by the next President.
false_statement: US executive orders on AI bind private developers as well as agencies, override conflicting statutes, and can be revoked only by Congress.
explanation: 'An executive order is an instruction from the President to federal agencies, so its reach over companies comes only through follow-on rules, guidance and procurement terms. That is also why it is fragile: a new President can rescind it, as happened to EO 14110 within days in January 2025.'
