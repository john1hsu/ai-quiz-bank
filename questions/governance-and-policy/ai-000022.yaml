true_statement: The NIST AI RMF Core has four functions, Govern, Map, Measure and Manage, and Govern cuts across the other three.
false_statement: The NIST AI RMF Core has four functions, Govern, Map, Measure and Manage, and Manage cuts across the other three.
explanation: Govern sets the culture, policies and accountability that inform everything else. Map sets context, Measure assesses risks, and Manage prioritises and responds to them; a typical user sets up Govern, starts with Map, then iterates Measure and Manage.
