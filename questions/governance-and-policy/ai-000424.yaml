topic: EU AI Act
topic_type: Policy
maturity: emerging
true_statement: Veale and Zuiderveen Borgesius warned that under the draft AI Act most high-risk systems could be certified by the provider's own self-assessment.
false_statement: Veale and Zuiderveen Borgesius warned that under the draft AI Act most high-risk systems would need certification by an independent third-party auditor.
explanation: Their critique was that the Act borrows the New Legislative Framework built for goods like lifts and toys, where self-assessment against harmonised standards is common. That shifts real rule-making to private standards bodies, a dependence the later deadline extensions tied to standards readiness bear out.
