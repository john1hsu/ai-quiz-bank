true_statement: From January 2026, US licence review for exporting chips such as NVIDIA's H200 to China shifted from a presumption of denial to case-by-case review.
false_statement: From January 2026, US licence review for exporting chips such as NVIDIA's H200 to China shifted from case-by-case review to a presumption of denial.
explanation: The 2026 rule moved toward conditional sales for chips below set performance thresholds, with caps tied to US shipments, independent lab testing and customer checks. Chips above the thresholds stay under a presumption of denial, showing how the regime keeps being redesigned.
