true_statement: Jobin, Ienca and Vayena's review of 84 AI ethics guidelines found convergence on five themes, yet no single principle appeared in every document.
false_statement: Jobin, Ienca and Vayena's review of 84 AI ethics guidelines found convergence on five themes, with transparency appearing in every document.
explanation: Transparency, justice and fairness, non-maleficence, responsibility and privacy recurred, but none was universal, and authors disagreed on what the terms mean and how to implement them. It is a core piece of evidence for the critique that principles outran enforceable practice.
