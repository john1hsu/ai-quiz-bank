topic: AI chip export controls
topic_type: Policy
maturity: emerging
true_statement: US AI chip export controls began with an interim final rule from the Commerce Department's Bureau of Industry and Security on 7 October 2022.
false_statement: US AI chip export controls began with an interim final rule from the Defense Department's Defense Technology Security Administration on 7 October 2022.
explanation: Export controls on dual-use items sit under the Export Administration Regulations, which Commerce's BIS writes and enforces. The 2022 rule justified the controls on national-security grounds and set a presumption of denial for licences to China.
