topic: EU AI Act
topic_type: Policy
maturity: emerging
true_statement: As of 2026, the EU AI Act presumes a general-purpose AI model has systemic risk when its cumulative training compute exceeds 10^25 floating-point operations.
false_statement: As of 2026, the EU AI Act presumes a general-purpose AI model has systemic risk when its cumulative training compute exceeds 10^27 floating-point operations.
explanation: Training compute is used as a proxy for high-impact capabilities, and crossing 10^25 FLOPs triggers extra evaluation and risk-mitigation duties on top of the baseline duties every GPAI provider has. The false statement puts the bar a hundred times higher than the Act does.
