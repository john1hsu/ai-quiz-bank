true_statement: At its May 2024 revision, the OECD AI Recommendation had 47 adherents, including the European Union, up from 42 countries at its 2019 launch.
false_statement: At its May 2024 revision, the OECD AI Recommendation had 74 adherents, including the European Union, up from 42 countries at its 2019 launch.
explanation: Adherence is a voluntary political commitment, not a treaty, so the list grows as governments sign on. Some G20 members, such as China and India, back the G20 principles without adhering to the OECD instrument itself.
