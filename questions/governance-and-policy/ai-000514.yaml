true_statement: 'A model card''s distinctive element is disaggregated evaluation: results are reported separately for groups, conditions and their intersections, since an aggregate score can hide subgroup failures.'
false_statement: 'A model card''s distinctive element is aggregated evaluation: results are pooled into one score across groups, conditions and their intersections, since subgroup scores can hide overall failures.'
explanation: A model with a good average can still fail badly for one group; reporting per group and per intersection, such as age combined with gender, exposes that. The paper's smiling-detection card, for example, revealed a higher false discovery rate for older men.
