true_statement: Under the EU AI Act, the Commission's AI Office has direct powers over general-purpose AI models, while Member State market-surveillance authorities enforce most other rules.
false_statement: Under the EU AI Act, Member State market-surveillance authorities have direct powers over general-purpose AI models, while the Commission's AI Office enforces most other rules.
explanation: 'Enforcement is split: general-purpose models are supervised centrally, so the AI Office can request documentation, evaluate models, order corrective measures and fine providers. National authorities handle the AI systems placed on their markets, following the EU''s usual product-surveillance model.'
