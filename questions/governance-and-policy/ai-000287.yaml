true_statement: A 2024 paper reported training compute for notable ML systems doubling about every six months, while GPU price-performance doubled only every two to two-and-a-half years.
false_statement: A 2024 paper reported training compute for notable ML systems doubling about every two years, while GPU price-performance doubled roughly every six months.
explanation: Because compute grew far faster than chips got cheaper, most of the growth came from bigger clusters and more spending. That spending makes large training runs visible, which is what gives compute governance its leverage.
