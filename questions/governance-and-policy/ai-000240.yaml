true_statement: The Commerce Control List names the items BIS controls for export, while the Entity List names foreign parties that need special licences.
false_statement: The Entity List names the items BIS controls for export, while the Commerce Control List names foreign parties that need special licences.
explanation: Export rules can bite on what is shipped or on who receives it. The Commerce Control List sorts items into nine categories with classification numbers, while the Entity List, maintained by an interagency committee, targets specific companies and organisations.
