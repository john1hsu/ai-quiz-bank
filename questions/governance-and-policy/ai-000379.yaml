true_statement: EO 14110 tied mandatory developer reporting to fixed training-compute thresholds, whereas EO 14409 relies on voluntary government access and a classified capability test.
false_statement: EO 14110 relied on voluntary government access and a classified capability test, whereas EO 14409 tied mandatory developer reporting to fixed training-compute thresholds.
explanation: The 2023 order used the Defense Production Act to require reports from developers above set compute levels. The 2026 order instead has the NSA designate covered frontier models by benchmarking advanced cyber capabilities, and explicitly creates no mandatory licensing, leaving open which yardstick for frontier risk will last.
