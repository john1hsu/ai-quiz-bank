true_statement: Gender Shades (2018) found commercial gender classifiers had error rates up to 34.7% for darker-skinned women but at most 0.8% for lighter-skinned men.
false_statement: Gender Shades (2018) found commercial gender classifiers had error rates up to 34.7% for lighter-skinned men but at most 0.8% for darker-skinned women.
explanation: Common face benchmarks were mostly lighter-skinned, so aggregate accuracy hid the gap. Buolamwini and Gebru's balanced benchmark showed why evaluation must be broken down by intersecting subgroups.
