true_statement: A 2024 study of 32,111 Hugging Face model cards found training sections were filled in most consistently, while environmental impact, limitations and evaluation sections were filled in least.
false_statement: A 2024 study of 32,111 Hugging Face model cards found evaluation and limitations sections were filled in most consistently, while training and environmental impact sections were filled in least.
explanation: 'Developers readily describe how they trained a model but skimp on the parts that matter most for safe use: where it fails and how it was tested. Having a card is common, so quality, not presence, is the real gap.'
