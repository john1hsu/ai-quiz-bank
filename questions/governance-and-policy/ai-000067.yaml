true_statement: The UK's AI Safety Institute, launched in November 2023 at the Bletchley Park AI Safety Summit, grew out of the government's Frontier AI Taskforce.
false_statement: The UK's AI Safety Institute, launched in November 2024 at the Bletchley Park AI Safety Summit, grew out of the government's Frontier AI Taskforce.
explanation: The UK and US institutes were announced in the same week of November 2023, making them the first of their kind. November 2024 is when the international network of such institutes launched in San Francisco.
