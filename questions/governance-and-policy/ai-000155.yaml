true_statement: Every OMB AI memo excludes AI used as a component of a National Security System, leaving a large share of high-stakes government AI outside its rules.
false_statement: Every OMB AI memo applies its strictest minimum practices to AI used as a component of a National Security System, the highest-stakes government AI.
explanation: National security systems and, largely, the Intelligence Community sit outside the series. Critics also point to waivers granted by Chief AI Officers and the memos' dependence on executive orders, which let the rules change quickly with a new administration.
