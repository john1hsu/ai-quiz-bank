topic: NIST AI Risk Management Framework
topic_type: Policy
maturity: established
true_statement: NIST's Generative AI Profile (NIST AI 600-1) tailors the AI RMF to generative AI and, like the parent framework, is voluntary.
false_statement: NIST's Generative AI Profile (NIST AI 600-1) tailors the AI RMF to generative AI and, unlike the parent framework, is legally binding.
explanation: Organisations use the AI RMF mainly through profiles that adapt the Core to a sector or technology. Neither the framework nor its profiles create legal obligations on their own; binding rules come from laws like the EU AI Act.
