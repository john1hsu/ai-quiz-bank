true_statement: NIST released AI RMF 1.0 on 26 January 2023, at the direction of the National Artificial Intelligence Initiative Act of 2020.
false_statement: NIST released AI RMF 1.0 on 26 July 2024, at the direction of the National Artificial Intelligence Initiative Act of 2020.
explanation: Congress asked for a voluntary framework, and NIST built it through drafts and public workshops from 2021 to 2022. 26 July 2024 is when the separate Generative AI Profile (NIST AI 600-1) came out.
