id: ai-000632
area: reinforcement-learning
kind: mechanism
topic: Multi-armed bandit
topic_type: Concept
maturity: foundational
true_statement: The Exp3 adversarial bandit algorithm divides each observed reward by the probability of having picked that arm, so its reward estimates stay unbiased for every arm.
false_statement: The Exp3 adversarial bandit algorithm multiplies each observed reward by the probability of having picked that arm, so its reward estimates stay unbiased for every arm.
explanation: Rarely chosen arms are seen rarely, so each sighting is scaled up to stand for all the rounds it was not chosen. This importance weighting lets Exp3 keep exponential weights on every arm even though it only sees one reward per round.
