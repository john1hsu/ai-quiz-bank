true_statement: In a deep Q-network (DQN), experience replay samples stored transitions uniformly at random, which breaks up the correlation between consecutive frames.
false_statement: In a deep Q-network (DQN), the target network samples stored transitions uniformly at random, which breaks up the correlation between consecutive frames.
explanation: 'Experience replay is the memory of past transitions that DQN draws random minibatches from, so each experience is reused and training data is less correlated. The target network is the other stabiliser: a frozen weight copy, refreshed every C steps, that keeps the regression target from shifting after every update.'
