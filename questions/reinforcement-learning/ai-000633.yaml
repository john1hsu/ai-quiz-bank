topic: Multi-armed bandit
topic_type: Concept
maturity: foundational
true_statement: LinUCB's authors evaluated news recommenders offline by replaying uniformly random logged traffic and keeping only events where the policy matched the logged choice.
false_statement: LinUCB's authors evaluated news recommenders offline by replaying traffic logged by the production recommender and keeping only events where the policy matched the logged choice.
explanation: Because the logged articles were chosen uniformly at random, the matching events are an unbiased sample of how the new policy would have done. Logs from a production system are skewed toward what that system liked, which biases the estimate.
