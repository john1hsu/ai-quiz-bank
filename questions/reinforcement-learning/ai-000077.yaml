topic: Actor-critic
topic_type: Technique
maturity: established
true_statement: Advantage actor-critic uses the one-step TD error r + γV(s′) − V(s) as its advantage estimate, so the critic only has to learn a state-value function V.
false_statement: Advantage actor-critic uses the one-step TD error r + γV(s′) − V(s) as its advantage estimate, so the critic has to learn both Q and V separately.
explanation: The advantage Q(s, a) − V(s) says whether an action beat the state's average. Since r + γV(s′) is a sample of Q(s, a), one value network suffices, which keeps A2C simple and cuts variance compared with raw returns.
