true_statement: Ronald Williams introduced REINFORCE in 1992, and Sutton and colleagues proved the general policy gradient theorem in 1999.
false_statement: Richard Sutton introduced REINFORCE in 1992, and Williams and colleagues proved the general policy gradient theorem in 1999.
explanation: Williams's REINFORCE followed the gradient of expected reward for networks of stochastic units. Sutton, McAllester, Singh and Mansour later showed policy iteration with any differentiable approximator converges to a local optimum.
