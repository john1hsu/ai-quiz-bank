true_statement: DeepMind's DQN, reported in Nature in 2015, learned 49 Atari 2600 games from raw pixels and the score alone, and beat earlier machine-learning methods on 43 of them.
false_statement: DeepMind's DQN, reported in Nature in 2015, learned 49 Atari 2600 games from raw pixels and the score alone, but beat earlier machine-learning methods on only 13 of them.
explanation: One network architecture and one set of hyperparameters handled every game, showing deep networks could learn control directly from high-dimensional input. Experience replay, which reuses stored past transitions, proved essential to that performance.
