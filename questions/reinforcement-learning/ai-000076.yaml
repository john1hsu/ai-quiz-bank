true_statement: In actor-critic reinforcement learning the actor is the parameterised policy that picks actions, and the critic is a learned value function that scores them.
false_statement: In actor-critic reinforcement learning the critic is the parameterised policy that picks actions, and the actor is a learned value function that scores them.
explanation: The design sits between policy-only methods like REINFORCE and value-only methods like Q-learning. The critic's judgement replaces a noisy whole-episode return as the signal that tells the actor which actions to make more likely.
