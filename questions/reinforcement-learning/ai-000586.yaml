true_statement: AlphaGo Zero used one residual network with policy and value heads and scored search leaves with that network alone, dropping AlphaGo's fast random rollouts.
false_statement: AlphaGo Zero used one residual network with policy and value heads but still scored search leaves partly with AlphaGo's fast random rollouts.
explanation: Merging the two networks and removing rollouts simplified the system and made the learned value estimate carry all the evaluation. Ablations showed the shared policy-value network alone was worth roughly 600 Elo.
