true_statement: SARSA was introduced by Rummery and Niranjan in a 1994 Cambridge technical report as Modified Connectionist Q-Learning, and Richard Sutton later gave it its name.
false_statement: SARSA was introduced by Richard Sutton in a 1994 Cambridge technical report as Modified Connectionist Q-Learning, and Rummery and Niranjan later gave it its name.
explanation: Rummery and Niranjan wanted Q-learning-style methods that update on-line with neural-network approximators. Sutton's 1996 NIPS paper named it after the five quantities each update uses (state, action, reward, next state, next action) and showed it working with coarse-coded function approximation.
