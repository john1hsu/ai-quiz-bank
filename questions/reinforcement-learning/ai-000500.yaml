true_statement: Plain UCT struggles in games with trap states, where a loss follows within a few moves, which is one reason MCTS lagged in chess.
false_statement: Plain UCT struggles in games with trap states, where a loss follows within a few moves, which is one reason MCTS lagged in Go.
explanation: Random playouts average over many lines and can miss a short forced loss that a minimax search would spot. Chess is full of such tactical traps, whereas Go lacked good evaluation heuristics, which is exactly where MCTS dominated for a decade.
