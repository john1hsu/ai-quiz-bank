topic: Temporal-difference learning
topic_type: Algorithm
maturity: foundational
true_statement: Temporal-difference learning samples real transitions like Monte Carlo methods and bootstraps from its own estimates like dynamic programming.
false_statement: Temporal-difference learning samples real transitions like dynamic programming and bootstraps from its own estimates like Monte Carlo methods.
explanation: TD needs no model of the environment because it learns from sampled experience, the Monte Carlo trait. It updates toward reward plus the estimated value of the next state instead of waiting for the full return, the dynamic-programming trait, which lets it learn after every step and from unfinished episodes.
