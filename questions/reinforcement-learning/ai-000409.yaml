true_statement: DeepSeek's group relative policy optimization (GRPO, 2024) drops PPO's separate value model and uses the mean and standard deviation of rewards across a group of sampled answers as the baseline.
false_statement: DeepSeek's group relative policy optimization (GRPO, 2024) drops PPO's separate reward model and uses the mean and standard deviation of rewards across a group of sampled answers as the baseline.
explanation: In LLM training the value model, PPO's critic, is typically about as large as the policy, so removing it saves a lot of memory. GRPO still needs a reward signal; it only replaces the learned value baseline with group statistics.
