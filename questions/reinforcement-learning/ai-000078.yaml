true_statement: Soft actor-critic is off-policy, reusing past transitions from a replay buffer, and its actor maximises expected reward plus the policy's entropy.
false_statement: Soft actor-critic is on-policy, discarding past transitions after each update, and its actor maximises expected reward plus the policy's entropy.
explanation: Reusing old experience is what makes SAC sample-efficient for continuous control, and the entropy bonus keeps the policy as random as success allows, aiding exploration and stability across seeds.
