topic: Exploration-exploitation dilemma
topic_type: Concept
maturity: foundational
true_statement: Thompson sampling draws one plausible model from its posterior and acts optimally for that sample, so each action is tried in proportion to the chance it is best.
false_statement: Thompson sampling adds a confidence bonus to each action's estimate and picks the highest total, so each action is tried in proportion to the chance it is best.
explanation: 'Thompson sampling explores through randomness in its beliefs: uncertain actions sometimes win the posterior draw. Adding a shrinking confidence bonus to each estimate is the upper confidence bound (UCB) approach, which explores through optimism rather than sampling.'
