true_statement: Engstrom et al. (ICLR 2020) found that code-level optimizations left out of PPO's description accounted for most of its reward gain over TRPO.
false_statement: Engstrom et al. (ICLR 2020) found that the clipped objective at the heart of PPO's description accounted for most of its reward gain over TRPO.
explanation: Implementation details outside the core algorithm, not the clipping idea itself, drove most of the improvement over trust region policy optimization (TRPO) and even changed how the method behaves. The lesson is to attribute RL results carefully between an algorithm and the code around it.
