true_statement: Andrew Barto and his former PhD student Richard Sutton received the 2024 ACM A.M. Turing Award for founding the core ideas and algorithms of reinforcement learning.
false_statement: Richard Sutton and his former PhD student David Silver received the 2024 ACM A.M. Turing Award for founding the core ideas and algorithms of reinforcement learning.
explanation: Barto and Sutton began framing RL as a general problem in the early 1980s and wrote the standard 1998 textbook. ACM singled out temporal-difference learning as their most important contribution, alongside policy-gradient methods and agents that combine learning with planning.
