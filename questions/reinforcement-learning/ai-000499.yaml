true_statement: In 2006 Kocsis and Szepesvári created UCT by treating each tree node's action choice as a multi-armed bandit, solved with a modified UCB1 rule.
false_statement: In 2006 Rémi Coulom created UCT by treating each tree node's action choice as a multi-armed bandit, solved with a modified UCB1 rule.
explanation: Coulom coined the name Monte Carlo tree search that year for his Go program Crazy Stone, with an empirically tuned backup rule. Kocsis and Szepesvári's bandit framing gave the variant most implementations start from, plus a proof that it is consistent.
