true_statement: AlphaZero trains its policy head to match the move distribution from tree-search visit counts and its value head to predict each self-play game's final result.
false_statement: AlphaZero trains its value head to match the move distribution from tree-search visit counts and its policy head to predict each self-play game's final result.
explanation: The policy head outputs move probabilities, so it imitates the search's improved distribution; the value head outputs one number, so it regresses toward the game outcome z. Search proposes stronger moves than the raw network and the network learns to reproduce them, so each round of self-play starts from a better player.
