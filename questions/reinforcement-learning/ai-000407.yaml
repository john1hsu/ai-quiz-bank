topic: Proximal policy optimization
topic_type: Algorithm
maturity: established
true_statement: PPO's clipped objective takes the minimum of the unclipped and clipped ratio-times-advantage terms, so pushing a good action's probability ratio past 1+ε earns nothing more.
false_statement: PPO's clipped objective takes the maximum of the unclipped and clipped ratio-times-advantage terms, so pushing a good action's probability ratio past 1+ε keeps earning more.
explanation: Taking the minimum makes the objective a pessimistic bound, which removes any incentive to move the new policy far from the one that collected the data. That is how proximal policy optimization (PPO) gets trust-region-like stability while still running several epochs of minibatch updates on one batch.
