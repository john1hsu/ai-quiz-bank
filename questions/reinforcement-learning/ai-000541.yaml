true_statement: In Sutton and Barto's cliff-walking task with ε-greedy exploration, SARSA learns a longer, safer route and earns more reward online than Q-learning, which hugs the cliff edge.
false_statement: In Sutton and Barto's cliff-walking task with ε-greedy exploration, Q-learning learns a longer, safer route and earns more reward online than SARSA, which hugs the cliff edge.
explanation: Because SARSA values the policy it actually follows, exploration included, it learns that walking next to the cliff is risky when random steps happen. Q-learning learns the shortest path for a greedy agent but keeps falling off while exploring, which makes SARSA attractive when mistakes during learning are costly.
