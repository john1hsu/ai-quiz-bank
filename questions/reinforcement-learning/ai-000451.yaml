true_statement: Richard Sutton formalized temporal-difference learning in a 1988 Machine Learning paper, noting the idea had appeared earlier in Arthur Samuel's checkers player.
false_statement: Gerald Tesauro formalized temporal-difference learning in a 1988 Machine Learning paper, noting the idea had appeared earlier in Arthur Samuel's checkers player.
explanation: Sutton's paper gave TD a name, a theory and convergence proofs for special cases, after the idea had been used informally in Samuel's checkers player and Holland's bucket brigade. Tesauro came later, applying TD(λ) in TD-Gammon.
