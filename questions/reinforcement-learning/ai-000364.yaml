true_statement: AlphaZero must be given a game's rules to search ahead, limiting it to domains with known dynamics, whereas MuZero later planned with a model it learned itself.
false_statement: MuZero must be given a game's rules to search ahead, limiting it to domains with known dynamics, whereas AlphaZero later planned with a model it learned itself.
explanation: AlphaZero's tree search needs a perfect simulator, which is why it was confined to board games. MuZero, the later system, replaced the rules with a learned model, matching AlphaZero in Go, chess and shogi while also handling Atari games.
