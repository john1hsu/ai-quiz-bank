true_statement: AlphaGo bootstrapped its policy network from human expert games, whereas its successor AlphaGo Zero learned only from self-play, starting from the rules.
false_statement: AlphaGo learned only from self-play, starting from the rules, whereas its successor AlphaGo Zero bootstrapped its policy network from human expert games.
explanation: AlphaGo's first stage was supervised learning on about 30 million positions from expert games, plus hand-crafted features and a separate rollout policy. AlphaGo Zero dropped all of that for a single self-taught network and still beat the champion-defeating AlphaGo 100 games to 0.
