true_statement: On Sutton and Barto's 10-armed testbed, ε = 0.1 found the best arm sooner, while ε = 0.01 learned more slowly but did better in the long run.
false_statement: On Sutton and Barto's 10-armed testbed, ε = 0.01 found the best arm sooner, while ε = 0.1 learned more slowly but did better in the long run.
explanation: More random exploration discovers the best arm faster but keeps wasting a tenth of the choices on random arms forever. A smaller ε explores slowly, yet once it finds the best arm it exploits it almost all the time, so it pulls ahead later. A purely greedy learner often got stuck on a worse arm.
