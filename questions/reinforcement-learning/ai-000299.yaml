id: ai-000299
area: reinforcement-learning
kind: mechanism
topic: Exploration-exploitation dilemma
topic_type: Concept
maturity: foundational
true_statement: Optimistic initial values push even a greedy learner to try every action early on, but the effect fades, so they do not help in nonstationary problems.
false_statement: Optimistic initial values push even a greedy learner to try every action early on, and the effect persists, so they suit nonstationary problems well.
explanation: Starting every estimate too high means early rewards disappoint, so the learner keeps moving on to untried actions. Once the estimates settle the push to explore is gone, which is why the trick fails when the best action changes over time and exploration must restart.
