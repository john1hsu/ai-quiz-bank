true_statement: Model-based RL agents learn or are given a model of transitions and rewards they can plan with, while model-free agents learn values or policies directly from experience.
false_statement: Model-free RL agents learn or are given a model of transitions and rewards they can plan with, while model-based agents learn values or policies directly from experience.
explanation: The model predicts the next state and reward for a state-action pair. Having one lets an agent simulate ahead and plan; without it, methods such as Q-learning or policy gradients improve purely from trial and error. Value-based, policy-based and actor-critic are a separate, overlapping way to classify agents.
