true_statement: Q-learning is off-policy because its update target uses the greedy max over next actions, while SARSA uses the next action its ε-greedy policy actually takes.
false_statement: SARSA is off-policy because its update target uses the greedy max over next actions, while Q-learning uses the next action its ε-greedy policy actually takes.
explanation: In Q-learning the agent explores with one policy (ε-greedy) but learns the value of another (greedy), so it learns optimal values even while acting randomly. SARSA learns the value of the exploring policy it is actually following.
