topic: Multi-armed bandit
topic_type: Concept
maturity: foundational
true_statement: 'A basic multi-armed bandit has no state: pulling an arm does not change future situations, which is what separates it from reinforcement learning in a Markov decision process.'
false_statement: 'A Markov decision process has no state: taking an action does not change future situations, which is what separates it from learning in a basic multi-armed bandit.'
explanation: In a bandit the only problem is learning which arm pays best while still earning reward. In an MDP actions also move the agent to new states, so it must weigh delayed consequences too; bandits isolate the exploration-exploitation dilemma.
