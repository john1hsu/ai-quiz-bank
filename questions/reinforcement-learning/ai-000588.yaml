true_statement: In 2017 DeepMind reported that after about three days of self-play, AlphaGo Zero beat the version of AlphaGo that had defeated Lee Sedol by 100 games to 0.
false_statement: In 2017 DeepMind reported that after about forty days of self-play, AlphaGo Zero beat the version of AlphaGo that had defeated Lee Sedol by 100 games to 0.
explanation: Three days of training from random play was enough to surpass a system built with months of human data. The forty-day figure belongs to a larger 40-block run, which went on to beat the stronger AlphaGo Master.
