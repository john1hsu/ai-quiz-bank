true_statement: Each Monte Carlo tree search iteration runs selection, then expansion, then simulation with a default policy, then backpropagation of the outcome along the path.
false_statement: Each Monte Carlo tree search iteration runs selection, then simulation with a default policy, then expansion, then backpropagation of the outcome along the path.
explanation: The tree policy first walks down to a node that can still grow, a new child is added, and only then is a playout run from that new node. Backing the result up the path updates visit counts and values, so the tree grows deepest where play looks best.
