true_statement: DeepMind's first DQN preprint, posted to arXiv in December 2013, ran one unchanged architecture on seven Atari 2600 games and beat a human expert on three.
false_statement: DeepMind's first DQN preprint, posted to arXiv in December 2013, ran one unchanged architecture on 49 Atari 2600 games and beat a human expert on three.
explanation: The 2013 preprint was a small proof of concept on seven games. The 49-game evaluation came with the full Nature paper in 2015, which scaled the same one-architecture, one-hyperparameter-setting idea up to the wider benchmark.
