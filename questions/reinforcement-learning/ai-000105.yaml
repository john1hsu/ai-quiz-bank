true_statement: In stochastic environments Q-learning tends to overestimate action values, because the maximum of noisy estimates is biased upward.
false_statement: In stochastic environments Q-learning tends to underestimate action values, because the maximum of noisy estimates is biased downward.
explanation: Taking the max picks whichever estimate happens to be high by chance, so errors don't cancel out. Van Hasselt's Double Q-learning fixes this by using one estimator to choose the action and another to value it.
