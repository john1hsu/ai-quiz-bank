true_statement: On the same batch of episodes, batch TD(0) converges to the estimate implied by a maximum-likelihood Markov model, while batch Monte Carlo minimizes error on the observed returns.
false_statement: On the same batch of episodes, batch Monte Carlo converges to the estimate implied by a maximum-likelihood Markov model, while batch TD(0) minimizes error on the observed returns.
explanation: TD's bootstrapping implicitly uses the transition structure seen in the data, giving the certainty-equivalence estimate; Monte Carlo just averages the returns that happened to follow each state. In Sutton and Barto's example this gave one state 0.75 under TD and 0 under Monte Carlo.
