id: ai-000542
area: reinforcement-learning
kind: mechanism
topic: SARSA
topic_type: Algorithm
maturity: foundational
true_statement: Expected SARSA replaces the sampled next action's value in SARSA's target with the expected value of Q(S_{t+1}, ·) under the policy, removing that sampling variance.
false_statement: Expected SARSA replaces the sampled next action's value in SARSA's target with the maximum of Q(S_{t+1}, ·) over actions, removing that sampling variance.
explanation: Taking the maximum would make it Q-learning; Expected SARSA instead averages over the next actions the policy might take. That removes the noise of sampling A_{t+1} at extra computational cost, and van Seijen and colleagues found it tolerates larger learning rates.
