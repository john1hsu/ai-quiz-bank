topic: Policy gradient methods
topic_type: Technique
maturity: established
true_statement: 'Vanilla policy gradient is on-policy: its training data must come from the current policy it is improving.'
false_statement: 'Vanilla policy gradient is off-policy: it can train on data collected by any earlier policy it has replaced.'
explanation: The gradient is an expectation over trajectories from the current policy, so old data no longer matches it. Exploration comes only from the policy's own randomness, which shrinks over training and can leave it stuck in local optima.
