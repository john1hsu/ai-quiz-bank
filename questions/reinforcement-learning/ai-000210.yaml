topic: AlphaGo
topic_type: Model
maturity: historical
true_statement: During tree search, AlphaGo scored each leaf by mixing its value network's estimate with the result of a fast rollout, weighting the two equally in its best setting.
false_statement: During tree search, AlphaGo scored each leaf with its value network's estimate alone, having found that adding fast rollouts made its play weaker.
explanation: The value network judges a position in one shot, while a rollout plays the game out quickly with a cheap linear policy; combining them at λ = 0.5 worked best. Meanwhile the supervised policy network acted as a prior steering which moves the search explored.
