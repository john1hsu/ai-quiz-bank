true_statement: Subtracting a state-dependent baseline from the return lowers the variance of a policy gradient estimate without biasing it.
false_statement: Subtracting a state-dependent baseline from the return lowers the variance of a policy gradient estimate but biases it toward the baseline.
explanation: 'The expected gradient of the log-probability is zero, so a term that depends only on the state averages out. A learned value function V(s) is the usual baseline, which turns the weight into an advantage: how much better the action was than average.'
