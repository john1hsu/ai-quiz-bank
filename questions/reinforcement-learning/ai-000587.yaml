true_statement: A network trained on human games predicted expert Go moves better than AlphaGo Zero's self-play network, yet the self-play player beat it within 24 hours of training.
false_statement: AlphaGo Zero's self-play network predicted expert Go moves better than a network trained on human games, yet the human-trained player beat it within 24 hours of training.
explanation: Imitating humans and winning are different targets. The self-play system was not trying to copy expert moves, so it drifted toward its own style of play, which turned out to be stronger.
