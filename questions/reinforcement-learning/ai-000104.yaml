true_statement: Watkins and Dayan's 1992 note proved tabular Q-learning converges to the optimal action-values, provided every action is tried repeatedly in every state.
false_statement: Watkins and Dayan's 1992 note proved tabular Q-learning converges to the optimal action-values, provided the agent always acts greedily on its current estimates.
explanation: Convergence needs every state-action pair visited again and again, which pure greedy behaviour cannot guarantee; hence exploration such as ε-greedy. The proof also assumed values stored in a discrete table, which neural networks break.
