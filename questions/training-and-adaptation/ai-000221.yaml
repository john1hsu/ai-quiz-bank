true_statement: NVIDIA reported in June 2024 that over 98% of the data used to align its Nemotron-4 340B model was synthetically generated.
false_statement: NVIDIA reported in June 2024 that under 10% of the data used to align its Nemotron-4 340B model was synthetically generated.
explanation: Alignment data such as preference labels is expensive to collect from people, so labs increasingly generate it with models and filter it with reward models. NVIDIA released a reward model and permissive licence so others could build similar pipelines.
