true_statement: In 2022, STaR raised 6-billion-parameter GPT-J to 72.5% on CommonsenseQA, close to a fine-tuned GPT-3 about 30 times larger at 73.0%.
false_statement: In 2022, STaR raised 6-billion-parameter GPT-J to 52.5% on CommonsenseQA, well behind a fine-tuned GPT-3 about 30 times larger at 73.0%.
explanation: Few-shot chain-of-thought GPT-J scored only 36.6% and direct answer fine-tuning 60.0%, so training on its own filtered rationales gave a large jump. Gains on GSM8K math were much smaller in absolute terms, a reminder that the method's payoff varies by task.
