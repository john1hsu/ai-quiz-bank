topic: 'STaR: Self-Taught Reasoner'
topic_type: Technique
maturity: established
true_statement: STaR works poorly on tasks with high chance accuracy, such as yes/no questions, because many bad rationales reach the right answer by luck and pass the filter.
false_statement: STaR works best on tasks with high chance accuracy, such as yes/no questions, because more rationales reach the right answer and pass the filter.
explanation: STaR's only quality check is whether the final answer matches, so with a 50% guess rate flawed reasoning gets reinforced. The same weakness means a correct answer never guarantees a faithful rationale, and the loop cannot start at all if few-shot performance is near chance.
