topic: Bradley-Terry model
topic_type: Concept
maturity: foundational
true_statement: Because Bradley-Terry gives each item a single scalar strength, it cannot represent intransitive preferences in which A beats B, B beats C and C beats A.
false_statement: Because Bradley-Terry gives each item a separate strength against every opponent, it can represent intransitive preferences in which A beats B, B beats C and C beats A.
explanation: One number per item forces a strict ordering, so cyclic or context-dependent preferences get averaged away. This limit carries straight into reward models and leaderboards built on Bradley-Terry, whose scores are also only relative to the pool compared.
