true_statement: QLoRA's 4-bit NormalFloat format places its 16 levels at quantiles of a normal distribution, matching how pretrained weights are spread.
false_statement: QLoRA's 4-bit NormalFloat format places its 16 levels evenly across the range [−1, 1], matching how pretrained weights are spread.
explanation: Because pretrained weights are roughly normal, quantile-based levels give each level about the same number of weights, wasting fewer codes on rare extremes. The paper found NF4 beat 4-bit integer and 4-bit float formats.
