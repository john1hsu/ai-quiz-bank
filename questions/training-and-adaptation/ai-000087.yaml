true_statement: In sequence-level knowledge distillation the student is trained with plain cross-entropy on the teacher's beam-search outputs, the pattern later used to distil LLMs.
false_statement: In sequence-level knowledge distillation the student is trained to match the teacher's per-token soft distributions, the pattern later used to distil LLMs.
explanation: Kim and Rush had the teacher decode the training inputs and treated the results as new targets. Their students ran about ten times faster with little BLEU loss, and training on teacher-generated text is how large models are now compressed into small ones.
