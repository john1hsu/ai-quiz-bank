true_statement: Xu et al. (ICML 2024) found a carefully tuned PPO beat DPO in all their tests, and DPO failed to improve over supervised fine-tuning on competitive code generation.
false_statement: Xu et al. (ICML 2024) found DPO beat a carefully tuned PPO in all their tests, and PPO failed to improve over supervised fine-tuning on competitive code generation.
explanation: The original DPO paper reported matching or beating PPO-based RLHF on small tasks, but this later study qualified that. It traced DPO's weaknesses to favouring out-of-distribution responses and to mismatch between the model's own outputs and the preference data.
