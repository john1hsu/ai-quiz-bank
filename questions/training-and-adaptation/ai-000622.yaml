true_statement: The Bradley-Terry model is named for 1952 paired-comparison work, but Ernst Zermelo had studied the same form in 1928 to rate chess players.
false_statement: The Bradley-Terry model is named for 1952 paired-comparison work, but Louis Thurstone had studied the same form in 1928 to rate chess players.
explanation: The model has been rediscovered many times, from axioms, maximum entropy and noisy-strength arguments. Thurstone's name belongs to a close cousin that assumes Gaussian rather than Gumbel-type noise.
