id: ai-000386
area: training-and-adaptation
kind: mechanism
topic: 'Pretraining: learning general-purpose representations before task adaptation'
topic_type: Technique
maturity: established
true_statement: BERT's masked language modelling picks about 15% of input tokens, mostly replaces them with a mask symbol, and trains the model to recover them from context on both sides.
false_statement: BERT's masked language modelling picks about 15% of input tokens, mostly replaces them with a mask symbol, and trains the model to recover them from the left context only.
explanation: Masking lets an encoder look both ways while still having a target to predict, which is why BERT is bidirectional. Predicting from left context only is causal language modelling, the objective of GPT-style decoders.
