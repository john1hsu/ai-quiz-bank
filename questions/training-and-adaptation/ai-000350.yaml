true_statement: Wei et al. at Google Research coined the term instruction tuning, while the concurrent BigScience paper by Sanh et al. called the same idea multitask prompted training.
false_statement: Sanh et al. at BigScience coined the term instruction tuning, while the concurrent Google Research paper by Wei et al. called the same idea multitask prompted training.
explanation: Wei et al.'s FLAN paper (ICLR 2022) introduced the name and instruction-tuned Google's 137-billion-parameter LaMDA-PT. Sanh et al.'s T0 work at BigScience appeared at the same time under the label multitask prompted training, so the two names are often mixed up.
