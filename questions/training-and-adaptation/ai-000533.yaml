true_statement: Prompt tuning on T5 grew more competitive with model size, matching full fine-tuning only beyond billions of parameters and lagging behind it at smaller scales.
false_statement: Prompt tuning on T5 grew less competitive with model size, matching full fine-tuning only at small scales and lagging behind it beyond billions of parameters.
explanation: A learned soft prompt at the input is a very small lever, and only at large scale did it match tuning all weights. So prompt tuning's parity with full fine-tuning is mainly a large-model result, and at smaller scales it lags.
