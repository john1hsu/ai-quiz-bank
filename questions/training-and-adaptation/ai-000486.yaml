true_statement: Despite its name, Hugging Face's TRL (Transformers Reinforcement Learning) is mostly used for supervised fine-tuning and offline preference training, with reinforcement learning one family among several.
false_statement: As its name suggests, Hugging Face's TRL (Transformers Reinforcement Learning) is mostly used for online reinforcement learning such as PPO, with supervised fine-tuning one family among several.
explanation: TRL began around the RL step of the RLHF recipe, but it grew into a general post-training library. Day to day, people mostly use its SFT and DPO-style trainers, which need no online generation or reward model in the loop.
