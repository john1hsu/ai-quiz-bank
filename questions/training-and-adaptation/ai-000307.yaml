true_statement: In classic fine-tuning, the copied pretrained layers get a small learning rate, while the new randomly initialised output layer gets a larger one.
false_statement: In classic fine-tuning, the copied pretrained layers get a large learning rate, while the new randomly initialised output layer gets a smaller one.
explanation: The copied layers already hold useful features, so big updates would mostly damage them, while the new head starts from scratch and must move a long way. Dive into Deep Learning's example gives the head ten times the backbone's learning rate.
