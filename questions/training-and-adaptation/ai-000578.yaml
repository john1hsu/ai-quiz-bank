kind: evidence
topic: Transfer learning
topic_type: Paradigm
maturity: established
true_statement: Yosinski and colleagues found that first-layer features in ImageNet networks, Gabor-like filters and colour blobs, are general, while last-layer features are task-specific.
false_statement: Yosinski and colleagues found that last-layer features in ImageNet networks, Gabor-like filters and colour blobs, are general, while first-layer features are task-specific.
explanation: Early layers learn edge and colour detectors useful for almost any image task, which is why they transfer well and why fine-tuning usually keeps them. Transfer got worse with depth and when source and target tasks differed more, such as man-made versus natural objects.
