true_statement: Constitutional AI first fine-tunes on the model's own critiqued and revised answers, then trains a preference model on AI-labelled comparisons and runs reinforcement learning against it.
false_statement: Constitutional AI first trains a preference model on AI-labelled comparisons and runs reinforcement learning against it, then fine-tunes on the model's own critiqued and revised answers.
explanation: The supervised critique-and-revise stage (SL-CAI) comes first and produces the model whose response pairs are then labelled by a feedback model in the RL stage (RL-CAI). Both stages start from a helpful-only model, and the RL stage works like RLHF except that harmlessness labels come from a model guided by the constitution.
