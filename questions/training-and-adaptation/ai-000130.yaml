true_statement: LoRA keeps the frozen base weights in 16-bit precision, while QLoRA stores them in 4 bits and backpropagates through them into the adapters.
false_statement: QLoRA keeps the frozen base weights in 16-bit precision, while LoRA stores them in 4 bits and backpropagates through them into the adapters.
explanation: Both train only small low-rank adapters, but in LoRA the frozen base still dominates memory for large models. Quantizing it is what let QLoRA fine-tune a 65B model on one 48 GB GPU.
