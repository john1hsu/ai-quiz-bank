true_statement: When TRL's PPO trainer is used with LoRA adapters, switching the adapters off turns the same weights back into the frozen reference model, so no second model copy is needed.
false_statement: When TRL's PPO trainer is used with LoRA adapters, switching the adapters off turns the same weights into the reward model, so no separate reward model is needed.
explanation: RLHF-style PPO compares the policy against a frozen reference model, normally a second full copy. With adapters, the base weights are that reference and the adapters are the policy, which is how a 20-billion-parameter RL run fit on one 24 GB GPU in 2023.
