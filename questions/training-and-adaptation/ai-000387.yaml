topic: 'Pretraining: learning general-purpose representations before task adaptation'
topic_type: Technique
maturity: established
true_statement: Erhan, Bengio and colleagues argued that unsupervised pretraining helps deep networks mainly as a regularizer, steering them toward parameters that generalise better.
false_statement: Erhan, Bengio and colleagues argued that unsupervised pretraining helps deep networks mainly as an optimizer, steering them toward parameters that fit the training set better.
explanation: Their experiments varying depth, capacity and data size pointed to better generalisation rather than easier fitting, so they framed pretraining as a kind of regularization. The account opened, but did not settle, the question of why pretraining transfers so well.
