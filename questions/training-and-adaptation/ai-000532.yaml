true_statement: Sequential adapter layers add inference latency because they deepen the network, while LoRA adds none because its low-rank update can be merged into the base weights.
false_statement: LoRA adds inference latency because it deepens the network, while sequential adapter layers add none because their update can be merged into the base weights.
explanation: LoRA's update has the form BA added to a frozen weight, so at deployment it can be folded in and the model runs exactly as before. Adapters are extra layers the input must pass through, so every forward pass costs a bit more.
