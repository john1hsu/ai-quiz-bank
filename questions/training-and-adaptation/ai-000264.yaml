true_statement: Zephyr-7B applied a distilled form of DPO to preference rankings produced by a teacher model rather than by human annotators.
false_statement: Zephyr-7B applied a distilled form of DPO to preference rankings produced by human annotators rather than by a teacher model.
explanation: Zephyr showed DPO working with AI-generated preference labels, which is why DPO is tied to synthetic data in practice. Dropping human labelling made preference tuning cheap, and its authors report it beat the much larger Llama2-Chat-70B on MT-Bench after a few hours of training.
