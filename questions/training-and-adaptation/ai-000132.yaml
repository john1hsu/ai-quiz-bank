true_statement: The QLoRA authors found adapters were needed on every linear layer to match 16-bit fine-tuning, while adapting only attention query and value projections fell short.
false_statement: The QLoRA authors found adapters on attention query and value projections alone matched 16-bit fine-tuning, while adding them to every linear layer gave no further gain.
explanation: The original LoRA experiments adapted just the query and value matrices, which became a common default. With a 4-bit base the extra capacity matters, so practical QLoRA recipes target all linear layers.
