topic: 'Direct Preference Optimization: Your Language Model is Secretly a Reward Model'
topic_type: Algorithm
maturity: established
true_statement: Direct Preference Optimization (DPO) sidesteps an intractable partition function because, under the Bradley–Terry model, a preference depends only on the reward difference between two responses.
false_statement: Direct Preference Optimization (DPO) sidesteps an intractable partition function because, under the Bradley–Terry model, a preference depends only on the sum of two responses' rewards.
explanation: Rewriting the reward in terms of the policy leaves a β log Z(x) term that is the same for both responses to a prompt, so it cancels in a difference but not in a sum. That cancellation is why the policy itself can act as an implicit reward model, with no separate reward network.
