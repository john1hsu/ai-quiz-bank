true_statement: The modern RLHF recipe comes from Christiano and colleagues in 2017, who had humans compare pairs of short video clips of an agent.
false_statement: The modern RLHF recipe comes from Stiennon and colleagues in 2017, who had humans compare pairs of short video clips of an agent.
explanation: Christiano et al. (OpenAI and DeepMind) fitted a reward predictor to those choices and trained agents on it. Stiennon et al. brought the method to language in 2020 with summarisation, before InstructGPT applied it to instruction following.
