topic: Transfer learning
topic_type: Paradigm
maturity: established
true_statement: Ben-David and colleagues bound a classifier's target-domain error by its source-domain error plus a divergence between the domains that can be estimated from unlabelled data.
false_statement: Ben-David and colleagues bound a classifier's target-domain error by its source-domain error plus a divergence between the domains that can be estimated only from labelled target data.
explanation: Because the divergence needs no target labels, you can check how far apart two domains are before committing to transfer. The bound also shows why transfer fails when no single hypothesis does well on both domains, the root of negative transfer.
