topic: Synthetic data
topic_type: Technique
maturity: established
true_statement: Self-Instruct bootstrapped an instruction-tuning dataset by having GPT-3 generate new tasks from a small seed pool, filtering them, and fine-tuning GPT-3 on the result.
false_statement: Self-Instruct bootstrapped an instruction-tuning dataset by having paid annotators write new tasks from a small seed pool, filtering them, and fine-tuning GPT-3 on the result.
explanation: The point was to replace costly human annotation with the model's own outputs. Its reported gains brought vanilla GPT-3 roughly level with InstructGPT-001, which relied on private user data and human labels, making instruction tuning cheap to reproduce.
