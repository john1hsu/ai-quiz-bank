id: ai-000219
area: training-and-adaptation
kind: evidence
topic: Synthetic data
topic_type: Technique
maturity: established
true_statement: Shumailov et al. found generative models trained recursively on their predecessors' output first lose the tails of the original distribution, then collapse toward low variance.
false_statement: Shumailov et al. found generative models trained recursively on their predecessors' output first lose the centre of the original distribution, then spread toward high variance.
explanation: Rare events are under-sampled each generation, so errors compound and the data narrows until it barely resembles the original. In their experiments, keeping 10% of the original human data in each generation largely prevented this model collapse.
