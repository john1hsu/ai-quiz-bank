topic: Transfer learning
topic_type: Paradigm
maturity: established
true_statement: 'Transfer learning is asymmetric: it reuses source knowledge to do well on a target task, while multi-task learning tries to do well on all its tasks at once.'
false_statement: 'Multi-task learning is asymmetric: it reuses source knowledge to do well on a target task, while transfer learning tries to do well on all its tasks at once.'
explanation: In transfer learning the source task is only a means to an end, so performance on it can be sacrificed. Multi-task learning treats every task as a goal, which is why the two are contrasted even though both share knowledge across tasks.
