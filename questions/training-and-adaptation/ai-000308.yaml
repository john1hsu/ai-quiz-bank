true_statement: Kumar et al. (ICLR 2022) found full fine-tuning beat linear probing in distribution but did worse out of distribution, and probing first then fine-tuning recovered much of the gap.
false_statement: Kumar et al. (ICLR 2022) found full fine-tuning beat linear probing out of distribution but did worse in distribution, and probing first then fine-tuning recovered much of the gap.
explanation: While a random head is still being learned, its noisy gradients distort the pretrained lower layers, which hurts robustness to distribution shift. Fitting a linear probe first (LP-FT) gives the head a sensible start, so fine-tuning changes the features less.
