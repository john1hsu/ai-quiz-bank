true_statement: To test zero-shot generalization, FLAN held out whole task clusters, so no natural language inference dataset was trained on when evaluating inference.
false_statement: To test zero-shot generalization, FLAN held out single datasets, so other natural language inference datasets were trained on when evaluating inference.
explanation: Holding out a single dataset would let the model see the same kind of task in sibling datasets, which flatters zero-shot scores. Removing the entire cluster means the model has truly never been trained on that task type, so any gain shows instruction following carrying over to new tasks.
