topic: Bradley-Terry model
topic_type: Concept
maturity: foundational
true_statement: Modelling each item's performance as its strength plus Gumbel-type noise yields the Bradley-Terry model, while Gaussian noise yields the Thurstone-Mosteller model.
false_statement: Modelling each item's performance as its strength plus Gaussian noise yields the Bradley-Terry model, while Gumbel-type noise yields the Thurstone-Mosteller model.
explanation: The difference of two Gumbel variables follows a logistic distribution, which gives Bradley-Terry its sigmoid of the score difference. Gaussian noise gives a probit curve instead; the two predict almost the same win rates, but the logistic form is easier to fit.
