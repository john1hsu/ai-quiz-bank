true_statement: In FLAN's experiments, instruction tuning improved the 68B and 137B models on unseen tasks but hurt held-out performance for models of 8B parameters or fewer.
false_statement: In FLAN's experiments, instruction tuning improved models of 8B parameters or fewer on unseen tasks but hurt held-out performance for the 68B and 137B models.
explanation: So in the original FLAN setup the benefit appeared only at large scale. Later work with far more tasks (Chung et al.) reported gains for smaller models too, so the size threshold depends on the instruction-data mix rather than being fixed.
