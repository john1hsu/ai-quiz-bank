true_statement: The term parameter-efficient fine-tuning traces to Houlsby and colleagues at Google (ICML 2019), who inserted small trainable adapter modules into a frozen BERT model.
false_statement: The term parameter-efficient fine-tuning traces to Hu and colleagues (ICLR 2022), who inserted small trainable adapter modules into a frozen BERT model.
explanation: Houlsby et al.'s adapters came within 0.4% of full fine-tuning on GLUE while adding only about 3.6% parameters per task. Hu et al. came later with LoRA, a reparameterization method rather than added adapter layers.
