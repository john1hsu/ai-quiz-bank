topic: 'STaR: Self-Taught Reasoner'
topic_type: Technique
maturity: established
true_statement: In STaR's rationalization step, the model is shown the correct answer as a hint for questions it got wrong and asked to write a rationale reaching it.
false_statement: In STaR's rationalization step, the model is shown a human-written rationale as a hint for questions it got wrong and asked to copy its reasoning.
explanation: Plain filtering only learns from problems the model can already solve. Giving the right answer as a hint lets it produce reasoning for harder questions; the hint is then removed so the rationale is trained on as if found unaided, enlarging the training set without any human rationales.
