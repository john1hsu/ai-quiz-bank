true_statement: The logistic sigmoid's derivative peaks at only 0.25, at an input of zero, while the derivative of tanh peaks at 1.
false_statement: The logistic sigmoid's derivative peaks at 1, at an input of zero, while the derivative of tanh peaks at only 0.25.
explanation: The sigmoid's derivative is σ(x)(1 − σ(x)), which is largest when σ(x) = 0.5, giving 0.25; tanh's derivative 1 − tanh²(x) reaches 1 at zero. Backpropagation multiplies these factors across layers, so small, saturating sigmoid derivatives feed the vanishing gradient problem.
