topic: Universal approximation theorem
topic_type: Concept
maturity: foundational
true_statement: In 1989 George Cybenko proved that a single hidden layer of continuous sigmoidal units can approximate any continuous function on the unit cube arbitrarily well.
false_statement: In 1989 George Cybenko proved that a single hidden layer of linear units can approximate any continuous function on the unit cube arbitrarily well.
explanation: 'The nonlinearity is what makes it work: sums of sigmoids can bend into any continuous shape, while linear units only ever add up to a linear map. Hornik, Stinchcombe and White published a closely related result the same year.'
