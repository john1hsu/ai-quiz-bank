true_statement: During training a batch normalization layer normalizes with the current batch's statistics, while at inference it uses running averages of mean and variance stored during training.
false_statement: During training a batch normalization layer normalizes with running averages of mean and variance, while at inference it uses the current batch's statistics.
explanation: Using stored averages at inference makes a prediction independent of which other examples happen to share its batch. In PyTorch the running averages use a momentum of 0.1 by default, and turning running statistics off makes the layer use batch statistics in both modes.
