true_statement: Srivastava and colleagues reported that dropout networks typically take two to three times longer to train than standard networks of the same architecture.
false_statement: Srivastava and colleagues reported that dropout networks typically train two to three times faster than standard networks of the same architecture.
explanation: Randomly removing units makes each gradient update noisier, so convergence slows. The regularisation benefit is paid for in extra training time, a real cost when choosing between dropout and other regularisers.
