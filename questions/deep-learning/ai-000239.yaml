topic: Long short-term memory
topic_type: Architecture
maturity: established
true_statement: Greff and colleagues compared eight LSTM variants across 5,400 runs and found none meaningfully beat the vanilla LSTM, with the forget gate among the most critical parts.
false_statement: Greff and colleagues compared eight LSTM variants across 5,400 runs and found most clearly beat the vanilla LSTM, with the forget gate among the least critical parts.
explanation: Tested on speech, handwriting and music, simplified or altered gates gave no real gain, while removing the forget gate or output activation hurt most. They also found hyperparameters largely independent, which makes tuning easier in practice.
