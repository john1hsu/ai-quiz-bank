topic: Representation learning
topic_type: Paradigm
maturity: foundational
true_statement: A masked autoencoder hides about 75% of an image's patches, runs its encoder on the visible patches only, and lets a lightweight decoder reconstruct the missing ones.
false_statement: A masked autoencoder hides about 75% of an image's patches, runs its encoder on all patches with mask tokens in place, and lets a lightweight decoder reconstruct them.
explanation: Because the heavy encoder only processes the quarter of patches left visible, training is several times cheaper. Hiding so much of the image also makes reconstruction hard enough that the encoder must learn meaningful visual features rather than copy neighbouring pixels.
