topic: Adam optimizer
topic_type: Algorithm
maturity: established
true_statement: Adam divides its moment estimates by 1 − β^t because both moving averages start at zero and are biased toward zero early in training.
false_statement: Adam divides its moment estimates by 1 − β^t because both moving averages start at one and are biased toward large values early in training.
explanation: With β close to 1, a zero-initialised average takes many steps to reflect the true gradient statistics. Bias correction inflates the early estimates to compensate, and its effect fades as t grows and β^t shrinks toward zero.
