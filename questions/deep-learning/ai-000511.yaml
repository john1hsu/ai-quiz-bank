true_statement: The gradient of a residual block F(x) + x is the block's Jacobian plus the identity, so the signal always has an unattenuated path back to earlier layers.
false_statement: The gradient of a residual block F(x) + x is the block's Jacobian times the identity, so the signal is attenuated by every block's weights on its way back to earlier layers.
explanation: The added identity term means the gradient never has to pass only through stacked weight matrices, which is how residual connections ease vanishing gradients. He et al.'s pre-activation follow-up used this direct path to train a 1001-layer ResNet.
