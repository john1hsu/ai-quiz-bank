true_statement: The 'convolution' in deep-learning libraries is really cross-correlation, without flipping the kernel, and the difference does not matter because the kernel is learned.
false_statement: The 'convolution' in deep-learning libraries is true convolution with a flipped kernel, and the flip matters because cross-correlation would learn different features.
explanation: Convolution and cross-correlation differ only by flipping the kernel. Since training starts from random weights, a network using cross-correlation simply learns the flipped kernel, so the results are equivalent.
