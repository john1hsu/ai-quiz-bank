true_statement: Bengio, Courville and Vincent favoured disentangled representations over merely invariant ones, because invariant features can discard information a later task needs.
false_statement: Bengio, Courville and Vincent favoured invariant representations over disentangled ones, because disentangled features can discard information a later task needs.
explanation: A disentangled representation separates the underlying factors of variation but keeps all of them, so any downstream task can use the ones it cares about. An invariant feature deliberately ignores some factors, which helps one task but may hurt another.
