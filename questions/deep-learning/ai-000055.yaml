true_statement: Griewank credits Seppo Linnainmaa's 1970 master's thesis with reverse-mode differentiation, used there to estimate how rounding errors propagate.
false_statement: Griewank credits Seppo Linnainmaa's 1970 master's thesis with reverse-mode differentiation, used there to compute gradients for training neural networks.
explanation: Backprop was discovered several times. Linnainmaa's reverse mode had nothing to do with learning; Werbos's 1982 work was the version motivated by neural networks, and Rumelhart, Hinton and Williams popularised it for machine learning in 1986.
