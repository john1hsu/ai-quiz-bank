true_statement: He and colleagues checked that their batch-normalized plain networks had healthy backward gradient norms, so the degradation they saw in deeper nets was not caused by vanishing gradients.
false_statement: He and colleagues found that their batch-normalized plain networks had vanishing backward gradient norms, so the degradation they saw in deeper nets was caused by vanishing gradients.
explanation: By 2015 normalized initialization and batch normalization had largely tamed vanishing gradients, yet deeper plain networks still trained worse. Treating that as a separate optimization problem led to residual connections; the lesson is to inspect per-layer gradient norms before blaming vanishing gradients.
