true_statement: In a gated recurrent unit (GRU), the reset gate sets how much past state feeds the new candidate, while the update gate sets how much old state is carried forward.
false_statement: In a gated recurrent unit (GRU), the update gate sets how much past state feeds the new candidate, while the reset gate sets how much old state is carried forward.
explanation: 'The two gates are easy to swap: reset shapes the candidate state, update blends old and new state. Such gates, deciding what to keep and what to overwrite, are how gated RNNs counter vanishing gradients, and the GRU is a lighter alternative to the LSTM.'
