topic: Vanishing gradient problem
topic_type: Concept
maturity: foundational
true_statement: Pascanu and colleagues showed an RNN's long-term gradients must vanish if the recurrent matrix's largest eigenvalue is below 1/γ, where γ bounds the nonlinearity's derivative.
false_statement: Pascanu and colleagues showed an RNN's long-term gradients must vanish if the recurrent matrix's largest eigenvalue is above 1/γ, where γ bounds the nonlinearity's derivative.
explanation: Each step back in time multiplies the gradient by the recurrent weights and the activation's derivative; if their combined size stays below 1, contributions from the distant past shrink exponentially. An eigenvalue above 1/γ is necessary, though not sufficient, for gradients to explode.
