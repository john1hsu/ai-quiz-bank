true_statement: Leshno et al. proved a one-hidden-layer network can approximate any continuous function if and only if its activation function is not a polynomial.
false_statement: Leshno et al. proved a one-hidden-layer network can approximate any continuous function if and only if its activation function is bounded and monotonic.
explanation: Their condition is simply non-polynomial, which covers ReLU (unbounded) as well as sigmoids, and they showed the bias term is needed. Such theorems promise existence, not that training will find the weights or how large the network must be.
