topic: Residual connection
topic_type: Technique
maturity: established
true_statement: Veit and colleagues found a 110-layer ResNet behaves like an ensemble of mostly short paths, with most of the gradient flowing through paths only 10–34 layers deep.
false_statement: Veit and colleagues found a 110-layer ResNet behaves like one very deep path, with most of the gradient flowing through paths over 100 layers deep.
explanation: Unrolling a ResNet shows many paths of different lengths. Their result suggests residual connections avoid vanishing gradients less by making very long paths trainable than by keeping short ones available, a point still debated.
