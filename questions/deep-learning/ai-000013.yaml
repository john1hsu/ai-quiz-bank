true_statement: McCulloch and Pitts's 1943 networks of idealised neurons could compute logical expressions, but their fixed connections could not learn.
false_statement: McCulloch and Pitts's 1958 networks of idealised neurons could compute logical expressions, but their fixed connections could not learn.
explanation: Their 1943 paper treated all-or-none neurons as logic gates. Learning came later with Rosenblatt's 1958 perceptron, which stored information as changes in connection strength.
