true_statement: Nair and Hinton introduced rectified linear units in restricted Boltzmann machines at ICML 2010, deriving them as an approximation to many shifted sigmoid copies.
false_statement: Glorot, Bordes and Bengio introduced rectified linear units in restricted Boltzmann machines at ICML 2010, deriving them as an approximation to many shifted sigmoid copies.
explanation: Nair and Hinton showed rectified units gave better features for object recognition and face verification. Glorot, Bordes and Bengio came a year later, at AISTATS 2011, showing that deep rectifier networks match or beat tanh networks without unsupervised pretraining.
