true_statement: In backpropagation, an addition node passes the upstream gradient unchanged to every input, while a max node routes all of it to the larger input.
false_statement: In backpropagation, a max node passes the upstream gradient unchanged to every input, while an addition node routes all of it to the larger input.
explanation: 'Each node multiplies the upstream gradient by its local derivative: addition has derivative 1 for each input, and max has 1 for the winner and 0 for the rest. That max rule is why ReLU blocks gradients wherever its input is non-positive.'
