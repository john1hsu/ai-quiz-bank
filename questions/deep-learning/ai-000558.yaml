true_statement: Training over 12,000 models, Locatello and colleagues could not reliably pick out well-disentangled ones without supervision, and argued inductive biases are essential.
false_statement: Training over 12,000 models, Locatello and colleagues reliably picked out well-disentangled ones without supervision, and argued inductive biases are unnecessary.
explanation: Their ICML 2019 outstanding paper showed that unsupervised disentanglement is impossible in theory without assumptions about both models and data. Empirically, more disentanglement also did not clearly reduce how many samples downstream tasks needed.
