topic: Long short-term memory
topic_type: Architecture
maturity: established
true_statement: An LSTM updates its cell state additively, so gradients along the cell path are scaled by the forget gate rather than by a repeated weight-matrix product.
false_statement: An LSTM updates its cell state multiplicatively, so gradients along the cell path are scaled by a repeated weight-matrix product rather than by the forget gate.
explanation: In a plain RNN the gradient is multiplied by the same weight matrix at every step, so it vanishes or explodes over long spans. The LSTM's cell adds gated new content to gated old content, and with the forget gate near 1 the signal passes through almost unchanged.
