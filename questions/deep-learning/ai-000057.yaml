topic: Backpropagation algorithm
topic_type: Algorithm
maturity: foundational
true_statement: Backpropagation must keep forward-pass values until the backward pass ends, which is why training needs far more memory than running the network for prediction.
false_statement: Backpropagation discards forward-pass values once each layer is computed, which is why training needs no more memory than running the network for prediction.
explanation: The backward pass reuses stored intermediate activations to compute each gradient cheaply, so they cannot be freed early. The memory bill grows roughly with depth and batch size, a key constraint when training large models.
