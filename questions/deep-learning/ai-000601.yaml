true_statement: Bengio, Simard and Frasconi's 1994 paper 'Learning long-term dependencies with gradient descent is difficult' described vanishing and exploding gradients in recurrent networks.
false_statement: Hochreiter and Schmidhuber's 1994 paper 'Learning long-term dependencies with gradient descent is difficult' described vanishing and exploding gradients in recurrent networks.
explanation: The 1994 analysis showed why gradient descent struggles to link inputs far apart in a sequence. Hochreiter and Schmidhuber's answer came later, with the 1997 LSTM, whose memory cell gives error a path that does not fade.
