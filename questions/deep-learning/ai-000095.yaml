true_statement: In 2006 Hinton, Osindero and Teh trained a deep belief network greedily one layer at a time, then fine-tuned the whole network.
false_statement: In 2006 Hinton, Osindero and Teh trained a deep belief network on all layers at once, then fine-tuned it greedily one layer at a time.
explanation: Each added layer improved a bound on the model's log probability, which made deep nets trainable when they were widely seen as outmoded. Their network reached 1.25% error on permutation-invariant MNIST and helped revive the field.
