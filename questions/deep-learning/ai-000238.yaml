topic: Long short-term memory
topic_type: Architecture
maturity: established
true_statement: The forget gate was not in Hochreiter and Schmidhuber's 1997 LSTM; Gers, Schmidhuber and Cummins added it in 2000 so cells could learn to reset their state.
false_statement: The forget gate was in Hochreiter and Schmidhuber's 1997 LSTM; Gers, Schmidhuber and Cummins added the output gate in 2000 so cells could learn to reset their state.
explanation: The original cell had only input and output gates around a constant error carousel. On continuous input streams with no sequence boundaries its state could grow without bound, and an adaptive forget gate fixed that. It is now part of the standard cell.
