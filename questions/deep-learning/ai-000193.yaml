true_statement: Kingma and Ba designed Adam to combine AdaGrad's strength with sparse gradients and RMSProp's strength with non-stationary objectives.
false_statement: Kingma and Ba designed Adam to combine RMSProp's strength with sparse gradients and AdaGrad's strength with non-stationary objectives.
explanation: AdaGrad's accumulated per-parameter scaling suits rare features, while RMSProp's decaying average adapts when the objective shifts. Adam adds momentum to an RMSProp-style per-coordinate rescaling, which is why it became the default optimiser for deep networks after its 2015 ICLR publication.
