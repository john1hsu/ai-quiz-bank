true_statement: In Shazeer's 2020 Transformer experiments, gated SwiGLU and GEGLU feed-forward layers beat ReLU, while plain GELU and Swish did no better than ReLU.
false_statement: In Shazeer's 2020 Transformer experiments, plain GELU and Swish feed-forward layers beat ReLU, while gated SwiGLU and GEGLU did no better than ReLU.
explanation: The gain came from gating, multiplying one linear projection by an activated second one, not from the smoother activation alone. Shazeer offered no theory for why it works, and such gains are small and setup-dependent, yet SwiGLU became common in Transformer feed-forward blocks.
