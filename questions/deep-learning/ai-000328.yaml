true_statement: Because a convolutional layer reuses one kernel at every position, shifting the input image shifts its feature map by the same amount, a property called translation equivariance.
false_statement: Because a convolutional layer reuses one kernel at every position, shifting the input image leaves its feature map unchanged, a property called translation invariance.
explanation: 'Weight sharing means a feature detector responds to a pattern wherever it appears, and its response moves with the pattern. It also slashes parameters: a few hundred shared weights instead of about a billion for a dense layer on a megapixel image.'
