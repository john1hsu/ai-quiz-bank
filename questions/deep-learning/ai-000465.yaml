true_statement: Batch normalization standardizes each feature with statistics computed across the examples in a mini-batch, whereas layer normalization uses statistics across the features of a single example.
false_statement: Batch normalization standardizes each feature with statistics computed across the features of a single example, whereas layer normalization uses statistics across the examples in a mini-batch.
explanation: Because batch norm pools over the batch, it depends on batch size and behaves differently at training and inference. Layer norm normalizes within one example, so it is batch-size independent, which is why it suits settings with tiny or unreliable batches.
