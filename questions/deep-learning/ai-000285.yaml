topic: Universal approximation theorem
topic_type: Concept
maturity: foundational
true_statement: Lu and colleagues (NeurIPS 2017) showed ReLU networks of width n + 4 for n inputs are universal approximators as depth grows, while networks of width at most n generally are not.
false_statement: Lu and colleagues (NeurIPS 2017) showed ReLU networks of width n for n inputs are universal approximators as depth grows, while networks of width at most n − 4 generally are not.
explanation: The classical theorems fix depth at one hidden layer and let width grow; this is the mirror image, fixing width and letting depth grow. The sharp jump between width n and n + 4 is a phase transition in what narrow deep networks can represent.
