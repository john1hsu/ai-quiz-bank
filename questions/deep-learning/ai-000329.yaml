true_statement: Fukushima's 1980 neocognitron learned without labels, whereas LeCun and colleagues later trained convolutional networks end to end with backpropagation.
false_statement: Fukushima's 1980 neocognitron was trained end to end with backpropagation, whereas LeCun and colleagues later trained convolutional networks without labels.
explanation: The neocognitron supplied the architecture of alternating feature-detecting and pooling-like layers, inspired by simple and complex cells in the visual cortex. Training it with gradients was LeCun's step, and it led to deployed systems such as cheque readers.
