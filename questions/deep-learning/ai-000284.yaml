topic: Universal approximation theorem
topic_type: Concept
maturity: foundational
true_statement: 'The universal approximation theorem is an existence result: it shows suitable weights exist but bounds neither the number of hidden units needed nor whether training will find them.'
false_statement: 'The universal approximation theorem is a constructive result: it gives the suitable weights and bounds both the number of hidden units needed and whether training will find them.'
explanation: Cybenko's proof works by contradiction and places no limit on width or weight size. Lecture notes add that worst-case size grows exponentially with input dimension and that training is non-convex, so expressive power alone doesn't explain why networks learn well.
