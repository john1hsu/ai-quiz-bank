true_statement: Zhang et al. (ICLR 2017) showed standard image networks can perfectly fit randomly relabelled training data, with explicit regularisation making little difference.
false_statement: Zhang et al. (ICLR 2017) showed standard image networks cannot fit randomly relabelled training data unless explicit regularisation is switched off.
explanation: If the same network can memorise pure noise, its capacity alone cannot explain why it generalises on real labels. The result undercut textbook accounts of generalisation and left the question of why deep nets work partly open.
