true_statement: Santurkar and colleagues (NeurIPS 2018) found batch normalization helps mainly by smoothing the optimization landscape, not by stabilizing the distribution of layer inputs.
false_statement: Santurkar and colleagues (NeurIPS 2018) found batch normalization helps mainly by stabilizing the distribution of layer inputs, not by smoothing the optimization landscape.
explanation: Ioffe and Szegedy's original story was that batch norm reduces internal covariate shift. Santurkar's group found that input-distribution stability had little to do with its success; a smoother landscape makes gradients more predictable, so larger steps are safe.
