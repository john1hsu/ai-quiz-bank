true_statement: Elman's 1990 simple recurrent network fed a copy of the previous hidden-layer activations back in through context units, alongside the current input.
false_statement: Elman's 1990 simple recurrent network fed a buffer of the most recent raw inputs back in as an extra spatial dimension, alongside the current input.
explanation: Elman argued that treating time as an extra spatial dimension fixes the pattern length and treats shifted copies of a pattern as different. His network represented time implicitly through recycled hidden state, the core idea of an RNN's hidden state.
