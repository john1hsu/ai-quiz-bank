true_statement: Without a nonlinear activation, two stacked linear layers collapse into a single linear map, so adding depth adds nothing.
false_statement: Without a nonlinear activation, two stacked linear layers still form a richer map than one, so adding depth adds expressive power.
explanation: W2(W1x) is just (W2W1)x, one linear map. The nonlinearity between layers, such as ReLU or tanh, is what lets a deep network represent functions a single layer can't.
