true_statement: The defining move of deep learning, as LeCun, Bengio and Hinton put it in 2015, is that layered representations are learned from data rather than designed by hand.
false_statement: The defining move of deep learning, as LeCun, Bengio and Hinton put it in 2015, is that layered representations are designed by hand and only the final classifier is learned.
explanation: Earlier pipelines relied on hand-engineered features feeding a trainable classifier. Deep learning trains every layer jointly with backpropagation, so each one learns a slightly more abstract representation of the layer below.
