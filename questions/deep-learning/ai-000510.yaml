true_statement: He and colleagues at Microsoft Research introduced residual connections to fix degradation, where adding layers to a deep plain network raised its training error.
false_statement: He and colleagues at Microsoft Research introduced residual connections to fix overfitting, where adding layers to a deep plain network raised only its test error.
explanation: 'Training error going up with depth means the optimiser, not overfitting, was failing: a deeper net could copy a shallower one with identity layers but did not find that solution. Residual blocks make the identity the easy default by learning only F(x) = H(x) − x.'
