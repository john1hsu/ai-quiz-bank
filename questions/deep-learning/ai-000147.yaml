true_statement: With inverted dropout, surviving activations are scaled up by 1/(1 − p) during training, so the network needs no rescaling at inference.
false_statement: With inverted dropout, surviving activations are left unscaled during training, so every weight must be multiplied by 1 − p at inference.
explanation: 'Inverted dropout moves the correction into training: dividing the survivors by the keep fraction keeps each activation''s expected value unchanged. That is why frameworks like PyTorch simply make dropout the identity in evaluation mode, whereas the original formulation scaled the weights at test time instead.'
