true_statement: Loshchilov and Hutter showed that L2 regularisation and weight decay, equivalent for plain SGD, are not equivalent for Adam, motivating decoupled weight decay in AdamW.
false_statement: Loshchilov and Hutter showed that L2 regularisation and weight decay, equivalent for Adam, are not equivalent for plain SGD, motivating decoupled weight decay in AdamW.
explanation: Adding an L2 term to the gradient means Adam's adaptive scaling also rescales the decay, so heavily updated weights are regularised less. Applying decay separately from the gradient step made the best decay factor independent of the learning rate and improved generalisation.
