true_statement: Keeping dropout switched on at test time and averaging several sampled predictions gives a cheap estimate of a model's uncertainty, known as Monte Carlo dropout.
false_statement: Keeping dropout switched on at test time and averaging several sampled predictions gives a cheap estimate of a model's uncertainty, known as inverted dropout.
explanation: Gal and Ghahramani showed dropout training can be read as approximate Bayesian inference, so the spread of predictions across random masks reflects model uncertainty. Inverted dropout is just the training-time rescaling convention, unrelated to uncertainty estimation.
