true_statement: Pascanu, Mikolov and Bengio (ICML 2013) proposed clipping the gradient norm to tame exploding gradients in RNNs, and a soft regularisation constraint for vanishing ones.
false_statement: Pascanu, Mikolov and Bengio (ICML 2013) proposed clipping the gradient norm to tame vanishing gradients in RNNs, and a soft regularisation constraint for exploding ones.
explanation: Clipping caps a gradient that has grown too large, so it cannot rescue one that has shrunk towards zero. Both problems come from multiplying through the same recurrent weights many times in backpropagation through time; vanishing gradients are better fixed by gated architectures.
