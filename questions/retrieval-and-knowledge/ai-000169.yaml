id: ai-000169
area: retrieval-and-knowledge
kind: mechanism
topic: TF-IDF
topic_type: Technique
maturity: foundational
true_statement: In tf-idf, a word that appears in every document of the collection gets an idf of log(1) = 0, so it adds nothing to a document's score however often it occurs.
false_statement: In tf-idf, a word that appears in only one document of the collection gets an idf of log(1) = 0, so it adds nothing to a document's score however often it occurs.
explanation: Idf is the log of the number of documents divided by the number containing the term. A word like "the" in all N documents gives log(N/N) = 0, while a rare word gets a large weight, which is how tf-idf favours words common in one document but rare overall.
