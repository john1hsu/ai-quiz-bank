true_statement: In BM25 the k1 parameter sets how quickly repeated occurrences of a term saturate, while b sets how strongly scores are normalised by document length.
false_statement: In BM25 the b parameter sets how quickly repeated occurrences of a term saturate, while k1 sets how strongly scores are normalised by document length.
explanation: Saturation means the fifth 'photosynthesis' adds far less than the first, capping any one term's pull. Length normalisation, at b = 1 full and at b = 0 none, discounts long documents that repeat words merely because they are wordy.
