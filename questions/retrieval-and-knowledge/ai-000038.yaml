true_statement: Word2vec's skip-gram predicts the surrounding context words from a centre word, while CBOW predicts the centre word from its context.
false_statement: Word2vec's CBOW predicts the surrounding context words from a centre word, while skip-gram predicts the centre word from its context.
explanation: Skip-gram goes from one word out to its window; continuous bag of words averages the context vectors and predicts the word in the middle. Both are self-supervised, since raw text supplies the targets.
