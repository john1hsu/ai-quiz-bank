true_statement: GloVe was introduced by Pennington, Socher and Manning of Stanford at EMNLP 2014 to unite global count-based matrix factorisation with local context-window prediction.
false_statement: GloVe was introduced by Pennington, Socher and Manning of Stanford at EMNLP 2017 to unite global count-based matrix factorisation with local context-window prediction.
explanation: GloVe appeared in 2014, a year after word2vec. Its authors saw that LSA-style factorisation used whole-corpus counts efficiently but did poorly on analogies, while window predictors like skip-gram did well on analogies but saw one window at a time, so they aimed for both.
