topic: GloVe
topic_type: Algorithm
maturity: foundational
true_statement: GloVe fits word and context vectors by weighted least squares so that their dot product plus two biases approximates the logarithm of the pair's co-occurrence count.
false_statement: GloVe fits word and context vectors by weighted least squares so that their dot product plus two biases approximates the ratio of the pair's co-occurrence probabilities.
explanation: Ratios of co-occurrence probabilities motivate GloVe ("solid" is far likelier near "ice" than "steam"), but the fitted target is log X_ij. Because a log turns ratios into differences, vector differences then encode those ratios, which is what gives GloVe its analogy structure.
