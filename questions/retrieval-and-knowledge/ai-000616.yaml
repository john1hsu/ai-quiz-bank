kind: definition
topic: GraphRAG
topic_type: Technique
maturity: emerging
true_statement: GraphRAG targets global sensemaking questions, such as a corpus's main themes, whose answers are spread across many documents where nearest-chunk vector retrieval falls short.
false_statement: GraphRAG targets pointed factual questions, such as one entity's birth date, whose answers sit in a single passage where nearest-chunk vector retrieval falls short.
explanation: Retrieving the few chunks closest to a query works when one passage holds the answer. A question about the whole collection has no single nearest chunk, so GraphRAG summarises the corpus in advance through an entity graph and its communities.
