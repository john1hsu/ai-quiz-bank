topic: Named-entity recognition
topic_type: Application
maturity: established
true_statement: UniversalNER distilled ChatGPT into smaller open-type entity recognisers by instruction tuning, without supervised NER examples, and reported beating ChatGPT on a 43-dataset benchmark.
false_statement: UniversalNER distilled ChatGPT into smaller open-type entity recognisers by fine-tuning on supervised NER examples, and reported trailing ChatGPT on a 43-dataset benchmark.
explanation: Targeted distillation works because a small model only needs the teacher's skill at one task, not its general ability. Open NER lets users name arbitrary entity types, escaping the fixed type sets of classic benchmarks.
