true_statement: Word2vec's negative sampling draws noise words from the unigram distribution raised to the 3/4 power, which slightly raises how often rare words are picked as negatives.
false_statement: Word2vec's negative sampling draws noise words from the unigram distribution raised to the 3/4 power, which slightly raises how often frequent words are picked as negatives.
explanation: Negative sampling turns training into telling real word-context pairs from k noise words, avoiding a full softmax over the vocabulary. Raising frequencies to 0.75 flattens the distribution, so rare words get a bit more of the probability mass and frequent ones a bit less.
