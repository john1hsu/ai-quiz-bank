topic: Retrieval-augmented generation for knowledge-intensive tasks
topic_type: Technique
maturity: established
true_statement: Compared with fine-tuning, RAG makes knowledge easy to update and answers traceable to sources, while fine-tuning gives more control over style and format and lower latency.
false_statement: Compared with fine-tuning, RAG gives more control over style and format and lower latency, while fine-tuning makes knowledge easy to update and answers traceable to sources.
explanation: Swapping documents in an index updates what a RAG system knows without retraining, and the retrieved passages show where an answer came from, but the retrieval step adds latency. Fine-tuning bakes behaviour into the weights, which suits style and format, so the two are often combined.
