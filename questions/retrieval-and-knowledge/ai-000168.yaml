true_statement: Inverse document frequency came from Karen Spärck Jones's 1972 paper, while combining it with term frequency emerged largely from Gerard Salton's SMART group at Cornell.
false_statement: Inverse document frequency came from Gerard Salton's 1972 paper, while combining it with term frequency emerged largely from Karen Spärck Jones's group at Cambridge.
explanation: Spärck Jones argued that a term attached to many documents discriminates poorly, so it should weigh less. Salton and Buckley's later experiments recommended multiplying that idf by within-document term frequency, giving the tf-idf weighting search engines used for decades.
