topic: Word2vec
topic_type: Algorithm
maturity: foundational
true_statement: Word2vec gives each vocabulary word one fixed vector whatever sentence it appears in, so it cannot separate the river and the money senses of "bank".
false_statement: Word2vec gives each vocabulary word a new vector in every sentence it appears in, so it can separate the river and the money senses of "bank".
explanation: 'Word2vec embeddings are static: one vector per word type, blending all its senses. Producing a different vector per occurrence is what contextual encoders such as BERT do, which is why they replaced static vectors in most modern systems.'
