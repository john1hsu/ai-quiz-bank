true_statement: Microsoft's LazyGraphRAG swaps LLM entity extraction for cheaper noun-phrase extraction and skips index-time summaries, deferring LLM work to query time.
false_statement: Microsoft's LazyGraphRAG swaps noun-phrase extraction for fuller LLM entity extraction and writes all summaries at index time, removing LLM work from query time.
explanation: Full GraphRAG's main drawback is cost, since every chunk passes through an LLM before any question is asked. LazyGraphRAG moves that spending to query time, which Microsoft says brings indexing cost down to that of vector RAG.
