true_statement: Levy and Goldberg showed skip-gram with negative sampling implicitly factorises a word-context matrix of pointwise mutual information shifted by a constant.
false_statement: Levy and Goldberg showed skip-gram with negative sampling implicitly factorises a term-document matrix of tf-idf weights shifted by a constant.
explanation: This result tied word2vec back to count-based distributional methods built on PMI. An exact SVD of that matrix could match it on word similarity, though skip-gram stayed ahead on analogies; tf-idf weights term-document counts and is a different, sparse scheme.
