true_statement: In 2019, Nogueira and Cho's BERT reranker over BM25's top 1,000 passages raised MS MARCO mean reciprocal rank at 10 from about 16.5 to 35.8, more than doubling it.
false_statement: In 2019, Nogueira and Cho's BERT reranker over BM25's top 1,000 passages raised MS MARCO mean reciprocal rank at 10 from about 16.5 to 21.8, a gain of about a third.
explanation: Fine-tuning BERT as a relevance classifier and running it only over BM25's shortlist more than doubled the score and topped the MS MARCO leaderboard. Its retrieve-then-rerank-then-answer shape became the template for today's RAG pipelines.
