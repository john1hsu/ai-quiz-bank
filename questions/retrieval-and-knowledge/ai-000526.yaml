true_statement: In 2019 DiskANN reported over 95% 1-recall@1 on a one-billion-point index served from a 64 GB RAM workstation, while memory-matched Faiss baselines plateaued near 50% recall.
false_statement: In 2019 DiskANN reported over 95% 1-recall@1 on a one-billion-point index served from a 64 GB RAM workstation, while memory-matched Faiss baselines plateaued near 85% recall.
explanation: DiskANN kept only compressed vectors in RAM and put its Vamana graph on SSD, so it could search a billion points accurately on modest hardware. In-memory baselines given the same RAM budget stalled at around half that recall.
