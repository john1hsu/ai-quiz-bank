true_statement: In GraphRAG's global search, a map step turns each batch of community summaries into a partial answer scored 0–100, and a reduce step merges the best-scored ones.
false_statement: In GraphRAG's global search, a reduce step turns each batch of community summaries into a partial answer scored 0–100, and a map step merges the best-scored ones.
explanation: Map-reduce lets the system cover far more summaries than one context window could hold. Partial answers scored zero are dropped, and the rest are combined highest-scored first, so the final answer draws on the most helpful parts of the corpus.
