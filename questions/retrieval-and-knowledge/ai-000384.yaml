true_statement: RAG-Sequence conditions the whole answer on one retrieved passage at a time, while RAG-Token can draw on a different retrieved passage for each generated token.
false_statement: RAG-Token conditions the whole answer on one retrieved passage at a time, while RAG-Sequence can draw on a different retrieved passage for each generated token.
explanation: Both variants treat the retrieved passages as a latent variable and marginalise over them; they differ in where the sum sits. RAG-Sequence sums over passages for the full output, while RAG-Token sums at every token, letting one answer combine evidence from several passages.
