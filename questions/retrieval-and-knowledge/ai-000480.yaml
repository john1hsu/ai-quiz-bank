true_statement: Reciprocal rank fusion scores each document by summing 1/(k + rank) over the result lists that contain it, so BM25 scores and cosine similarities never need a common scale.
false_statement: Reciprocal rank fusion scores each document by summing its min-max normalised scores over the result lists that contain it, so BM25 scores and cosine similarities share a common scale.
explanation: RRF throws away raw scores and keeps only positions, which sidesteps the fact that lexical and dense scores live on unrelated scales. Normalising and summing scores is the other fusion family, score fusion, used for example by Weaviate's relative score fusion.
