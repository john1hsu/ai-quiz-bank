true_statement: In pgvector, vector search over an ordinary PostgreSQL table is exact by default, and adding an HNSW or IVFFlat index switches it to approximate results.
false_statement: In pgvector, vector search over an ordinary PostgreSQL table is approximate by default, and adding an HNSW or IVFFlat index switches it to exact results.
explanation: Without an index, pgvector compares the query with every row, which is exact but scales linearly. An approximate nearest neighbour index trades a little recall for much faster queries, the same trade every vector database makes at scale.
