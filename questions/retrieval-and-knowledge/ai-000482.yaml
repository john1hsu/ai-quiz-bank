true_statement: Ma and colleagues' 2021 replication of dense passage retrieval found that the top results of sparse and dense retrievers overlap little, suggesting the two exploit different relevance signals.
false_statement: Ma and colleagues' 2021 replication of dense passage retrieval found that the top results of sparse and dense retrievers overlap heavily, suggesting the two exploit the same relevance signals.
explanation: 'Low overlap is the core argument for hybrid search: if both retrievers returned the same documents, fusing them would add nothing. Because they surface different relevant passages, the replication found tuned hybrids beat dense retrieval alone on nearly every dataset.'
