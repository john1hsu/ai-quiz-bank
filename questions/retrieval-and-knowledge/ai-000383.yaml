true_statement: The name retrieval-augmented generation comes from a 2020 NeurIPS paper by Patrick Lewis and colleagues, whose generator drew on a dense vector index of Wikipedia.
false_statement: The name retrieval-augmented generation comes from a 2020 ICML paper by Kelvin Guu and colleagues, whose generator drew on a dense vector index of Wikipedia.
explanation: 'Lewis et al. coined RAG, pairing a seq2seq model''s parametric memory with a non-parametric Wikipedia index. Guu et al.''s REALM, at ICML 2020, was the precursor: it added a retriever to masked-language-model pretraining but extracted answers rather than generating them.'
