id: ai-000435
area: retrieval-and-knowledge
kind: mechanism
topic: Reranking
topic_type: Technique
maturity: established
true_statement: ColBERT encodes the query and the document separately into per-token embeddings, then sums each query token's highest similarity to any document token.
false_statement: ColBERT encodes the query and the document jointly as one input into per-token embeddings, then sums each query token's highest similarity to any document token.
explanation: Encoding separately is what lets ColBERT precompute document embeddings offline, making it over 170 times faster than a BERT cross-encoder at reranking. Joint encoding of query and passage is the cross-encoder design, which is accurate but needs a full transformer pass per pair.
