true_statement: The Okapi team's TREC-3 paper presented BM25 as unifying BM11 and BM15 through parameter b, with b = 1 giving BM11 and b = 0 giving BM15.
false_statement: The Okapi team's TREC-3 paper presented BM25 as unifying BM11 and BM15 through parameter b, with b = 0 giving BM11 and b = 1 giving BM15.
explanation: BM25 was built at City University London for the Okapi system. BM11 fully normalised for document length and BM15 ignored it; making b tunable let one function cover the whole range in between.
