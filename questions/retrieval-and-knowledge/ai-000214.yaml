id: ai-000214
area: retrieval-and-knowledge
kind: definition
topic: Approximate nearest neighbor search
topic_type: Technique
maturity: established
true_statement: HNSW draws each element's top layer from an exponentially decaying distribution, so its upper graph layers are sparse and carry long-range links.
false_statement: HNSW places every element in every layer of its hierarchy, so its upper graph layers are as dense as the bottom one and carry only short-range links.
explanation: Few points reach the top layers, so a search there takes big jumps across the dataset, then descends to denser layers to refine. This coarse-to-fine greedy walk is why Malkov and Yashunin report logarithmic scaling with dataset size.
