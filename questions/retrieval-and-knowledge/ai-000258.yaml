true_statement: When Levy, Goldberg and Dagan retrained GloVe and skip-gram with negative sampling on the same corpus with matched hyperparameters, skip-gram beat GloVe on every task they tested.
false_statement: When Levy, Goldberg and Dagan retrained GloVe and skip-gram with negative sampling on the same corpus with matched hyperparameters, GloVe beat skip-gram on every task they tested.
explanation: GloVe's original paper reported beating skip-gram, but Levy and colleagues traced that gap to uncontrolled hyperparameters, a single analogy set and different corpora. The wider lesson is that design choices such as context smoothing often matter more than which embedding algorithm you pick.
