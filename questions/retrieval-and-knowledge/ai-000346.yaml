true_statement: In 2020, Dense Passage Retrieval's dual encoder beat a strong Lucene BM25 baseline by 9 to 19 points absolute in top-20 passage retrieval accuracy on open-domain question answering.
false_statement: In 2020, a strong Lucene BM25 baseline beat Dense Passage Retrieval's dual encoder by 9 to 19 points absolute in top-20 passage retrieval accuracy on open-domain question answering.
explanation: Karpukhin et al. encoded questions and passages separately into dense vectors, and that learned matching clearly outperformed keyword scoring on their QA benchmarks. The result helped shift IR toward neural retrievers, though BM25 stays the baseline every new retriever is measured against.
