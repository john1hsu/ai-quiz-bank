true_statement: The BEIR benchmark (2021) found that dense retrievers, tested zero-shot on new domains, often underperformed the BM25 baseline.
false_statement: The BEIR benchmark (2021) found that BM25, tested zero-shot on new domains, often underperformed the dense retriever baselines.
explanation: Dense models learn their notion of similarity from training data, which may not transfer, while BM25 needs no training and just matches terms. That robustness is why BM25 survives as the keyword half of hybrid search in RAG systems.
