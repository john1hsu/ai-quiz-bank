true_statement: Robertson argued in 2004 that idf is best justified by the Robertson/Spärck Jones relevance weight, rather than by Zipf's law or Shannon information theory.
false_statement: Robertson argued in 2004 that idf is best justified by Shannon information theory, rather than by Zipf's law or the Robertson/Spärck Jones relevance weight.
explanation: Tf-idf was long seen as a heuristic. The relevance weight reduces to an idf-like form when no relevance judgments are available, giving idf a probabilistic grounding, and BM25 then adds a principled, saturating term-frequency component.
