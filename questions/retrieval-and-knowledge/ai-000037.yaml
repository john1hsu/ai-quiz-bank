true_statement: One-hot word codes can't show that "cat" is closer to "dog" than to "carburettor", because any two distinct one-hot vectors have cosine similarity zero.
false_statement: One-hot word codes can't show that "cat" is closer to "dog" than to "carburettor", because any two distinct one-hot vectors have cosine similarity one.
explanation: Each one-hot vector has a single 1 in its own position, so distinct words are always orthogonal and equally unrelated. Learned dense embeddings fix this by placing words used in similar contexts near each other.
