true_statement: Reciprocal rank fusion, now a common way to merge keyword and vector results in hybrid search, was introduced by Cormack, Clarke and Buettcher at SIGIR 2009.
false_statement: Reciprocal rank fusion, now a common way to merge keyword and vector results in hybrid search, was introduced by Cormack, Clarke and Buettcher at SIGIR 2019.
explanation: RRF dates from 2009, about a decade before dense passage retrieval in 2020. Because it uses only rank positions, it later became a natural fit for merging BM25 with embedding search, whose scores are not comparable.
