true_statement: In asymmetric semantic search a short query must match a longer passage that answers it, whereas in symmetric search the query and documents are alike.
false_statement: In symmetric semantic search a short query must match a longer passage that answers it, whereas in asymmetric search the query and documents are alike.
explanation: Matching a question to paraphrased questions is symmetric; matching a question to the passage that answers it is asymmetric. Sentence Transformers advises picking an encoder trained for the right setting, since one tuned for the other works worse.
