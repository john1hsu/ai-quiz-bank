true_statement: 'Cyril Cleverdon''s Cranfield experiments in the 1960s set the template for evaluating information retrieval: a fixed document collection, a set of queries and human relevance judgments.'
false_statement: 'Gerard Salton''s SMART experiments in the 1960s set the template for evaluating information retrieval: a fixed document collection, a set of queries and human relevance judgments.'
explanation: Cleverdon ran the Cranfield tests at the Cranfield College of Aeronautics from 1958 to 1966, and NIST's TREC later scaled the same collection-queries-judgments recipe up. Salton's SMART project is remembered for ranking ideas such as the vector space model and TF-IDF weighting, not for the evaluation template.
