maturity: foundational
true_statement: An inverted index maps each term to a postings list of the documents that contain it, so answering a query only means reading the lists for the query's terms.
false_statement: An inverted index maps each document to a list of the terms it contains, so answering a query only means reading the lists for the query's terms.
explanation: Scanning every document at query time is far too slow for large collections, so IR systems index in advance by term. Storing terms per document is the forward direction; the index is called inverted precisely because it flips that to documents per term.
