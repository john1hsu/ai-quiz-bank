true_statement: A reranker cannot raise recall beyond what its first-stage retriever returns, because it only reorders the candidates it is given.
false_statement: A reranker can raise recall beyond what its first-stage retriever returns, because it rescans the collection for documents the first stage missed.
explanation: 'Reranking trades breadth for precision on a shortlist, so a relevant document the first stage never fetched is lost for good. The ColBERT paper showed this: retrieving end to end lifted MS MARCO Recall@1000 from 81.4 when reranking BM25 candidates to 96.8.'
