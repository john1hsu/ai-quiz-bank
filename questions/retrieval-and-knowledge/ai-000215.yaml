true_statement: In 2018 ANN-Benchmarks results, graph indexes such as HNSW generally gave the best recall-speed trade-offs at high recall, though some took hours to build.
false_statement: In 2018 ANN-Benchmarks results, locality-sensitive hashing generally gave the best recall-speed trade-offs at high recall, though some indexes took hours to build.
explanation: ANN methods trade accuracy, speed, memory and build time. Graph indexes excel at fast high-recall queries but cost memory and build time, while compressed inverted-file indexes like Faiss's built in seconds with a small footprint, which is why they suit very large collections.
