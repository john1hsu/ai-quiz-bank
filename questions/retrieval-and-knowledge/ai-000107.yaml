true_statement: Latent semantic indexing, introduced by Deerwester and colleagues in 1990, applied singular value decomposition to a large term-by-document matrix.
false_statement: Latent semantic indexing, introduced by Deerwester and colleagues in 1990, applied k-means clustering to a large term-by-document matrix.
explanation: Keeping about 100 factors from the SVD turned each document into a short concept vector, an early version of today's embeddings. The decomposition was costly and hard to update, so neural encoders later took its place.
