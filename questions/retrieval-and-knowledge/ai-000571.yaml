true_statement: In BIO tagging for named-entity recognition, each token is marked as beginning, inside or outside an entity, so n entity types need 2n+1 tags.
false_statement: In BIO tagging for named-entity recognition, each token is marked as beginning, inside or outside an entity, so n entity types need n+1 tags.
explanation: Every type gets its own B and I tag, plus one shared O tag, giving 2n+1. The separate B tag is what lets a tagger mark where one entity ends and an adjacent entity of the same type begins, which the simpler IO scheme blurs.
