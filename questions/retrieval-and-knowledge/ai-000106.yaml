topic: Semantic search
topic_type: Technique
maturity: established
true_statement: Synonymy makes keyword retrieval undervalue a document saying 'automobile' for a 'car' query, while polysemy inflates similarity between texts using a word in different senses.
false_statement: Polysemy makes keyword retrieval undervalue a document saying 'automobile' for a 'car' query, while synonymy inflates similarity between texts using a word in different senses.
explanation: Giving every term its own dimension means different words for one idea never match (synonymy), and one word for different ideas always does (polysemy). Semantic search exists to fix both by comparing meanings rather than strings.
