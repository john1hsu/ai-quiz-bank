true_statement: Named-entity recognition was defined as an evaluation task at the Sixth Message Understanding Conference (MUC-6), held in 1995, with all test texts from the Wall Street Journal.
false_statement: Named-entity recognition was defined as an evaluation task at the CoNLL-2003 shared task, held in 2003, with all test texts from the Wall Street Journal.
explanation: MUC-6 wanted practical, domain-independent component tasks, and named entities fit. CoNLL-2003 came later and set the benchmark of the next two decades, using Reuters and German newspaper text rather than the Wall Street Journal.
