true_statement: In filtered vector search, post-filtering runs the similarity search first and applies attribute filters afterwards, so it can return fewer than k results unless extra candidates are fetched.
false_statement: In filtered vector search, pre-filtering runs the similarity search first and applies attribute filters afterwards, so it can return fewer than k results unless extra candidates are fetched.
explanation: If the nearest k vectors are found first, filters such as tenant or date may discard many of them, leaving a short result list. Pre-filtering does the opposite, blocking non-matching vectors before the scan, which avoids that shortfall but can disconnect a graph index.
