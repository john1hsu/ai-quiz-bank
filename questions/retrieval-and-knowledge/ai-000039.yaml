true_statement: Sentence-BERT (2019) cut a most-similar-pair search over 10,000 sentences from about 65 hours with BERT to about 5 seconds.
false_statement: Sentence-BERT (2019) cut a most-similar-pair search over 10,000 sentences from about 65 hours with BERT to about 5 minutes.
explanation: BERT reads both sentences together, so every pair needs its own pass, about 50 million of them. Sentence-BERT encodes each sentence once into a vector compared by cosine similarity, the bi-encoder idea behind dense retrieval.
