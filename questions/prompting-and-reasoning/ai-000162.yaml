true_statement: The s1 recipe's budget forcing extends reasoning by appending "Wait" when the model tries to stop, a sequential way to spend more test-time compute.
false_statement: The s1 recipe's budget forcing extends reasoning by sampling extra answers in parallel when the model tries to stop, a parallel way to spend more test-time compute.
explanation: Budget forcing either cuts reasoning off or, by adding "Wait", nudges the model to re-check its own work in one longer chain. Parallel sampling with voting or a verifier is the other family of test-time methods, and s1 showed the sequential route can work with just 1,000 curated training traces.
