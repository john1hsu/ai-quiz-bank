topic: Test-time compute
topic_type: Concept
maturity: emerging
true_statement: Snell et al. found a smaller model given extra test-time compute could beat a 14× larger model at matched FLOPs, but only on prompts it already solved some of the time.
false_statement: Snell et al. found a smaller model given extra test-time compute could beat a 14× larger model at matched FLOPs, but only on the hardest prompts it almost never solved.
explanation: Extra samples or revisions help only if the model can sometimes reach the right answer; when it almost never does, more inference compute has nothing to select or refine. That is why inference compute only partly substitutes for pretraining a larger model.
