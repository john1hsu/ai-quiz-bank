topic: Chain-of-thought prompting
topic_type: Technique
maturity: established
true_statement: Self-consistency samples several diverse reasoning chains and takes the most frequent final answer, instead of decoding one chain greedily.
false_statement: Self-consistency decodes one reasoning chain greedily, then has the model recheck each step and revise any it judges wrong.
explanation: Different chains can reach the right answer by different routes, and wrong chains tend to disagree, so a majority vote filters errors. Wang et al. reported gains over plain chain-of-thought such as 17.9% on GSM8K.
