true_statement: Apple's 2025 puzzle study found standard models matched or beat reasoning models on easy instances, reasoning models helped at medium complexity, and both collapsed on hard ones.
false_statement: Apple's 2025 puzzle study found standard models matched or beat reasoning models on easy instances, reasoning models helped at medium complexity, and only standard models collapsed on hard ones.
explanation: Extra thinking helped only in a middle band; at high complexity both kinds of model failed completely, and reasoning effort eventually fell as puzzles got harder. How far this generalises beyond puzzles is debated, but it is why simple requests are often sent to non-reasoning modes.
