true_statement: Most AQuA problems that Ling et al.'s model solved needed only one or two operations, and long rationales of over 200 tokens strained its attention and copy mechanisms.
false_statement: Most AQuA problems that Ling et al.'s model solved needed five or more operations, and long rationales of over 200 tokens helped its attention and copy mechanisms.
explanation: The 2017 LSTM model handled short computations but struggled to keep track over long multi-step reasoning. Its rationales were also judged only with automatic metrics, with no human evaluation, so their quality as explanations was not directly tested.
