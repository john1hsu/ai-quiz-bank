topic: Reflexion
topic_type: Technique
maturity: established
true_statement: Reflexion improves a language agent across attempts by writing verbal reflections on its failures into memory for the next try, rather than updating model weights.
false_statement: Reflexion improves a language agent across attempts by converting its failures into reward signals that fine-tune model weights before the next try.
explanation: 'Its authors call the reflection a semantic gradient: a direction for improvement expressed in words and placed in the prompt. That avoids the many samples and costly weight updates conventional reinforcement learning needs.'
