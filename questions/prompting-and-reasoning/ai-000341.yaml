true_statement: Automatic Prompt Engineer (APE) has an LLM propose candidate instructions, scores each one on training examples, and keeps the best performer.
false_statement: Automatic Prompt Engineer (APE) has humans propose candidate instructions, has an LLM score each one by its fluency, and keeps the best performer.
explanation: APE treats the instruction as a program to search over, with a model generating candidates and a metric such as training accuracy choosing among them. This reframes prompt writing as optimisation; across 24 tasks its instructions matched or beat human ones on 21.
