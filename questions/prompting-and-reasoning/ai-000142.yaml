true_statement: Lu et al. found good orderings of few-shot examples did not transfer between models, and order sensitivity appeared at every model size they tested.
false_statement: Lu et al. found good orderings of few-shot examples transferred reliably between models, and order sensitivity faded away as the models grew bigger.
explanation: Simply permuting the same demonstrations could swing results between strong and random-guess level, and scale did not cure it. Since no ordering is universally good, they ranked orders per model using a self-generated probing set.
