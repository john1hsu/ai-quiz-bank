true_statement: Liu et al.'s 2021 survey named the 'pre-train, prompt, and predict' paradigm, in which an input is wrapped in a template whose open slots the language model fills.
false_statement: Brown et al.'s 2020 GPT-3 paper named the 'pre-train, prompt, and predict' paradigm, in which an input is wrapped in a template whose open slots the language model fills.
explanation: GPT-3 showed in 2020 that tasks could be specified purely in text; Liu and colleagues' survey a year later gave the shift its name. The point is that one pretrained model is steered by templates instead of training a separate supervised model per task.
