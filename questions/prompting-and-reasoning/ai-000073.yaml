false_statement: In the 2023 self-consistency paper, voting over sampled reasoning paths raised chain-of-thought accuracy on GSM8K by 3.9 points.
explanation: Multi-step arithmetic word problems gained the most because different valid chains converge on one number while errors scatter. The 3.9-point gain was on ARC-challenge, where there was less room to improve.
