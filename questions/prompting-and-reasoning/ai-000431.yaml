true_statement: DeepSeek-R1 was trained with reinforcement learning that rewarded verifiable final answers in maths, coding and STEM tasks, without human-annotated reasoning trajectories.
false_statement: DeepSeek-R1 was trained with reinforcement learning that rewarded matching human-annotated reasoning trajectories step by step in maths, coding and STEM tasks.
explanation: Because only the outcome is rewarded, the model is free to develop its own problem-solving style inside the trace. DeepSeek-AI reported that self-reflection and verification emerged from this training rather than being taught from human examples.
