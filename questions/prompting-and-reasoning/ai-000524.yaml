true_statement: The Tree of Thoughts authors estimated that it can generate 5 to 100 times more tokens than chain-of-thought prompting on the same problem.
false_statement: The Tree of Thoughts authors estimated that it can generate 1.5 to 2 times more tokens than chain-of-thought prompting on the same problem.
explanation: Every branch proposed, evaluated and expanded costs model calls, so search multiplies token use well beyond a single chain. That price is why the authors note deliberate search may be unnecessary on tasks a strong model already handles.
