topic: Scratchpad
topic_type: Technique
maturity: established
true_statement: A scratchpad helps a transformer because each generated token adds a fixed amount of computation, and earlier written steps become context it can read back.
false_statement: A scratchpad helps a transformer because it unlocks extra layers inside the network, so each step is computed more deeply rather than written out as context.
explanation: A single forward pass has bounded depth, which is too little for long multi-step tasks like adding many-digit numbers. Writing intermediate results out spreads the work across many tokens, and the model can consult its own trace, the same principle later behind chain of thought and test-time compute.
