true_statement: Scratchpads were introduced by Nye, Odena and colleagues at Google in the 2021 paper Show Your Work, before chain-of-thought prompting was published.
false_statement: Scratchpads were introduced by Wei and colleagues at Google in the 2023 paper Show Your Work, after chain-of-thought prompting was published.
explanation: Nye et al. trained or prompted models to emit intermediate computation inside scratch tags. Chain-of-thought prompting lists that work among its predecessors and showed that a few natural-language exemplars could elicit similar steps from large models without fine-tuning.
