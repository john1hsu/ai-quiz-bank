true_statement: Plain self-consistency needs answers that match exactly, so Universal Self-Consistency asks the model itself to pick the most consistent of its candidates.
false_statement: Plain self-consistency needs answers that match exactly, so Universal Self-Consistency trains a separate reward model to pick the best of the candidates.
explanation: A vote works for numbers or multiple-choice labels but not for summaries or code, where no two outputs are identical. Letting the model judge consistency extends the idea to open-ended tasks while matching standard voting on math.
