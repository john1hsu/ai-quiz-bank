topic_type: Technique
maturity: established
true_statement: Least-to-most prompting first has the model split a problem into subquestions, then answers them in order, putting each earlier answer into the prompt for the next.
false_statement: Least-to-most prompting first has the model split a problem into subquestions, then answers them in parallel, with no subquestion seeing the others' answers.
explanation: 'The sequential hand-off is the point: each call builds on solved pieces, so every step is only slightly harder than the last and close to what the exemplars show. That explicit chaining is what distinguishes it from a single free-running chain of thought.'
