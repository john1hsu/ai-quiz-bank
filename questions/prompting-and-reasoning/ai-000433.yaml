true_statement: In OpenAI's API, a reasoning model's reasoning tokens are hidden from the developer, yet they are billed as output tokens and take up context-window space.
false_statement: In OpenAI's API, a reasoning model's reasoning tokens are hidden from the developer, so they are excluded from billing and take up no context-window space.
explanation: Quality is bought with output tokens whether or not you see them, so cost and latency scale with thinking length. A response can even hit its token cap before any visible answer appears while still being charged, which is why OpenAI suggests reserving a large token budget.
