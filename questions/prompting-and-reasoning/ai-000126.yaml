true_statement: Sclar et al. (ICLR 2024) measured accuracy gaps of up to 76 points for LLaMA-2-13B from changing only prompt formatting such as separators, spacing and casing.
false_statement: Sclar et al. (ICLR 2024) measured accuracy gaps of up to 7.6 points for LLaMA-2-13B from changing only prompt formatting such as separators, spacing and casing.
explanation: Formatting that means nothing to a human could move a model from near failure to strong performance, and the effect persisted with bigger models and instruction tuning. Their FormatSpread method reports a range over formats instead of a single score.
