topic: 'Program Induction by Rationale Generation: Learning to Solve and Explain Algebraic Word Problems'
topic_type: Work
maturity: historical
true_statement: Ling et al. (2017) supervised their algebra solver with step-by-step rationales rather than programs, using each rationale's milestones to constrain the hidden arithmetic program.
false_statement: Ling et al. (2017) supervised their algebra solver with hand-written programs rather than rationales, using each program's steps to constrain the generated natural-language rationale.
explanation: The program was a latent variable that was never observed; the search kept only instructions able to emit the next rationale token. The authors report that without rationales the space of programs was too large to learn from question-answer pairs alone.
