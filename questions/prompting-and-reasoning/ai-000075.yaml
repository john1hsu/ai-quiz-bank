true_statement: Brown et al. (2024) found majority voting stops improving after several hundred samples, even as the share of problems solved by at least one sample keeps rising.
false_statement: Brown et al. (2024) found majority voting keeps improving past several hundred samples, rising in step with the share of problems solved by at least one sample.
explanation: Sampling more keeps producing a correct answer somewhere, but without an automatic verifier the vote cannot single it out. The gap shows that answer selection, not generation, becomes the bottleneck at large budgets.
