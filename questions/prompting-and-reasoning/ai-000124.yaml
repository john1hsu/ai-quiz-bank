id: ai-000124
area: prompting-and-reasoning
kind: mechanism
topic: Prompt sensitivity
topic_type: Concept
maturity: established
true_statement: Contextual calibration gives the model the prompt with a content-free input such as 'N/A', then fits a correction so that input gets a uniform label prediction.
false_statement: Contextual calibration gives the model the prompt with a content-free input such as 'N/A', then fits a correction so that input gets the most frequent label in the prompt.
explanation: A content-free input should favour no answer, so whatever the model predicts for it exposes its built-in bias toward recent or common labels. Cancelling that bias raised GPT-2 and GPT-3 accuracy by up to 30 points and steadied results across prompts.
