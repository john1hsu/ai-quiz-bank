true_statement: Constrained decoding zeroes the probability of every token that could not lead to a valid output and renormalises, so sampling settings such as temperature still apply within the allowed set.
false_statement: Constrained decoding zeroes the probability of every token that could not lead to a valid output and renormalises, so sampling settings such as temperature stop having any effect.
explanation: 'The constraint is a mask applied before sampling, not a replacement for it: the model still samples, just from the tokens that keep the output parseable. Temperature reshapes the probabilities among those allowed tokens.'
