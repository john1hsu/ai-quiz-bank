true_statement: Huang and colleagues noted that Reflexion's HotPotQA setup used the correct answer to decide when to stop retrying, and argued such gains vanish without oracle labels.
false_statement: Huang and colleagues noted that Reflexion's HotPotQA setup used a label-free self-check to decide when to stop retrying, and argued such gains hold without oracle labels.
explanation: If the loop stops only when the answer is right, more retries are bound to look like improvement. Surveys of self-correction conclude it works when honest external feedback exists, as with test suites or game environments.
