true_statement: In the scratchpad experiments, models trained on 1–8 digit sums with traces improved on unseen 9- and 10-digit sums as they grew, while direct-answer models failed.
false_statement: In the scratchpad experiments, models trained on 1–8 digit sums with direct answers improved on unseen 9- and 10-digit sums as they grew, while scratchpad models failed.
explanation: Writing out each digit with its carry teaches a procedure that extends to longer inputs, whereas mapping inputs straight to answers does not generalise out of distribution. A written trace still does not guarantee correct computation, so the gains have limits.
