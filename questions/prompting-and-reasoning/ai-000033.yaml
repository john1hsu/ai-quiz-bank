true_statement: Wei et al. found chain-of-thought helped only models of about 100 billion parameters or more; smaller models did worse than with standard prompting.
false_statement: Wei et al. found chain-of-thought helped smaller models the most, while models of about 100 billion parameters or more gained little from it.
explanation: Below that scale, models wrote fluent but illogical chains that hurt accuracy. The authors also warned that a chain carries no guarantee of correct reasoning, and later work showed chains can rationalise answers rather than explain them.
