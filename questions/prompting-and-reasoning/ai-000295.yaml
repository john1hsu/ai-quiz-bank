topic: 'Self-Refine: Iterative Refinement with Self-Feedback'
topic_type: Work
maturity: established
true_statement: Self-Refine prompts one LLM to draft an answer, critique it and rewrite it, and the refine prompt carries the history of earlier drafts and critiques.
false_statement: Self-Refine trains a separate critic model to critique a generator LLM's draft, and the refine prompt carries only the current draft and its critique.
explanation: All three roles are the same frozen model set up with few-shot prompts, so the method needs no training data or weight updates. Keeping the full history lets the model avoid repeating mistakes it already made in earlier rounds.
