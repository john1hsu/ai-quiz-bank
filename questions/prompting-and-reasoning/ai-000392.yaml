true_statement: Min et al. (EMNLP 2022) found that swapping the gold labels in demonstrations for random ones barely hurt accuracy across 12 models, including GPT-3.
false_statement: Min et al. (EMNLP 2022) found that swapping the gold labels in demonstrations for random ones sharply cut accuracy across 12 models, including GPT-3.
explanation: Demonstrations mostly show the model the label space, the kind of input text and the output format, not the correct input-label mapping. That is why few-shot examples are good at controlling format and weak at teaching genuinely new knowledge.
