true_statement: In the 2020 GPT-3 paper, few-shot prompts typically held 10 to 100 demonstrations, capped by what fit in the model's 2,048-token context window.
false_statement: In the 2020 GPT-3 paper, few-shot prompts typically held 10 to 100 demonstrations, capped by what fit in the model's 32,768-token context window.
explanation: The number of demonstrations is bounded by the context window, and GPT-3's was only 2,048 tokens. Much longer windows later made many-shot prompting with hundreds or thousands of examples possible.
