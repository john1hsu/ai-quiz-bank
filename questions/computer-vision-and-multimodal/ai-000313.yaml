true_statement: COCO's primary detection score averages precision over ten IoU thresholds from 0.50 to 0.95, while PASCAL VOC counted a detection correct at a single 50% IoU threshold.
false_statement: COCO's primary detection score counts a detection correct at a single 50% IoU threshold, while PASCAL VOC averaged precision over ten IoU thresholds from 0.50 to 0.95.
explanation: Intersection over union (IoU) measures how well a predicted box overlaps the true one. VOC's 50% bar was deliberately lenient, so one number hid poor localization; COCO's averaging over stricter thresholds rewards boxes that fit tightly.
