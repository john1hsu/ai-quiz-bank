true_statement: BLIP-2's authors reported in 2023 that it beat Flamingo-80B by 8.7% on zero-shot VQAv2 while training 54 times fewer parameters, thanks to keeping its image encoder and LLM frozen.
false_statement: BLIP-2's authors reported in 2023 that it beat Flamingo-80B by 8.7% on zero-shot VQAv2 while training 5 times fewer parameters, thanks to keeping its image encoder and LLM frozen.
explanation: 'BLIP-2 trains only a lightweight Querying Transformer (Q-Former) between a frozen image encoder and a frozen LLM, so its trainable parameter count is tiny: 54 times fewer than Flamingo-80B, not merely 5. It shows that a small learned bridge between big frozen models can be both cheap and strong.'
