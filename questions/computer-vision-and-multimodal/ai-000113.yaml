true_statement: RNN-Transducer adds a predictor network conditioned on previously emitted tokens, relaxing CTC's assumption that each frame's output is independent.
false_statement: CTC adds a predictor network conditioned on previously emitted tokens, relaxing RNN-Transducer's assumption that each frame's output is independent.
explanation: Because CTC treats frames independently given the audio, it learns no implicit language model and often needs an external one. RNN-T lets past output shape the next prediction while still running left to right, so it remains suitable for streaming.
