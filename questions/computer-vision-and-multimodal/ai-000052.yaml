true_statement: At the theoretical optimum of the original GAN game, the generator reproduces the data distribution and the discriminator outputs 1/2 for every input.
false_statement: At the theoretical optimum of the original GAN game, the generator reproduces the data distribution and the discriminator outputs 1 for every input.
explanation: If generated and real samples are drawn from the same distribution, the discriminator has nothing to go on and can only guess, so its best estimate of 'real' is one half everywhere. Goodfellow et al. proved this unique solution assuming unlimited model capacity.
