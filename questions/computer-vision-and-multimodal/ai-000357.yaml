topic: 'Vision-language model: LLMs with visual input'
topic_type: Architecture
maturity: established
true_statement: A 2023 study of object hallucination found vision-language models most often invent objects that are frequent in visual-instruction data or that commonly co-occur with objects really in the image.
false_statement: A 2023 study of object hallucination found vision-language models most often invent objects that are rare in visual-instruction data or that seldom co-occur with objects really in the image.
explanation: 'Hallucinated objects follow the training statistics: the model fills in what usually appears or usually accompanies what it sees, not unusual objects. The same study proposed POPE, polling the model with yes/no questions about specific objects, because caption-based metrics were skewed by prompts and generation style.'
