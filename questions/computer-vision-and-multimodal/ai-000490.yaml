kind: evidence
topic: Vision transformer
topic_type: Architecture
maturity: established
true_statement: ViTDet showed a plain, single-scale ViT can be a strong detection backbone by building a simple feature pyramid from its output, without a hierarchical design.
false_statement: ViTDet showed a plain, single-scale ViT can be a strong detection backbone only after adding Swin-style patch-merging stages to make it hierarchical.
explanation: Detection needs multi-scale features, which is why hierarchical designs like Swin were assumed necessary. ViTDet built a simple pyramid from the plain ViT's single-scale output instead, decoupling pre-training from the task so one plain ViT can be pre-trained once and reused.
