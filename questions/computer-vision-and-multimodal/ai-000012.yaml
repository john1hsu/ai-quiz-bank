true_statement: The original DDPM needed one network evaluation per denoising step, 1,000 in all, making sampling far slower than a GAN's single forward pass.
false_statement: The original DDPM needed one network evaluation per denoising step, 10 in all, making sampling about as fast as a GAN's single forward pass.
explanation: Sampling walks the chain back step by step, so the original 1,000-step setup took about 17 seconds for 256 CIFAR-10 images on a TPU. Later schedulers and latent diffusion cut this, with tuned schedules reaching around 10 steps.
