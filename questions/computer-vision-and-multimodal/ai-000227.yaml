true_statement: YOLOv2 introduced anchor boxes whose shapes came from k-means clustering of the training set's bounding boxes.
false_statement: YOLOv2 introduced anchor boxes whose shapes were hand-picked to a fixed set of standard aspect ratios.
explanation: Clustering real box shapes gives priors that match the data, so the network starts from sensible guesses and learns offsets more easily. YOLOv2 also added batch normalisation and multi-scale training; later versions such as YOLOv8 moved to anchor-free heads.
