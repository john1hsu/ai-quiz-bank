kind: mechanism
topic: CLIP
topic_type: Model
maturity: established
true_statement: CLIP classifies an image zero-shot by writing each class name into a text prompt and picking the prompt whose embedding is most similar to the image's.
false_statement: CLIP classifies an image zero-shot by running it through a classifier head trained on ImageNet's labelled images and mapping the output to class names.
explanation: Contrastive training on 400 million web image-caption pairs puts images and text in one embedding space, so any list of labels written as text becomes a classifier. That is how CLIP matched a supervised ResNet-50 on ImageNet without its labelled training images.
