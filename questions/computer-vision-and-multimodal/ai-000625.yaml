true_statement: U-Net was introduced by Ronneberger, Fischer and Brox of the University of Freiburg at MICCAI 2015, designed for biomedical images where labelled data is scarce.
false_statement: U-Net was introduced by Ronneberger, Fischer and Brox of the University of Freiburg at MICCAI 2015, designed for street scenes where labelled data is plentiful.
explanation: Annotating cells and neurons pixel by pixel is slow expert work, so the design leaned on heavy elastic-deformation augmentation to learn from few images. It won the ISBI 2015 cell-tracking challenge in two categories by a large margin.
