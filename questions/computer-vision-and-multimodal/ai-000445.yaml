true_statement: Seymour Papert's 1966 MIT memo, The Summer Vision Project, planned to build a significant part of a visual system with summer workers in a single summer.
false_statement: Seymour Papert's 1966 MIT memo, The Summer Vision Project, planned to build a significant part of a visual system with summer workers over a ten-year programme.
explanation: The memo's one-summer plan, from figure-ground separation to naming objects, shows how early AI researchers underestimated perception. The problem in fact took decades, which is why the memo is the field's classic cautionary tale.
