true_statement: When Recht and colleagues rebuilt CIFAR-10 and ImageNet test sets in 2019, accuracy fell, and they blamed models' brittleness on slightly harder images rather than overfitting from test-set reuse.
false_statement: When Recht and colleagues rebuilt CIFAR-10 and ImageNet test sets in 2019, accuracy fell, and they blamed overfitting from test-set reuse rather than models' brittleness on slightly harder images.
explanation: 'The new test sets followed the original collection procedures, yet ImageNet accuracy dropped by about 11 to 14 points. The authors traced this to fragility on slightly harder images, not adaptive overfitting to a reused test set, and models that ranked higher before still tended to rank higher: a warning that leaderboard numbers overstate robustness.'
