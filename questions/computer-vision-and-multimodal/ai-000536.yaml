true_statement: 'Hugging Face Diffusers'' StableDiffusionPipeline exposes a latent diffusion model as separate parts: a KL autoencoder, a CLIP text encoder, a conditional U-Net and a swappable noise scheduler.'
false_statement: 'Hugging Face Diffusers'' StableDiffusionPipeline exposes a latent diffusion model as separate parts: a KL autoencoder, a CLIP text encoder, a conditional U-Net and a noise scheduler fixed at training time.'
explanation: 'The pipeline mirrors the architecture: the VAE maps images to and from latents, CLIP encodes the prompt, and the U-Net denoises. The scheduler, which sets how noise is removed step by step, is a replaceable component, so practitioners can change samplers without retraining.'
