id: ai-000225
area: computer-vision-and-multimodal
kind: definition
topic: YOLO
topic_type: Architecture
maturity: established
true_statement: YOLO is a single-stage detector that predicts every bounding box and class probability in one network pass, unlike two-stage R-CNN, which scores region proposals separately.
false_statement: YOLO is a two-stage detector that scores region proposals separately, unlike single-stage R-CNN, which predicts every bounding box and class probability in one network pass.
explanation: R-CNN classified about 2,000 proposals per image and took over 40 seconds at test time. YOLO recast detection as one regression from pixels to boxes, making it fast enough for video at some cost in localisation accuracy.
