true_statement: 'At each feature-map position, Faster R-CNN''s Region Proposal Network scores k = 9 anchor boxes: three scales times three aspect ratios (1:1, 1:2 and 2:1).'
false_statement: 'At each feature-map position, Faster R-CNN''s Region Proposal Network scores k = 6 anchor boxes: three scales times two aspect ratios (1:1 and 2:1).'
explanation: Anchors are reference boxes centred on each location; the RPN outputs an objectness score and four box offsets for every one. Using several scales and shapes at every position lets one small, translation-invariant network propose objects of very different sizes.
