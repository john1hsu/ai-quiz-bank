true_statement: For roughly 2023–2024 systems, word error rate was about 1.4% on LibriSpeech clean audiobooks but 25.5% on CHiME-6 dinner-party recordings.
false_statement: For roughly 2023–2024 systems, word error rate was about 1.4% on CHiME-6 dinner-party recordings but 25.5% on LibriSpeech clean audiobooks.
explanation: Read speech with a close microphone is nearly solved, while distant, overlapping conversation is not. The gap, along with higher error on African American English, is why headline WERs say little about real-world use.
