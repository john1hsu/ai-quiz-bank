true_statement: Faster R-CNN's key addition was a Region Proposal Network that shares the detector's convolutional features, replacing the slow selective-search proposals Fast R-CNN relied on.
false_statement: Faster R-CNN's key addition was RoI pooling, which pools each region's features from one shared map, replacing the slow per-region CNN passes Fast R-CNN relied on.
explanation: RoI pooling was Fast R-CNN's contribution; it already shared one CNN pass across regions. That left proposal generation on the CPU as the bottleneck, and Faster R-CNN's RPN made proposals almost free by reusing the same feature map.
