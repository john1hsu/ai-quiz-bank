topic: 'An Image Is Worth 16x16 Words: Transformers for Image Recognition at Scale'
topic_type: Work
maturity: foundational
true_statement: Trained on ImageNet alone, ViT trailed comparable ResNets, but pre-trained on ImageNet-21k or JFT-300M it matched or beat them, because it lacks a CNN's built-in locality bias.
false_statement: Trained on ImageNet alone, ViT beat comparable ResNets, but pre-trained on ImageNet-21k or JFT-300M it fell behind them, because it lacks a CNN's built-in locality bias.
explanation: Convolutions hard-wire locality and 2D structure; global self-attention must learn them from data. With little data that missing prior hurts, but at large scale learning the structure outweighs having it built in, which is the paper's central argument.
