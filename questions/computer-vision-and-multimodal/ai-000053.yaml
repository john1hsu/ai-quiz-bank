true_statement: The Wasserstein GAN replaced the original GAN objective with an earth-mover distance, reporting more stable training and losses that track sample quality.
false_statement: StyleGAN replaced the original GAN objective with an earth-mover distance, reporting more stable training and losses that track sample quality.
explanation: WGAN (Arjovsky, Chintala and Bottou, 2017) changed the training objective to tackle instability and mode collapse. StyleGAN (Karras et al., 2019) instead redesigned the generator architecture, borrowing ideas from style transfer.
