true_statement: The ImageNet challenge (ILSVRC) scored classifiers by top-5 error, allowing five guesses per image because photos often contain several objects while only one is labeled.
false_statement: The ImageNet challenge (ILSVRC) scored classifiers by top-5 error, allowing five guesses per image because each photo was labeled with five correct object categories.
explanation: Each ILSVRC image has a single ground-truth label, and a prediction counts as correct if any of the five guesses matches it. The slack exists because a scene may show several valid objects, so a top-1 miss is not always a real error; the metric only partly fixes that ambiguity.
