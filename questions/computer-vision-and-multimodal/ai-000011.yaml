true_statement: DDPM trains its network to predict the noise that was added to an image, using a simple mean-squared-error loss.
false_statement: DDPM trains its network to predict the noise that was added to an image, using an adversarial loss from a discriminator.
explanation: Pick a clean image, a random step and random noise, mix them, and regress the network's noise estimate onto the true noise. Ho et al. found this simple objective beat optimising the full variational bound; adversarial losses belong to GANs.
