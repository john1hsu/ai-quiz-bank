true_statement: 'Testing autoencoder downsampling factors from 1 to 32, the latent diffusion authors found 4 and 8 struck the right balance: a factor of 1 trained slowly and 32 lost too much detail.'
false_statement: 'Testing autoencoder downsampling factors from 1 to 32, the latent diffusion authors found 32 struck the right balance: a factor of 1 trained slowly and 4 or 8 lost too much detail.'
explanation: A factor of 1 is just pixel-space diffusion, which is slow and costly; very aggressive compression throws away detail the decoder cannot recover. Moderate compression lets the diffusion model spend its capacity on semantic structure while the frozen autoencoder handles perceptual detail.
