true_statement: Each U-Net decoder stage concatenates the encoder feature map of the same scale, whereas a residual connection adds its shortcut to the layer output.
false_statement: Each U-Net decoder stage adds the encoder feature map of the same scale, whereas a residual connection concatenates its shortcut to the layer output.
explanation: Concatenation hands the decoder the encoder's full high-resolution detail as extra channels, restoring fine edges lost to pooling. A residual shortcut sums into the existing channels and mainly eases gradient flow through depth.
