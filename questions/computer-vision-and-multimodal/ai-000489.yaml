true_statement: Swin Transformer computes self-attention only inside local windows, so its cost grows linearly with image size, and shifts the window grid between blocks so information crosses window borders.
false_statement: Swin Transformer computes self-attention only inside local windows, so its cost grows quadratically with image size, and shifts the window grid between blocks so information crosses window borders.
explanation: Global self-attention compares every patch with every other, so its cost is quadratic in the number of patches. Restricting attention to fixed-size windows (7×7 patches by default) makes cost linear, and shifting the windows between blocks restores communication across them, at the price of reintroducing a locality prior.
