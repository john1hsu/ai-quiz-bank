true_statement: Compared with Fast R-CNN, the original YOLO made more localization errors but far fewer background false positives, because it sees the whole image at once.
false_statement: Compared with Fast R-CNN, the original YOLO made fewer localization errors but far more background false positives, because it sees only small image regions at once.
explanation: Global context helps YOLO avoid mistaking background patches for objects, while its coarse grid and downsampled features make precise box placement harder. The complementary error profiles are why the two are easy to tell apart, and localisation was YOLO's main error source.
