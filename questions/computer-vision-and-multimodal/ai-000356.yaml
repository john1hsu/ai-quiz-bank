topic: 'Vision-language model: LLMs with visual input'
topic_type: Architecture
maturity: established
true_statement: Flamingo scales each new cross-attention layer's output by tanh(α) with α initialised to zero, so at the start of training the model behaves exactly like its frozen language model.
false_statement: Flamingo scales each new cross-attention layer's output by tanh(α) with α initialised to one, so at the start of training visual features already dominate its frozen language model.
explanation: Since tanh(0) is 0, the inserted layers start switched off and the pretrained LM's behaviour is preserved; the gate then opens gradually as α is learned. Starting the gate fully open would disrupt the frozen LM and make training unstable, which is what the zero init avoids.
