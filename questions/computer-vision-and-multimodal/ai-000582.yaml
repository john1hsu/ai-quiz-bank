true_statement: DeepLab used atrous convolution to widen the field of view without extra parameters, and a fully connected conditional random field to restore boundaries blurred by downsampling.
false_statement: DeepLab used a fully connected conditional random field to widen the field of view without extra parameters, and atrous convolution to restore boundaries blurred by downsampling.
explanation: Atrous (dilated) convolution spaces out kernel taps so each output sees more context at the same cost. The CRF then works on the predicted map, pulling label edges toward real image edges. Both tackle the trade-off between context and resolution.
