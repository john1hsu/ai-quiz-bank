true_statement: A linear classifier on CIFAR-10 flattens each 32×32×3 image into 3,072 numbers, so its weight matrix W is 10×3,072 and yields one score per class.
false_statement: A linear classifier on CIFAR-10 flattens each 32×32×3 image into 1,024 numbers, so its weight matrix W is 10×1,024 and yields one score per class.
explanation: Each colour image has 32 × 32 pixels times 3 channels, giving 3,072 inputs; 1,024 would count only one channel. Each of W's 10 rows acts as a template for one class, scored against the whole flattened image as f(x, W) = Wx + b.
