true_statement: Long, Shelhamer and Darrell's fully convolutional networks (CVPR 2015) turned classifiers such as AlexNet and VGG into networks that take any input size and output a matching label map.
false_statement: Ronneberger, Fischer and Brox's fully convolutional networks (CVPR 2015) turned classifiers such as AlexNet and VGG into networks that take any input size and output a matching label map.
explanation: Replacing fully connected heads with convolutions let pretrained classifiers be fine-tuned end to end, pixels to pixels, which launched deep semantic segmentation. Ronneberger, Fischer and Brox built U-Net the same year, for biomedical images.
