true_statement: In 2015, on a K40 GPU, Faster R-CNN with VGG-16 took about 198 ms per image, only about 10 ms of it spent on region proposals.
false_statement: In 2015, on a K40 GPU, Faster R-CNN with VGG-16 took about 198 ms per image, about 150 ms of it spent on region proposals.
explanation: Selective search had taken around 1.5 to 2 seconds per image, so moving proposals onto shared GPU features cut the whole pipeline from about 1,830 ms to 198 ms. Even so, roughly 5 frames per second is far from what 'real-time' usually means, because two stages still run per image.
