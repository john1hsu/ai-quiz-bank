true_statement: In 2014 Girshick, Donahue, Darrell and Malik's R-CNN ran a convolutional network on region proposals and raised PASCAL VOC 2012 mAP by over 30% relative to the prior best.
false_statement: In 2014 Ren, He, Girshick and Sun's R-CNN ran a convolutional network on region proposals and raised PASCAL VOC 2012 mAP by over 30% relative to the prior best.
explanation: R-CNN broke a plateau of hand-engineered feature pipelines and showed that an ImageNet-pretrained network fine-tuned on scarce detection data works well. Ren, He, Girshick and Sun wrote the later Faster R-CNN paper, which kept Girshick but changed the rest of the team.
