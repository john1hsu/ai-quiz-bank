true_statement: Panoptic segmentation gives every pixel a class label and an instance ID, using IDs for countable things like cars but ignoring them for amorphous stuff like sky.
false_statement: Panoptic segmentation gives every pixel a class label and an instance ID, using IDs for amorphous stuff like sky but ignoring them for countable things like cars.
explanation: Kirillov and colleagues proposed panoptic segmentation in 2019 to unify semantic and instance segmentation. It makes no sense to count separate patches of grass or sky, but separating each car or person matters for tasks like tracking.
