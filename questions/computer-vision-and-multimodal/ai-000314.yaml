id: ai-000314
area: computer-vision-and-multimodal
kind: mechanism
topic: Object detection
topic_type: Application
maturity: established
true_statement: DETR trains with a bipartite-matching loss that assigns each object exactly one prediction, which lets it drop non-maximum suppression and hand-built anchors.
false_statement: DETR trains with an anchor-matching loss that assigns each object several predictions, which means it still relies on non-maximum suppression and hand-built anchors.
explanation: Conventional detectors let many candidates fire on one object and prune the duplicates afterwards with non-maximum suppression. DETR instead treats detection as set prediction from a fixed set of learned object queries, so duplicates are penalised during training rather than removed after it.
