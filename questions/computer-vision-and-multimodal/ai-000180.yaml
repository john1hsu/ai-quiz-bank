topic: 'An Image Is Worth 16x16 Words: Transformers for Image Recognition at Scale'
topic_type: Work
maturity: foundational
true_statement: The Vision Transformer splits an image into fixed-size patches, linearly projects each flattened patch to an embedding and feeds the sequence to a standard Transformer encoder.
false_statement: The Vision Transformer splits an image into fixed-size patches, passes each through a deep ResNet backbone and feeds the resulting features to a standard Transformer decoder.
explanation: 'Each 16×16 patch plays the role of a word token: a learnable class token and position embeddings are added, and the class token''s final state represents the image. The pure ViT has no convolutional backbone; a CNN-fed hybrid was tested but its advantage vanished for larger models.'
