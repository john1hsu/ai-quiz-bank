true_statement: Semantic segmentation labels every pixel with a class but does not separate individual objects, while instance segmentation also outlines each object.
false_statement: Instance segmentation labels every pixel with a class but does not separate individual objects, while semantic segmentation also outlines each object.
explanation: In the ladder of vision tasks, semantic segmentation answers 'what class is this pixel', so two touching cars merge into one 'car' region. Instance segmentation goes a step further and gives each car its own outline, which is what you need when counting or tracking objects.
