true_statement: 'Computer vision runs computer graphics backwards: graphics predicts the image a scene will produce, while vision must infer the scene from the image.'
false_statement: 'Computer vision runs computer graphics forwards: vision predicts the image a scene will produce, while graphics must infer the scene from the image.'
explanation: Graphics and physics give forward models of how light reaches an image plane; vision has to invert that process. Because a 2D image does not pin down a unique 3D scene, the inverse problem is ill-posed, so vision systems lean on physical or probabilistic models or on regularities learned from large datasets.
