topic: 'An Image Is Worth 16x16 Words: Transformers for Image Recognition at Scale'
topic_type: Work
maturity: foundational
true_statement: The best Vision Transformer in the 2021 ICLR paper, ViT-H/14 pre-trained on JFT-300M, reached 88.55% top-1 accuracy on ImageNet.
false_statement: The best Vision Transformer in the 2021 ICLR paper, ViT-H/14 pre-trained on JFT-300M, reached 77.63% top-1 accuracy on ImageNet.
explanation: 77.63% was the same model's average on the 19-task VTAB transfer suite, not its ImageNet accuracy. The headline numbers came from huge-scale pre-training, and the authors also reported ViT using substantially less pre-training compute than the BiT-L convolutional baseline.
