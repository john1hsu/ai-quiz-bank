true_statement: In a latent diffusion model's cross-attention, queries come from the U-Net's image features, while keys and values come from the encoded conditioning input such as a caption.
false_statement: In a latent diffusion model's cross-attention, queries come from the encoded conditioning input such as a caption, while keys and values come from the U-Net's image features.
explanation: The image features are what is being updated, so they ask the questions (queries) and look up information in the caption embeddings (keys and values). Because the conditioning encoder is swappable, the same design handles text, class labels, layouts or semantic maps.
