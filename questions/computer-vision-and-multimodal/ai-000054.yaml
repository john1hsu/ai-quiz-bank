true_statement: In 2021 Dhariwal and Nichol reported diffusion models beating the best GANs on ImageNet, with an FID of 4.59 at 256×256 resolution.
false_statement: In 2021 Dhariwal and Nichol reported diffusion models beating the best GANs on ImageNet, with an FID of 7.72 at 256×256 resolution.
explanation: Their FIDs were 2.97 at 128×128, 4.59 at 256×256 and 7.72 at 512×512; lower FID is better, and it rises with resolution. The paper is the usual marker of GANs losing their lead in image quality, helped by classifier guidance.
