true_statement: nnU-Net kept a nearly standard U-Net, automated preprocessing, training and postprocessing for each dataset, and topped the Medical Segmentation Decathlon's phase-1 leaderboard.
false_statement: nnU-Net heavily redesigned the U-Net architecture, kept preprocessing, training and postprocessing fixed across datasets, and topped the Medical Segmentation Decathlon's phase-1 leaderboard.
explanation: Its authors argued that pipeline choices matter more than architectural tweaks, a recurring finding among U-Net variants. For practitioners the lesson is to tune preprocessing and training before inventing a new network.
