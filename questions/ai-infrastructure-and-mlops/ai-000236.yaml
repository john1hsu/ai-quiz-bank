true_statement: CUDA's large developer base and software ecosystem give NVIDIA hardware a lock-in effect that rival accelerators such as Google's TPUs must overcome.
false_statement: The TPU's large developer base and software ecosystem give Google hardware a lock-in effect that rival accelerators such as NVIDIA's GPUs must overcome.
explanation: Most deep-learning code and libraries are built on CUDA, which NVIDIA introduced to open its GPUs to general-purpose programming. Switching accelerators means porting that software, so the platform, not just the chip, is NVIDIA's advantage.
