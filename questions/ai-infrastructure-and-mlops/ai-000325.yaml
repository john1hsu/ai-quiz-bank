true_statement: Before compute APIs such as CUDA arrived, GPGPU programmers stored arrays as textures and wrote their kernels as fragment shaders.
false_statement: Before compute APIs such as CUDA arrived, GPGPU programmers stored arrays in shared memory and wrote their kernels as thread blocks.
explanation: Early general-purpose GPU work had to disguise computation as graphics, which imposed 2D layouts and made scattered writes awkward. Shared memory, pointers and thread blocks only came with the compute interfaces AMD and NVIDIA shipped in 2006–2007.
