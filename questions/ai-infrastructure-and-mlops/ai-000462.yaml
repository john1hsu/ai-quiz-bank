true_statement: PyTorch rebuilds its autograd graph from scratch on every iteration, so ordinary Python if statements and loops can change the graph's shape from one step to the next.
false_statement: PyTorch builds its autograd graph once before training starts, so ordinary Python if statements and loops are frozen into one graph shape for every step.
explanation: This define-by-run design means the code that runs is the code that gets differentiated, which makes debugging and data-dependent control flow easy. Declaring a fixed graph ahead of execution is how earlier static-graph frameworks worked.
