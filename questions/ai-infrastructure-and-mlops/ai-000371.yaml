true_statement: Clipper's adaptive batching used an additive-increase, multiplicative-decrease rule to find the largest batch size that still met its latency objective.
false_statement: Clipper's adaptive batching used a multiplicative-increase, additive-decrease rule to find the largest batch size that still met its latency objective.
explanation: Growing the batch slowly and cutting it sharply when a latency target such as 20 ms is missed lets the server probe for throughput without long latency violations. The false version reverses the rule, which would overshoot the target quickly and recover slowly.
