true_statement: A 2017 survey by Sze and colleagues reported that an 8-bit fixed-point multiply uses about 18.5 times less energy than a 32-bit floating-point multiply.
false_statement: A 2017 survey by Sze and colleagues reported that an 8-bit fixed-point multiply uses about 1.85 times less energy than a 32-bit floating-point multiply.
explanation: Narrow integer arithmetic is far cheaper in silicon than full floating point, which is why accelerators push for low precision and why quantization matters. Inference tolerates the lost precision better than training, so int8 is a common peak-throughput format.
