true_statement: In 2017 Google's TensorFlow-Serving authors estimated that the serving library alone could handle about 100,000 requests per second per CPU core.
false_statement: In 2017 Google's TensorFlow-Serving authors estimated that the serving library alone could handle about 10,000 requests per second per CPU core.
explanation: The estimate covers only the serving framework's own overhead, not model computation, and shows the plumbing is rarely the bottleneck. The false figure is ten times too low; Google's total traffic then ran to tens of millions of inferences per second.
