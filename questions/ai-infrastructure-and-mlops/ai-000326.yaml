true_statement: GPUs hide memory latency by switching among many resident warps, so a kernel launch needs far more threads than the GPU has cores.
false_statement: GPUs hide memory latency with large per-thread caches, so a kernel launch needs about as many threads as the GPU has cores.
explanation: 'GPUs trade latency for throughput: while some warps wait on memory, others compute. NVIDIA suggests roughly four times as many thread blocks as streaming multiprocessors; too few threads leave units idle, as in the tail effect of a last partial wave.'
