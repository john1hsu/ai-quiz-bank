true_statement: TensorFlow, described by Google Brain at OSDI 2016, represents both computation and mutable state as dataflow graphs and maps them across CPUs, GPUs and custom accelerators.
false_statement: TensorFlow, described by Google Brain at OSDI 2016, represents computation as dataflow graphs but keeps mutable state on separate parameter servers outside the graph.
explanation: Putting state inside the dataflow graph was TensorFlow's break from earlier parameter-server systems, and its authors argued this gave developers more freedom to try new training algorithms. The false version describes the older design it was contrasted with.
