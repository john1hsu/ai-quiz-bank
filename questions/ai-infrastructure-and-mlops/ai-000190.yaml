true_statement: PyTorch's DistributedDataParallel groups gradients into buckets and starts an all-reduce for each bucket as soon as it is ready, overlapping communication with the backward pass.
false_statement: PyTorch's DistributedDataParallel waits for the whole backward pass to finish and then runs a single all-reduce over all gradients, so communication never overlaps computation.
explanation: Gradients for the last layers are ready first, so their buckets can be summed across GPUs while earlier layers are still computing. Hiding communication behind computation is what lets DDP scale near-linearly, and it beats the older single-process DataParallel wrapper.
