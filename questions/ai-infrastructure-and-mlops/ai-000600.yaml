true_statement: Micikevicius and colleagues' mixed-precision recipe keeps an FP32 master copy of the weights and scales up the loss so that small gradients survive in half precision.
false_statement: Micikevicius and colleagues' mixed-precision recipe keeps an FP32 master copy of the weights and scales up the learning rate so that small gradients survive in half precision.
explanation: Tiny gradient values underflow to zero in FP16. Multiplying the loss scales every gradient up by the same factor through backpropagation, and it is divided back out before the FP32 weight update, roughly halving memory use without hurting accuracy.
