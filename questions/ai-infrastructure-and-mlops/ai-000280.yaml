topic: High-bandwidth memory
topic_type: Hardware
maturity: established
true_statement: High-bandwidth memory (HBM) gets its bandwidth from a very wide interface of short in-package wires running at modest per-pin speeds.
false_statement: High-bandwidth memory (HBM) gets its bandwidth from a narrow interface of short in-package wires running at very high per-pin speeds.
explanation: HBM stacks DRAM dies joined by through-silicon vias and sits beside the processor on an interposer, exposing 1,024 bits per stack in early generations. Width, not per-pin speed, is the trick; the narrow, fast bus describes conventional board-mounted memory such as GDDR.
