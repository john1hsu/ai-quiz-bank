true_statement: Narayanan and colleagues advise tensor parallelism within a server, pipeline parallelism across servers, and data parallelism to replicate the result and scale out.
false_statement: Narayanan and colleagues advise pipeline parallelism within a server, tensor parallelism across servers, and data parallelism to replicate the result and scale out.
explanation: Tensor parallelism issues frequent all-reduces that need fast links inside a server, while pipeline parallelism only sends point-to-point activations between stages, which slower inter-server networks can carry. Swapping them, as the false statement does, puts the chattiest traffic on the slowest links.
