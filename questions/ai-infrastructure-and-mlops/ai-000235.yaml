true_statement: The Transformer Engine in NVIDIA's H100 switches network layers between FP8 and 16-bit precision to speed up transformer training and inference.
false_statement: The Transformer Engine in NVIDIA's H100 switches network layers between 16-bit and 64-bit precision to speed up transformer training and inference.
explanation: Lower precision means more arithmetic per second and less memory traffic, and FP8 is enough for many layers if precision is managed carefully. Going up to 64-bit would slow things down; it matters for scientific computing, not neural-network throughput.
