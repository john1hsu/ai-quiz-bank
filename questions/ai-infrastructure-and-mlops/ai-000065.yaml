true_statement: CUDA executes threads in warps of 32, so when threads in one warp take different branches the inactive ones are masked and utilisation drops.
false_statement: CUDA executes threads in warps of 64, so when threads in one warp take different branches the inactive ones are masked and utilisation drops.
explanation: Under SIMT all threads in a warp share one instruction stream, so divergent branches run one after another with some lanes idle. That is also why block sizes are recommended in multiples of 32.
