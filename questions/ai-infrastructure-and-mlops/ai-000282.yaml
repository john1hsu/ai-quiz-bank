true_statement: A 2024 'memory wall' analysis estimated that peak server FLOPS grew about 3.0x every two years over two decades, while DRAM bandwidth grew only about 1.6x.
false_statement: A 2024 'memory wall' analysis estimated that DRAM bandwidth grew about 3.0x every two years over two decades, while peak server FLOPS grew only about 1.6x.
explanation: Gholami and colleagues found compute outpacing memory bandwidth, which is why many AI workloads, especially LLM decoding, are limited by bytes moved rather than arithmetic. HBM narrows that gap but has not closed it.
