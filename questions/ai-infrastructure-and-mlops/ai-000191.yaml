true_statement: In 2017 Goyal et al. at Facebook trained ResNet-50 on ImageNet in about an hour on 256 GPUs, using 8,192-image minibatches with a linear learning-rate scaling rule and warmup.
false_statement: In 2017 Goyal et al. at Facebook trained ResNet-50 on ImageNet in about an hour on 256 GPUs, using 8,192-image minibatches with a fixed learning rate and no warmup.
explanation: A larger global batch gives fewer, less noisy steps, so the learning rate is raised in proportion to batch size to keep progress per epoch, while a warmup phase avoids instability early on. With both, the huge-batch run matched small-batch accuracy.
