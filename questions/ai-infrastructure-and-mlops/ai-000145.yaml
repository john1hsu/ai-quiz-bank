true_statement: Google reported in 2017 that convolutional networks were only about 5% of the datacenter inference workload its first TPU was designed for.
false_statement: Google reported in 2017 that convolutional networks were about 95% of the datacenter inference workload its first TPU was designed for.
explanation: Multilayer perceptrons and LSTMs dominated the six production applications measured, which together were about 95% of demand. It is a reminder that the chip was driven by text and ranking models, not mainly image models.
