false_statement: Hugging Face reported in 2025 that Transformers supported over 4,000 model architectures, up from about 40 five years earlier.
explanation: The tenfold growth came alongside compatible Hub checkpoints rising from about 1,000 to over 750,000. Architectures are model designs, so even a few hundred covers most of open-source AI; checkpoints are the trained weights built on them.
