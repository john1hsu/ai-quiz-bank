true_statement: Georgetown CSET's 2020 report described GPUs as used mainly for AI training and FPGAs mainly for inference, with AI-specific ASICs used for either.
false_statement: Georgetown CSET's 2020 report described FPGAs as used mainly for AI training and GPUs mainly for inference, with AI-specific ASICs used for either.
explanation: GPUs offer mature software and raw parallel throughput, which suits training. FPGAs are reconfigurable but slower and harder to program, so they found a niche in inference, while ASICs like the TPU can be built for either job at the highest efficiency.
