true_statement: The TF32 format keeps FP32's 8-bit exponent but cuts the mantissa to 10 bits, which let NVIDIA run unmodified FP32 training code on A100 Tensor Cores.
false_statement: The TF32 format keeps FP32's 23-bit mantissa but cuts the exponent to 5 bits, which let NVIDIA run unmodified FP32 training code on A100 Tensor Cores.
explanation: Keeping the exponent preserves FP32's dynamic range, so values rarely overflow or underflow, while the shorter mantissa makes the multiply far cheaper. That is why NVIDIA could make TF32 the default for AI training without code changes.
