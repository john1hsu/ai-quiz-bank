true_statement: In 2017 Google reported its first TPU ran production neural-network inference roughly 15–30 times faster than contemporary CPUs and GPUs, with 30–80 times better performance per watt.
false_statement: In 2017 Google reported its first TPU ran production neural-network inference roughly 30–80 times faster than contemporary CPUs and GPUs, with 15–30 times better performance per watt.
explanation: Jouppi and colleagues compared the TPU with Intel Haswell CPUs and NVIDIA K80 GPUs on MLP, CNN and LSTM workloads. The energy-efficiency gain was even larger than the raw speed gain, showing what a custom inference chip could buy over general-purpose hardware; the false version swaps the two ranges.
