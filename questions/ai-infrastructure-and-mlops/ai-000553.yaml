true_statement: Neural-network accelerators are judged largely by their dataflow, because fetching a value from DRAM can cost orders of magnitude more energy than the arithmetic it feeds.
false_statement: Neural-network accelerators are judged largely by their dataflow, because the arithmetic on a value can cost orders of magnitude more energy than fetching it from DRAM.
explanation: Data movement, not multiplication, dominates an accelerator's energy budget. Dataflows such as weight-stationary or row-stationary decide which values stay in each processing element's local buffer, so fewer trips are made to expensive off-chip memory.
