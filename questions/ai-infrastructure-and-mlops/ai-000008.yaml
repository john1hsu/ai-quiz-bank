true_statement: In Google's MLOps maturity levels, Level 1 automates the training pipeline, and Level 2 also automates building and deploying new pipeline components.
false_statement: In Google's MLOps maturity levels, Level 1 automates building and deploying new pipeline components, and Level 2 also automates the training pipeline.
explanation: Level 0 is manual notebooks and hand-offs. Level 1 retrains automatically on triggers like new data or drift; Level 2 adds CI/CD for the pipeline itself, backed by a registry, feature store, metadata store and orchestrator.
