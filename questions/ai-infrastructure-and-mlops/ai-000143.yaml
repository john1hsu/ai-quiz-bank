true_statement: Google's first Tensor Processing Unit, running in its datacenters from 2015, was built for inference only; later generations added training.
false_statement: Google's first Tensor Processing Unit, running in its datacenters from 2015, was built for training only; later generations added inference.
explanation: Serving user-facing models had strict latency limits, so the first chip was simple, deterministic and used 8-bit arithmetic. From TPU v2 onward chips were linked into pods for training as well as serving.
