true_statement: In NVIDIA's performance guide, a linear layer at batch size 512 is math-limited, while ReLU and layer normalization are memory-limited.
false_statement: In NVIDIA's performance guide, a linear layer at batch size 512 is memory-limited, while ReLU and layer normalization are math-limited.
explanation: What matters is arithmetic intensity, operations per byte moved. A large-batch matrix multiply reaches about 315 FLOPS per byte, above the GPU's ratio, while elementwise ReLU does about 0.25, so it just waits on memory; that is why peak FLOPS are rarely reached.
