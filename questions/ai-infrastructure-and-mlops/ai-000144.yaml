true_statement: In a TPU's systolic array operands pass from neighbour to neighbour each cycle, so each value fetched from memory is reused across many multiplications.
false_statement: In a TPU's systolic array every unit reads its operands straight from memory each cycle, so each value fetched from memory feeds just one multiplication.
explanation: Memory traffic, not arithmetic, is what costs time and energy in matrix multiplication. Streaming data through a grid of multiply-accumulate units cuts reads and writes, which is the core bet behind the TPU design.
