true_statement: Because CUDA launches are asynchronous, an error often surfaces at a later call unless CUDA_LAUNCH_BLOCKING=1 forces each launch to block.
false_statement: Because CUDA launches are synchronous, an error always surfaces at the failing call unless CUDA_LAUNCH_BLOCKING=1 lets launches run ahead.
explanation: Frameworks like PyTorch queue GPU work so the CPU need not wait, which is fast but means failures and timings show up out of place. Forcing blocking launches, or synchronising before timing, ties them back to the right line.
