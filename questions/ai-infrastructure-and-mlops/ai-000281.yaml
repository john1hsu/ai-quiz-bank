true_statement: High-bandwidth memory first reached the market in 2015, in AMD's Fiji graphics processors built with memory partner SK hynix.
false_statement: High-bandwidth memory first reached the market in 2018, in AMD's Fiji graphics processors built with memory partner SK hynix.
explanation: AMD's Radeon R9 Fury family launched HBM in 2015, replacing GDDR5 and claiming about four times the bandwidth per watt. 2018 is when JEDEC's JESD235B update raised per-pin rates, a revision of an already shipping standard.
