topic: 'Model serving: deploying trained models behind inference APIs'
topic_type: Concept
maturity: established
true_statement: In TensorFlow-Serving, an availability-preserving policy loads a new model version before unloading the old one, while a resource-preserving policy unloads the old one first.
false_statement: In TensorFlow-Serving, a resource-preserving policy loads a new model version before unloading the old one, while an availability-preserving policy unloads the old one first.
explanation: Keeping the old version up until the new one is ready means the model never goes offline, but briefly needs memory for two copies. When two copies will not fit, the resource-preserving policy accepts a short gap instead; the false statement swaps the two policies.
