true_statement: GPipe's authors found the idle pipeline bubble negligible once the number of micro-batches was at least four times the number of pipeline stages.
false_statement: GPipe's authors found the idle pipeline bubble negligible once the number of pipeline stages was at least four times the number of micro-batches.
explanation: The bubble's share of time is about (K−1)/(M+K−1) for K stages and M micro-batches, so it shrinks as micro-batches outnumber stages. Adding stages relative to micro-batches makes the bubble worse, which is why the false statement has the ratio backwards.
