true_statement: In torch.compile, TorchDynamo captures runs of PyTorch operations from Python bytecode into an FX graph, and TorchInductor compiles that graph into Triton kernels for GPUs.
false_statement: In torch.compile, TorchInductor captures runs of PyTorch operations from Python bytecode into an FX graph, and TorchDynamo compiles that graph into Triton kernels for GPUs.
explanation: Dynamo is the front end, a just-in-time compiler that rewrites bytecode so PyTorch can recover a graph without giving up Python's flexibility. Inductor is the default back end that turns the graph into Triton GPU kernels or C++ for CPUs; the false version swaps their roles.
