true_statement: In 2009 Raina, Madhavan and Ng reported training deep belief networks on an NVIDIA GeForce GTX 280 up to about 70 times faster than on a dual-core CPU.
false_statement: In 2009 Raina, Madhavan and Ng reported training deep belief networks on an NVIDIA GeForce GTX 280 only about 2 times faster than on a dual-core CPU.
explanation: The speedup cut training of a roughly 100-million-parameter network from weeks to about a day. Results like this showed graphics hardware's parallel arithmetic suited neural networks, and the authors argued it made much larger models practical.
