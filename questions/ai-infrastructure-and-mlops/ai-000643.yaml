id: ai-000643
area: ai-infrastructure-and-mlops
kind: mechanism
topic: Pipeline parallelism
topic_type: Technique
maturity: established
true_statement: Asynchronous PipeDream never flushes its pipeline, so it stashes the weight version each micro-batch used in its forward pass and reuses it for that micro-batch's backward pass.
false_statement: Asynchronous PipeDream never flushes its pipeline, so it discards the weight version each micro-batch used in its forward pass and applies whatever weights are current at that micro-batch's backward pass.
explanation: Without a flush, weights change while a micro-batch is still in flight, and mixing old activations with new weights gives an invalid gradient. Weight stashing keeps staleness bounded; Megatron-LM chose synchronous flushes instead to keep exact optimizer semantics.
