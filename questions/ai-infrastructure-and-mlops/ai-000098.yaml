true_statement: Transformers version 5, announced by Hugging Face in December 2025, made PyTorch its sole backend and sunset TensorFlow and Flax support.
false_statement: Transformers version 5, announced by Hugging Face in December 2025, made TensorFlow its sole backend and sunset PyTorch and Flax support.
explanation: The 2020 library let models move between PyTorch and TensorFlow, but v5 consolidated on PyTorch to keep one canonical model definition. It is a breaking change for older TensorFlow code that depended on the library.
