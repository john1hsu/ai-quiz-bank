true_statement: Hugging Face Transformers splits each model into a tokenizer, a transformer body and a task-specific head, so one pretrained body can take a new head for fine-tuning.
false_statement: Hugging Face Transformers splits each model into a tokenizer, a transformer body and a task-specific head, so one pretrained head can take a new body for fine-tuning.
explanation: The body holds the expensive pretrained knowledge as contextual embeddings; the head is a thin output layer for classification, question answering or generation. Swapping heads is what makes adapting a checkpoint to a new task cheap.
