true_statement: A 2015 NeurIPS paper by D. Sculley and colleagues at Google argued that ML systems are fast to build but costly to maintain.
false_statement: A 2015 NeurIPS paper by D. Sculley and colleagues at Google argued that ML systems are costly to build but cheap to maintain.
explanation: Hidden Technical Debt in Machine Learning Systems showed the model code is a small box inside much larger data, serving and monitoring infrastructure, and that ML adds its own debt, such as entanglement and feedback loops. It is usually cited as MLOps' founding motivation.
