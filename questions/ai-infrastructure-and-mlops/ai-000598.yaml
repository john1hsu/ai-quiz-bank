true_statement: NVIDIA introduced Tensor Cores with its Volta architecture in 2017, each unit computing a fused multiply-add D = A×B + C on 4×4 matrices.
false_statement: NVIDIA introduced Tensor Cores with its Ampere architecture in 2020, each unit computing a fused multiply-add D = A×B + C on 4×4 matrices.
explanation: Volta's GV100 put eight Tensor Cores in each streaming multiprocessor, and larger matrix products are built from many of these small steps. Ampere in 2020 brought the third generation, adding formats such as TF32 and BF16.
