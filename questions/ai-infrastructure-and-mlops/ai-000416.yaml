maturity: established
true_statement: Megatron-LM splits a transformer MLP block's first weight matrix by columns and its second by rows, so the nonlinearity runs locally and the forward pass needs one all-reduce.
false_statement: Megatron-LM splits a transformer MLP block's first weight matrix by rows and its second by columns, so the nonlinearity runs locally and the forward pass needs one all-reduce.
explanation: A column split gives each GPU complete slices of the hidden activations, so it can apply the nonlinearity without talking to the others; the row-split second matrix then produces partial sums that one all-reduce combines. Splitting the other way round would need a synchronisation before the nonlinearity.
