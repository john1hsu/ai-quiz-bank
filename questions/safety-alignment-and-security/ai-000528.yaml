true_statement: Concrete Problems in AI Safety (2016) was written by researchers from Google Brain, OpenAI, Stanford and UC Berkeley, and Google and OpenAI announced it jointly.
false_statement: Concrete Problems in AI Safety (2016) was written by researchers from DeepMind, OpenAI, Stanford and UC Berkeley, and DeepMind and OpenAI announced it jointly.
explanation: Its authors included Dario Amodei, Chris Olah and Dan Mané at Google Brain and John Schulman at OpenAI, and the two labs presented it as a cross-institution effort. DeepMind's link is the later AI Safety Gridworlds (2017), which turned several of its problems into test environments.
