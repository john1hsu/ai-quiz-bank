true_statement: Semantic entropy samples several answers to a question, groups them by meaning and measures entropy over those groups, so high entropy flags a likely confabulation.
false_statement: Semantic entropy samples several answers to a question, groups them by exact wording and measures entropy over those groups, so high entropy flags a likely confabulation.
explanation: Grouping by meaning, using an entailment model or an LLM, stops differently worded but equivalent answers from looking like disagreement. The method costs roughly ten queries and cannot catch errors a model makes consistently, such as a fact it learned wrongly.
