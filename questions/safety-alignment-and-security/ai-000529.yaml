topic: Concrete Problems in AI Safety
topic_type: Work
maturity: historical
true_statement: Concrete Problems in AI Safety defines an accident as unintended, harmful behaviour that emerges from a machine-learning system, treating deliberate misuse only as an adjacent topic.
false_statement: Concrete Problems in AI Safety defines an accident as harmful behaviour caused by people deliberately misusing a machine-learning system, treating unintended failures only as an adjacent topic.
explanation: The paper's focus is systems that go wrong on their own, usually through a badly specified objective or a faulty learning process. Misuse, privacy, fairness and security are listed as neighbouring concerns, which is also one of the agenda's acknowledged limits.
