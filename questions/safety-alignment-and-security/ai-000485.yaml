true_statement: In Biggio and Roli's threat model, an attacker's capability is causative if they can influence the training data and exploratory if they can only shape test-time inputs.
false_statement: In Biggio and Roli's threat model, an attacker's capability is exploratory if they can influence the training data and causative if they can only shape test-time inputs.
explanation: A causative attacker changes what the model learns, as in data poisoning, while an exploratory attacker works with a trained model, as in evasion. Naming the capability up front tells defenders which attack surfaces they must protect.
