true_statement: Economist Charles Goodhart first proposed his law in 1975, writing about the targets used in monetary policy.
false_statement: Economist Charles Goodhart first proposed his law in 1975, writing about performance audits in British universities.
explanation: Goodhart's point concerned monetary statistics that broke down once policymakers tried to steer by them. The university-audit setting belongs to anthropologist Marilyn Strathern, whose 1997 critique is the usual source of the catchy 'measure becomes a target' wording.
