true_statement: The 2025 International AI Safety Report found broad agreement that current systems cannot cause loss of control, but real disagreement on its likelihood over the next several years.
false_statement: The 2025 International AI Safety Report found broad agreement that loss of control is likely over the next several years, but real disagreement on whether current systems could cause it.
explanation: 'The experts converged on today''s systems lacking the capability, and split on how fast that could change. This uncertainty feeds the report''s evidence dilemma: acting early on thin evidence may prove unnecessary, while waiting may leave society unprepared.'
