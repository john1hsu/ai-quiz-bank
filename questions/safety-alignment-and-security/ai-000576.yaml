true_statement: A process reward model scores each intermediate step of a model's reasoning, while an outcome reward model scores only the final answer.
false_statement: An outcome reward model scores each intermediate step of a model's reasoning, while a process reward model scores only the final answer.
explanation: Step-level scores say where a solution went wrong, not just whether it did. Lightman and colleagues found process supervision clearly beat outcome supervision on the MATH benchmark, and such models can also rerank sampled solutions at inference time.
