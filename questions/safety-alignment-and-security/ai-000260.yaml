topic: Goodhart's law
topic_type: Concept
maturity: foundational
true_statement: In Manheim and Garrabrant's taxonomy, regressional Goodhart arises because selecting for a high proxy score also selects for noise, so top scorers fall short on the true goal.
false_statement: In Manheim and Garrabrant's taxonomy, extremal Goodhart arises because selecting for a high proxy score also selects for noise, so top scorers fall short on the true goal.
explanation: 'Any proxy is the true goal plus error, and the highest proxy scores are partly lucky error, so the winners are predictably worse than they look. Extremal Goodhart is a different failure: optimisation pushes into regions where the usual proxy-goal relationship stops holding at all.'
