true_statement: Leike et al.'s reward modeling learns a reward function from user interaction and then optimises it with reinforcement learning, so the objective is inferred rather than hand-written.
false_statement: Leike et al.'s reward modeling has users hand-write a reward function that is then optimised with reinforcement learning, so the objective is explicit rather than inferred.
explanation: Users often understand their goals only implicitly and struggle to write them down, which is the root of specification gaming. Learning the reward from feedback is the idea behind RLHF, though it gets harder for tasks humans cannot easily judge.
