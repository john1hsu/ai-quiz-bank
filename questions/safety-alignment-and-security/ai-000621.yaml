true_statement: 'Ilyas and colleagues argued adversarial perturbations flip non-robust features: patterns that truly predict the label in the data but look meaningless to humans.'
false_statement: 'Ilyas and colleagues argued adversarial perturbations flip spurious features: patterns that carry no information about the label in the data and arise only from training defects.'
explanation: On this view models are not malfunctioning; they use every predictive pattern available, including brittle ones people ignore. That also explains transfer, since independently trained models pick up the same non-robust features from the same data.
