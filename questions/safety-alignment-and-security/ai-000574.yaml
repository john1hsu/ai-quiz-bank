true_statement: InstructGPT used a 6-billion-parameter reward model rather than a 175-billion one, because the larger one trained less stably and suited PPO's value function less well.
false_statement: InstructGPT used a 175-billion-parameter reward model rather than a 6-billion one, because the smaller one trained less stably and suited PPO's value function less well.
explanation: In InstructGPT the PPO value function was initialised from the reward model, so the reward model's size and stability mattered twice. A bigger scorer is not automatically a better training signal.
