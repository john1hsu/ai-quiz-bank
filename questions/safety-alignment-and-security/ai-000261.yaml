topic: Goodhart's law
topic_type: Concept
maturity: foundational
true_statement: Karwowski et al.'s early-stopping rule provably avoids Goodharting given a bound on the proxy-true reward angle, but in experiments it gave up about 10% to 44% of attainable true reward.
false_statement: Karwowski et al.'s early-stopping rule provably avoids Goodharting given a bound on the proxy-true reward angle, and in experiments it gave up almost none of the attainable true reward.
explanation: 'Stopping early protects against the point where the true reward starts to fall, but it also stops before much of the genuine gain is reached. It shows the general trade: no fix removes Goodhart''s law, mitigations buy robustness with performance, and this one also needs the angle bound estimated well.'
