true_statement: Irving and colleagues argued that debate with optimal play could let polynomial-time judges answer any PSPACE question, whereas direct judging reaches only NP.
false_statement: Irving and colleagues argued that debate with optimal play could let polynomial-time judges answer any NP question, whereas direct judging reaches all of PSPACE.
explanation: By analogy with complexity theory, two adversarial agents can expose each other's flaws, letting a weak judge evaluate far more than it could check alone. That is the core hope of debate as a scalable-oversight method, though its practical value remains an empirical question.
