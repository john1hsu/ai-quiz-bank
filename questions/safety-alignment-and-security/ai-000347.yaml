id: ai-000347
area: safety-alignment-and-security
kind: definition
topic: Hallucination
topic_type: Risk
maturity: established
true_statement: An intrinsic hallucination contradicts the source text, while an extrinsic hallucination can be neither supported nor refuted by the source.
false_statement: An extrinsic hallucination contradicts the source text, while an intrinsic hallucination can be neither supported nor refuted by the source.
explanation: In Ji et al.'s taxonomy, a summary giving the wrong year for a dated event is intrinsic because the source shows it is wrong. An extrinsic addition might even be true, but nothing in the input lets you check it.
