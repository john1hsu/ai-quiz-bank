true_statement: 'Hendrycks and colleagues'' 2021 paper Unsolved Problems in ML Safety split the field into four problems: robustness, monitoring, alignment and systemic safety.'
false_statement: 'Amodei and colleagues'' 2016 paper Concrete Problems in AI Safety split the field into four problems: robustness, monitoring, alignment and systemic safety.'
explanation: 'The 2021 roadmap framed safety around hazards: withstanding them, detecting them, reducing those inside the model and reducing those in the wider system. The 2016 Concrete Problems paper instead framed the field as preventing accidents and listed five problems such as reward hacking and safe exploration.'
