true_statement: 'AI safety is broader than AI alignment: alignment asks whether a system pursues what its designers intend, while safety also covers misuse and failures on unusual inputs.'
false_statement: 'AI alignment is broader than AI safety: safety asks whether a system pursues what its designers intend, while alignment also covers misuse and failures on unusual inputs.'
explanation: A perfectly aligned system can still be misused by its operator, break on out-of-distribution inputs or cause harm once deployed widely, and those problems belong to safety. That is why alignment is treated as one part of AI safety, not the other way round.
