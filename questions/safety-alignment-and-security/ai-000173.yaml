true_statement: Burns and colleagues found that strong models fine-tuned on a much weaker supervisor's labels beat that supervisor but fell well short of their own capability ceiling.
false_statement: Burns and colleagues found that strong models fine-tuned on a much weaker supervisor's labels fell below that supervisor but nearly reached their own capability ceiling.
explanation: 'This weak-to-strong generalisation is an analogy for humans supervising superhuman models: the strong model generalises beyond its weak teacher''s mistakes, but not all the way. The gap suggests naive RLHF may scale poorly once models outgrow their evaluators.'
