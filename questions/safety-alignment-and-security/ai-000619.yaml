topic: Adversarial example
topic_type: Concept
maturity: established
true_statement: Szegedy and colleagues' 2013 paper 'Intriguing properties of neural networks' brought adversarial examples into deep learning and showed they often transfer between different networks.
false_statement: Szegedy and colleagues' 2013 paper 'Intriguing properties of neural networks' brought adversarial examples into deep learning and showed they rarely transfer between different networks.
explanation: Perturbations crafted against one model fooled others with different layer counts and even ones trained on a disjoint half of MNIST. Transfer matters for security because an attacker need not have the target model to fool it.
