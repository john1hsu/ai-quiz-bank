true_statement: In Zoom In (Distill, 2020), Olah and colleagues claimed similar features and circuits recur across different models, a property they called universality.
false_statement: In Zoom In (Distill, 2020), Olah and colleagues claimed similar features and circuits recur across layers of a single model, a property they called universality.
explanation: Universality was the third of the circuits programme's working claims, after meaningful features and interpretable circuits. If it holds, understanding a mechanism in one network teaches you about others, which makes reverse-engineering worth the effort.
