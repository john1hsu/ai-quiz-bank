true_statement: Carlini and Wagner showed defensive distillation did not meaningfully improve robustness, since their stronger attacks succeeded on distilled networks as often as on undistilled ones.
false_statement: Carlini and Wagner showed defensive distillation meaningfully improved robustness, since their stronger attacks succeeded far less often on distilled networks than on undistilled ones.
explanation: Distillation had looked effective only because it defeated the weak attacks it was tested against. The lasting lesson for evaluation is that a defence must be checked against adaptive, well-tuned attacks before claiming robustness.
