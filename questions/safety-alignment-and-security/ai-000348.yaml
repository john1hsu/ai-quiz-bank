true_statement: Kalai and colleagues argue hallucinations persist after post-training partly because benchmarks score an abstention as zero, so a confident guess earns more on average.
false_statement: Kalai and colleagues argue hallucinations persist after post-training partly because benchmarks penalise an abstention below zero, so a confident guess earns more on average.
explanation: Like a multiple-choice exam with no penalty for wrong answers, a guess sometimes scores while saying 'I don't know' never does, so models are pushed to bluff. Their proposed fix is to penalise confident errors more than abstentions in mainstream benchmarks, not to punish abstaining.
