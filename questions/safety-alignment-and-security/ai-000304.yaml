true_statement: In Gao, Schulman and Hilton's study of RLHF overoptimization, larger proxy reward models reached higher gold scores and suffered less overoptimization.
false_statement: In Gao, Schulman and Hilton's study of RLHF overoptimization, smaller proxy reward models reached higher gold scores and suffered less overoptimization.
explanation: A larger reward model is a better proxy for human judgement, so a policy can push further against it before the true (gold) score turns down. The benefit scaled smoothly with parameter count, which makes reward-model size a practical lever against reward hacking in RLHF, though not a cure.
