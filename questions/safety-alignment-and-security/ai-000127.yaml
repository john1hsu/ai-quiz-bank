true_statement: In Ji et al.'s alignment survey, forward alignment makes systems aligned during training, while backward alignment gathers evidence on whether a trained system is aligned.
false_statement: In Ji et al.'s alignment survey, backward alignment makes systems aligned during training, while forward alignment gathers evidence on whether a trained system is aligned.
explanation: Forward alignment covers methods like learning from human feedback; backward alignment covers assurance such as evaluation and interpretability, plus governance. Splitting them makes alignment something checked over a system's life, not settled once.
