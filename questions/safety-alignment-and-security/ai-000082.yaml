id: ai-000082
area: safety-alignment-and-security
kind: definition
topic: Mechanistic interpretability
topic_type: Field
maturity: emerging
true_statement: Superposition is the hypothesis that a network represents more features than it has neurons, encoding each feature as a direction spread across many neurons.
false_statement: Superposition is the hypothesis that a network represents fewer features than it has neurons, giving each feature its own group of dedicated neurons.
explanation: It is the leading explanation for polysemantic neurons that fire on unrelated inputs. If features are directions rather than single neurons, you need a tool like dictionary learning to pull them apart before circuits can be read.
