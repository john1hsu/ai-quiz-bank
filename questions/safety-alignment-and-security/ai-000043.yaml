kind: definition
topic: Jailbreak
topic_type: Risk
maturity: emerging
true_statement: NIST classifies a jailbreak as a direct prompting attack, because the attacker is the person typing to the model.
false_statement: NIST classifies a jailbreak as an indirect prompt injection, because the attacker plants instructions in content the model reads.
explanation: In a jailbreak the user's own input tries to get around the developer's restrictions, usually the trained refusal. Indirect prompt injection is a different threat, where a third party hides instructions in documents or web pages.
