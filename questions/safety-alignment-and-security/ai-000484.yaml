true_statement: Goodfellow, Shlens and Szegedy argued that vulnerability to small worst-case input perturbations stems mainly from models behaving too linearly in high-dimensional input spaces.
false_statement: Goodfellow, Shlens and Szegedy argued that vulnerability to small worst-case input perturbations stems mainly from models behaving too nonlinearly and overfitting their training data.
explanation: In high dimensions, many tiny per-feature changes add up to a large change in a roughly linear model's output. That insight explains why adversarial examples are so easy to find, and it led to their fast perturbation method and its use for adversarial training.
