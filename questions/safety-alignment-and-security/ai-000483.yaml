true_statement: Biggio and Roli trace adversarial machine learning to 2004–2005 work showing that linear spam filters could be evaded by small, targeted edits to email content.
false_statement: Biggio and Roli trace adversarial machine learning to 2014 work showing that linear spam filters could be evaded by small, targeted edits to email content.
explanation: The field is often dated to the 2014 discovery of adversarial examples in deep networks, but attacks on spam filters by Dalvi et al. and by Lowd and Meek came about a decade earlier. Seeing that history makes clear the problem is not specific to deep learning.
