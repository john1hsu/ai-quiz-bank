true_statement: Anthropic reported in 2024 that many-shot jailbreaking grows more effective with more examples, and larger models were often more susceptible.
false_statement: Anthropic reported in 2024 that many-shot jailbreaking grows more effective with more examples, but larger models were often more resistant.
explanation: Effectiveness followed a power law like ordinary in-context learning, so bigger, better in-context learners were often easier to sway. Longer context windows widened the attack surface; classifying and modifying prompts cut one attack's success sharply.
