true_statement: Simon Willison named prompt injection in September 2022, after Riley Goodside showed a GPT-3 translation prompt could be told to drop its task and print other text.
false_statement: Riley Goodside named prompt injection in September 2022, after Simon Willison showed a GPT-3 translation prompt could be told to drop its task and print other text.
explanation: Goodside's demo drew attention to the behaviour, and Willison gave it a name by analogy to SQL injection, arguing it was a real security flaw rather than a curiosity. In both cases data supplied by someone else ends up being treated as commands.
