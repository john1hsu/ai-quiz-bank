true_statement: McCarthy later wrote that at Dartmouth participants mostly pursued their own research, arriving and leaving at different times, rather than collaborating on one agenda.
false_statement: McCarthy later wrote that at Dartmouth the ten participants worked together on one agenda for the full two months, just as the proposal had planned.
explanation: The foundation funded only about half the request, and only McCarthy, Minsky and Solomonoff stayed all eight weeks. The meeting's lasting effect was institutional, naming the field and linking its founders, more than any technical breakthrough.
