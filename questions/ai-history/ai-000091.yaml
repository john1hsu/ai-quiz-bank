topic: A Logical Calculus of the Ideas Immanent in Nervous Activity
topic_type: Work
maturity: historical
true_statement: In a McCulloch–Pitts neuron, any active inhibitory input forces the output to 0, however many excitatory inputs are on.
false_statement: In a McCulloch–Pitts neuron, an active inhibitory input only subtracts from the sum, so enough excitatory inputs can still make it fire.
explanation: 'The 1943 model assumed absolute inhibition: one inhibitory synapse vetoes firing outright. The authors showed relative inhibition, the subtractive version, could be simulated by their idealised nets, but it was not the basic unit.'
