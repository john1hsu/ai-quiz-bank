true_statement: The OECD's November 2023 revision of its AI system definition allows a system's objectives to be implicit, such as learned ones, and names content among the outputs.
false_statement: The OECD's November 2023 revision of its AI system definition requires a system's objectives to be explicitly stated, and drops content from the outputs.
explanation: The 2019 wording fit systems with stated goals; learned objectives and generative AI did not fit neatly. Allowing implicit objectives and listing content as an output brought generative models clearly inside the definition that much AI governance builds on.
