true_statement: Newell and Simon's heuristic search hypothesis says a symbol system solves problems by generating and modifying symbol structures, searching selectively under heuristics rather than exhaustively.
false_statement: Newell and Simon's heuristic search hypothesis says a symbol system solves problems by generating and modifying symbol structures, searching exhaustively rather than selectively under heuristics.
explanation: Because real machines have limited resources, the search over candidate solutions must be pruned by heuristics; exhaustive search runs into combinatorial explosion. This idea runs through the Logic Theorist's best-first search, GPS's means-ends analysis and alpha-beta pruning in chess programs.
