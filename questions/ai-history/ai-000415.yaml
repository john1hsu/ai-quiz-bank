true_statement: DENDRAL, begun at Stanford in 1965 by Edward Feigenbaum and geneticist Joshua Lederberg, inferred the structure of organic molecules from mass-spectrometry data.
false_statement: DENDRAL, begun at Stanford in 1972 by Edward Feigenbaum and geneticist Joshua Lederberg, inferred the structure of organic molecules from mass-spectrometry data.
explanation: Feigenbaum, a student of Herbert Simon, started DENDRAL in 1965 soon after moving to Stanford; 1972 is when work on MYCIN began there. DENDRAL rivalled expert chemists and was used in industry and academia, an early proof that encoded expert knowledge could pay off.
