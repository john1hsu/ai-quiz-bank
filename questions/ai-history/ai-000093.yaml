true_statement: Stephen Kleene's 1951 RAND memorandum generalised McCulloch–Pitts nerve nets into finite automata, which accept exactly the regular languages.
false_statement: Stephen Kleene's 1951 RAND memorandum generalised McCulloch–Pitts nerve nets into finite automata, which accept exactly the context-free languages.
explanation: Kleene asked which events a nerve net could respond to and turned the answer into automata theory. McCulloch–Pitts automata accept the same class as finite-state grammars, the regular sets, which is why the paper matters to computer science as well as AI.
