true_statement: In 2012 Hinton, Krizhevsky and Sutskever trained AlexNet, a 60-million-parameter, eight-layer convolutional network, on GPUs for ImageNet classification.
false_statement: In 2012 Hinton, Krizhevsky and Sutskever trained AlexNet, a 600-million-parameter, eighty-layer convolutional network, on GPUs for ImageNet classification.
explanation: By later standards AlexNet was small and shallow, yet training it on GPUs let it cut ImageNet top-5 error to 18.9% and beat the next program by a wide margin. That result helped convince the field that deep networks trained on large data were the way forward.
