true_statement: The phrase 'artificial intelligence' first appeared in the 1955 funding proposal for the Dartmouth workshop, drafted by John McCarthy.
false_statement: The phrase 'artificial intelligence' first appeared in the 1955 funding proposal for the Dartmouth workshop, drafted by Marvin Minsky.
explanation: Minsky, Rochester and Shannon co-signed, but McCarthy, then an assistant professor at Dartmouth, wrote the proposal and is credited with the term. The 1956 summer meeting it funded is treated as the founding of AI as a field.
