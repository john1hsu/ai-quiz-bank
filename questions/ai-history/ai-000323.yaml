true_statement: When ELIZA found several script keywords in an input, a higher-ranked keyword displaced a lower-ranked one, and its rules then built the reply.
false_statement: When ELIZA found several script keywords in an input, the first keyword found displaced any later ones, and its rules then built the reply.
explanation: 'Each keyword in the script carries a rank, so the most important one wins regardless of position. A decomposition rule then splits the input around it and a reassembly rule rebuilds the fragments, swapping pronouns: pattern matching on surface text, not understanding.'
