true_statement: During the 1997 Kasparov match, Deep Blue averaged about 126 million chess positions per second on long searches, using 480 custom chess chips.
false_statement: During the 1997 Kasparov match, Deep Blue averaged about 12.6 million chess positions per second on long searches, using 480 custom chess chips.
explanation: Each chip managed only 2 to 2.5 million positions per second, so the speed came from running hundreds in parallel. Its designers still put chess knowledge ahead of speed, with an evaluation function of about 8,000 hand-tuned features.
