true_statement: The Logic Theorist, often called the first AI program, was written in 1955–1956 by Allen Newell, J. C. Shaw and Herbert A. Simon at the RAND Corporation.
false_statement: The Logic Theorist, often called the first AI program, was written in 1955–1956 by Allen Newell, J. C. Shaw and Herbert A. Simon at Dartmouth College.
explanation: Newell, Shaw and Simon built it at RAND, with funding mainly from the US Air Force, and a version ran on RAND's JOHNNIAC computer. Dartmouth is the tempting wrong answer because the program was coded around the time of the 1956 Dartmouth workshop.
