true_statement: Weizenbaum used a Rogerian psychotherapist for ELIZA's DOCTOR script because such an interviewer can seem to know almost nothing about the world.
false_statement: Weizenbaum used a Rogerian psychotherapist for ELIZA's DOCTOR script because such an interviewer is expected to know a great deal about the world.
explanation: A therapist who reflects questions back hides the program's total lack of knowledge, so users fill in the understanding themselves. That human tendency to read meaning into simple output became known as the ELIZA effect.
