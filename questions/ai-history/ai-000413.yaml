true_statement: EMYCIN was MYCIN with its medical rules removed, a reuse possible because MYCIN kept its knowledge base separate from its inference engine.
false_statement: EMYCIN was MYCIN's medical rules fitted to a new inference engine, a reuse possible because MYCIN kept its knowledge base separate from its inference engine.
explanation: EMYCIN kept MYCIN's inference engine and dropped its medical rules, so new domain rules could be loaded; it was later applied to electronics, tax advice and software consulting. Separating knowledge from reasoning made the engine reusable and let a knowledge base grow one rule at a time.
