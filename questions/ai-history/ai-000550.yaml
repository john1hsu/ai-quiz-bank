true_statement: 'John McCarthy held that AI need not imitate people: researchers may use methods never observed in humans or animals if they solve the problems intelligence faces.'
false_statement: 'John McCarthy held that AI must imitate people: researchers should use only methods observed in humans or animals to solve the problems intelligence faces.'
explanation: McCarthy defined intelligence as the computational part of achieving goals in the world, so the target is the problem, not human biology. That is why AI can use search, logic or statistics that look nothing like how brains work.
