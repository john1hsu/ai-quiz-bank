topic: Logic Theorist
topic_type: Model
maturity: historical
true_statement: The Logic Theorist worked backward from the goal theorem, generating subproblems whose solution would yield it, instead of enumerating every possible derivation.
false_statement: The Logic Theorist worked forward from the axioms, enumerating every possible derivation until the goal theorem appeared, instead of generating subproblems.
explanation: Blind enumeration is what its authors called the British Museum algorithm, and they used it as the contrast. LT instead pruned the search with heuristics, working back from the goal and hunting for matching substitutions, a goal-directed style that became standard in automated reasoning.
