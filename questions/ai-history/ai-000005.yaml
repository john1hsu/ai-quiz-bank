topic: Chinese room argument
topic_type: Concept
maturity: foundational
true_statement: The Chinese room targets strong AI, the claim that a suitably programmed computer literally understands, not weak AI's use of computers as research tools.
false_statement: The Chinese room targets weak AI, the use of computers as research tools, not strong AI's claim that a suitably programmed computer literally understands.
explanation: Searle had no quarrel with using computers to test hypotheses about the mind. His target was the stronger thesis that running the right program is itself having a mind, because syntax alone can't give meaning.
