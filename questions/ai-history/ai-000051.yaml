true_statement: In Jones and Bergen's 2025 three-party Turing test, GPT-4.5 with a humanlike persona prompt was picked as the human 73 percent of the time.
false_statement: In Jones and Bergen's 2025 three-party Turing test, GPT-4.5 with a humanlike persona prompt was picked as the human 56 percent of the time.
explanation: 73 percent meant it was chosen more often than the real humans; 56 percent was LLaMa-3.1-405B with the same prompt. The authors stress the result hinged on the persona prompt and measures humanlikeness, not intelligence.
