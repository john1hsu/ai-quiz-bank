true_statement: Frank Rosenblatt set out the perceptron, the first neural network that learned its connection strengths, in a 1958 Psychological Review paper.
false_statement: Marvin Minsky set out the perceptron, the first neural network that learned its connection strengths, in a 1958 Psychological Review paper.
explanation: Rosenblatt, a psychologist at the Cornell Aeronautical Laboratory, extended McCulloch and Pitts's fixed threshold neurons with adjustable weights. Minsky was his public critic, and with Papert wrote the 1969 book analysing what single-layer perceptrons cannot compute.
