topic: A Logical Calculus of the Ideas Immanent in Nervous Activity
topic_type: Work
maturity: historical
true_statement: A single McCulloch–Pitts unit splits its input space with a line or hyperplane, so it can represent only linearly separable Boolean functions.
false_statement: A single McCulloch–Pitts unit splits its input space with a curved boundary, so it can represent any Boolean function, including XOR.
explanation: With a threshold on a plain sum, one unit can be AND, OR or NOT but never XOR, whose true cases cannot be separated by one line. Rosenblatt's perceptron added learnable weights but inherited the same single-unit limit.
