true_statement: When a perceptron misclassifies a training point it adds y·x to its weight vector, and training stops after a full pass with no mistakes.
false_statement: When a perceptron classifies a training point correctly it adds y·x to its weight vector, and training stops after a full pass with no mistakes.
explanation: 'The rule is error-driven: correct points leave the weights alone, while each mistake nudges the separating hyperplane toward the right side for that point. On data no hyperplane can separate, such as XOR, the loop never ends.'
