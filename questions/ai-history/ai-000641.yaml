maturity: historical
true_statement: Connectionism revived in 1986, when Rumelhart, Hinton and Williams showed in Nature that back-propagating errors lets hidden units learn useful internal representations.
false_statement: Connectionism revived in 1969, when Minsky and Papert showed in Nature that back-propagating errors lets hidden units learn useful internal representations.
explanation: Minsky and Papert's 1969 work did the opposite, exposing the limits of two-layer networks at a time when nobody knew how to train hidden units. Backpropagation solved that training problem and, with the Parallel Distributed Processing volumes the same year, began connectionism's golden age.
