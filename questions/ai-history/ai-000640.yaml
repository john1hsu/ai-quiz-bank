topic: Connectionism
topic_type: Paradigm
maturity: historical
true_statement: In connectionism a concept is a distributed pattern of activity over many units, and a network's knowledge is stored in its connection strengths rather than in explicit rules.
false_statement: In connectionism a concept is a single dedicated symbol held by one unit, and a network's knowledge is stored in explicit rules rather than in its connection strengths.
explanation: Distributed storage is why connectionist networks degrade gracefully when units are damaged and can complete partial patterns. It also makes learning, finding good weights, the central problem, rather than writing rules by hand as symbolic AI does.
