true_statement: Hao Wang showed a complete, efficient propositional procedure easily proved the Principia theorems that had stumped the Logic Theorist.
false_statement: Hao Wang showed a complete, efficient propositional procedure stalled on the same Principia theorems that had stumped the Logic Theorist.
explanation: Wang's result undercut the suggestion that exhaustive enumeration was the only alternative to heuristics, since a systematic method did better. Martin Davis replied that efficient proving was never LT's aim; it was meant to model human problem solving.
