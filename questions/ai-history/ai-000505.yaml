true_statement: The AI100 panel blamed AI's gap between promise and practice partly on too little grounding in real sensor data and overreliance on true/false logic rather than quantified uncertainty.
false_statement: The AI100 panel blamed AI's gap between promise and practice partly on too little grounding in real sensor data and overreliance on quantified uncertainty rather than true/false logic.
explanation: Brittle rule-based expert systems reasoned in crisp true/false terms and struggled with messy real-world inputs. The recovery of the 1990s came from statistical machine learning, which handles uncertainty explicitly, so the false version reverses the lesson.
