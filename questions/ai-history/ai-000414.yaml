true_statement: MYCIN never entered routine clinical use, partly because it ran only on costly time-sharing computers unavailable on wards and needed 50–60 typed answers per consultation.
false_statement: MYCIN never entered routine clinical use, partly because in blinded tests outside experts disagreed with its therapy advice far more often than with Stanford faculty's.
explanation: 'MYCIN performed well: in a blinded evaluation, outside infectious-disease experts disagreed with it no more often than with Stanford faculty. What blocked use was practical, from Interlisp on costly time-sharing systems and long typed consultations to lost funding, showing that good test results do not guarantee adoption.'
