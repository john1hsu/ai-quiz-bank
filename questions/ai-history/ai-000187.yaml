true_statement: A Boltzmann machine learns the characteristic features of a class of data, so it can both classify inputs and generate new examples of that class.
false_statement: A Boltzmann machine learns only a decision boundary between classes of data, so it can classify inputs but cannot generate new examples of a class.
explanation: 'It is a generative model: by learning what typical data look like rather than just where classes divide, it can also produce new samples. The Nobel committee cited this work as helping launch the current growth of machine learning.'
