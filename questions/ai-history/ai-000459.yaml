true_statement: To recognise a letter, a symbolic AI program compares the input with programmer-written geometric descriptions, while a connectionist system adjusts network connections from examples.
false_statement: To recognise a letter, a symbolic AI program adjusts network connections from examples, while a connectionist system compares the input with programmer-written geometric descriptions.
explanation: Symbolic, top-down AI encodes knowledge explicitly as human-written symbols and rules; connectionist, bottom-up AI learns its knowledge from data by tuning connection strengths. The false version swaps the two traditions, which is the core distinction between them.
