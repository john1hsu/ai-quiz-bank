true_statement: Fodor and Pylyshyn argued in 1988 that thought is systematic, so cognition needs compositional symbols, and that networks could at best implement a classical symbol system.
false_statement: Fodor and Pylyshyn argued in 1988 that thought is systematic, so cognition needs distributed patterns, and that classical symbol systems could at best implement a network.
explanation: Their point was that anyone who can think 'John loves Mary' can think 'Mary loves John', which combinatorial syntax explains naturally. Replies countered that trained networks can generalise systematically, and later tests gave mixed results.
