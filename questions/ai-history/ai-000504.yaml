true_statement: DARPA's Strategic Computing programme, announced in 1983 with $1 billion planned over a decade, was partly a response to Japan's Fifth Generation Computer Systems project.
false_statement: DARPA's Strategic Computing programme, announced in 1983 with $1 billion planned over a decade, was partly a response to Britain's Lighthill report on AI.
explanation: Strategic Computing belonged to the early-1980s recovery, driven by competition with Japan's Fifth Generation project; the 1973 Lighthill report had instead fed the cuts of the first winter. When contractors missed its milestones, it became part of the second winter's story.
