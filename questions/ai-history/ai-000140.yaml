true_statement: The Dartmouth proposal conjectured that every aspect of learning or intelligence could in principle be described precisely enough for a machine to simulate it.
false_statement: The Dartmouth proposal conjectured that intelligence could be simulated only by building machines that copy the brain's neurons one by one.
explanation: The premise was that intelligence is a matter of precise description, not of a particular substrate. Its seven topics spanned both neuron nets and symbolic approaches like language use and abstraction, a split that ran through AI's later history.
