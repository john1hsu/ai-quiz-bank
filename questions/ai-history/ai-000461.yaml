true_statement: 'John McCarthy and Patrick Hayes named the frame problem in 1969: the difficulty of formally stating what does not change when an action occurs.'
false_statement: 'Allen Newell and Herbert Simon named the frame problem in 1969: the difficulty of formally stating what does not change when an action occurs.'
explanation: The frame problem came from McCarthy's logicist strand, which formalised actions in the situation calculus, not from Newell and Simon's search-based tradition. Attempts to solve it drove the nonmonotonic logics of 1980 and helped make knowledge representation a subfield.
