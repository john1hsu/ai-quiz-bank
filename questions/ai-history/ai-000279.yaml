true_statement: AlexNet's authors found that removing any single convolutional layer hurt accuracy, even though each held at most 1% of the parameters, an early sign that depth itself mattered.
false_statement: AlexNet's authors found that removing any single convolutional layer barely changed accuracy, since each held at most 1% of the parameters, an early sign that width mattered more than depth.
explanation: Most of AlexNet's parameters sat in its fully connected layers, so the convolutional layers looked cheap. That losing even one still cost accuracy suggested the stack of learned feature levels, not raw parameter count, was doing the work.
