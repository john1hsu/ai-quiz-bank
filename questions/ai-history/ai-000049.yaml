true_statement: Alan Turing proposed the imitation game in his 1950 paper Computing Machinery and Intelligence, published in the philosophy journal Mind.
false_statement: Alan Turing proposed the imitation game in his 1956 paper Computing Machinery and Intelligence, published in the philosophy journal Mind.
explanation: The paper appeared in 1950, six years before the Dartmouth workshop named the field. Turing swapped the vague question 'Can machines think?' for a concrete behavioural test; the name 'Turing test' came later.
