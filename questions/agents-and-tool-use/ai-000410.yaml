true_statement: In Du et al.'s multiagent debate, several instances of the same model each answer, then read and critique one another's reasoning over several rounds until they converge.
false_statement: In Du et al.'s multiagent debate, several instances of the same model each answer once, then a separate stronger judge model picks the single best answer without further rounds.
explanation: The gain comes from agents revising their answers after seeing each other's reasoning, round after round, using only black-box access and the same prompts across tasks. The false version describes one-shot judging, which drops the iterative critique that improved reasoning and factuality.
