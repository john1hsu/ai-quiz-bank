topic: Agent memory
topic_type: Concept
maturity: emerging
true_statement: MemGPT treats the context window like an operating system's main memory, and the model itself moves data between the window and outside storage through function calls.
false_statement: MemGPT treats the context window like an operating system's main memory, and a fixed retrieval pipeline outside the model moves data between the window and outside storage.
explanation: MemGPT's key move is giving the model control over its own memory tiers, like a program paging data in and out, with a queue manager warning it of memory pressure. A fixed external pipeline is the more conventional retrieval design it departs from.
