topic: Planning in LLMs
topic_type: Concept
maturity: emerging
true_statement: When Huang and colleagues mapped each LLM-generated household step onto the closest action the simulator allowed, plans became far more executable but raters saw a trade-off with correctness.
false_statement: When Huang and colleagues mapped each LLM-generated household step onto the closest action the simulator allowed, plans became far more executable and raters saw correctness rise with it.
explanation: Large models wrote fluent step lists, but many steps named actions the VirtualHome environment could not run. Forcing steps into admissible actions fixed that while sometimes distorting the plan's meaning, the tension between fluent and grounded plans that runs through the field.
