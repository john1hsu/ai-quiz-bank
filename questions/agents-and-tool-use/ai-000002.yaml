true_statement: In the orchestrator–workers pattern a central model breaks the task into subtasks on the fly, unlike parallelisation, where the subtasks are known in advance.
false_statement: In the parallelisation pattern a central model breaks the task into subtasks on the fly, unlike orchestrator–workers, where the subtasks are known in advance.
explanation: Parallelisation runs predefined calls at once (sectioning or voting) and aggregates them in code. Orchestrator–workers suits tasks like multi-file code edits, where you can't know the subtasks until a model looks at the job.
