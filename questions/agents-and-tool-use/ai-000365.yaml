true_statement: 'In function calling the model never runs a tool itself: it emits a tool name and arguments matching a declared schema, and the application or provider executes the call.'
false_statement: In function calling the model runs the tool itself during generation, using the code behind each declared schema, and the application only receives the final answer.
explanation: The model sees only each tool's name, description and JSON Schema, never its code, so all it can do is ask; the host executes the call and feeds the result back for the model to continue. That split is why permission checks belong in the application.
