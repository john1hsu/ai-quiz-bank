true_statement: Anthropic found multi-agent designs suit broad, parallel research, but fit poorly with tasks where all agents need shared context, which includes most coding work.
false_statement: Anthropic found multi-agent designs suit most coding work, but fit poorly with broad, parallel research, where all agents need shared context.
explanation: Subagents with separate context windows shine when a task splits into independent searches, but they struggle when work is tightly interdependent, as most code changes are. That is why multi-agent setups are usually kept for high-value, breadth-first tasks.
