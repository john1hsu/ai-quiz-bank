id: ai-000639
area: agents-and-tool-use
kind: application
topic: Computer-use agents
topic_type: Technique
maturity: emerging
true_statement: Because a computer-use agent reads whatever appears on screen, guidance recommends running it in a minimal-privilege virtual machine and requiring human confirmation for consequential steps.
false_statement: Because a computer-use agent reads whatever appears on screen, guidance recommends running it on the user's main machine with saved credentials so it can finish consequential steps unattended.
explanation: Text in a webpage or image can carry instructions that override the user's, a form of prompt injection. Isolation, withheld credentials, domain allow-lists and confirmations before payments limit what a hijacked agent could do.
