topic: 'AutoGen: Enabling Next-Gen LLM Applications via Multi-Agent Conversation'
topic_type: Tool
maturity: established
true_statement: In AutoGen's conversation programming, each agent auto-replies until a termination condition is met, so the control flow emerges from the conversation itself.
false_statement: In AutoGen's conversation programming, each agent replies only along edges of a state graph defined in advance, so the control flow is fixed before the conversation.
explanation: A single opening message can drive a long multi-agent exchange, with control steered by system messages or custom Python reply functions. Explicit state graphs are the approach of LangGraph, the main alternative design.
