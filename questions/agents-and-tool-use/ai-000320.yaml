topic: 'Generative Agents: Interactive Simulacra of Human Behavior'
topic_type: Work
maturity: established
true_statement: In generative agents, a reflection is a higher-level insight written about recent memories and stored back in the memory stream, so later reflections can build on it.
false_statement: In generative agents, a reflection is a higher-level summary that replaces recent memories in the memory stream, so later reflections can only use the summary.
explanation: Reflections cite the memories that support them and sit alongside raw observations, forming trees of increasingly abstract beliefs. They are triggered when the summed importance of recent events passes a threshold, a few times per simulated day.
