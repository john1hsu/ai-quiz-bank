true_statement: When a LangGraph run resumes after interrupt(), the node restarts from its beginning, so code before the interrupt must be idempotent.
false_statement: When a LangGraph run resumes after interrupt(), the node continues from the line after it, so code before the interrupt runs only once.
explanation: Interrupts pause a run for human approval or edits, relying on the checkpointer to save state. Because the node is re-run on resume, side effects placed before the interrupt, like charging a card, could happen twice.
