true_statement: In the 2023 AutoGen paper, a GPT-4-based AutoGen setup solved 52.5% of 120 level-5 MATH problems, against 30.0% for plain GPT-4.
false_statement: In the 2023 AutoGen paper, a GPT-4-based AutoGen setup solved 52.5% of 120 level-5 MATH problems, against 48.3% for plain GPT-4.
explanation: Letting an assistant agent write code and a proxy agent run it gave GPT-4 a feedback loop it lacks when answering directly. The 48.33% figure was ChatGPT with Code Interpreter, a closer competitor that also executes code.
