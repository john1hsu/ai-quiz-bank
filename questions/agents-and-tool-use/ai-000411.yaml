true_statement: In 2025 Anthropic reported that token usage alone explained about 80% of the performance variance of its research agents on the BrowseComp benchmark.
false_statement: In 2025 Anthropic reported that the number of subagents alone explained about 80% of the performance variance of its research agents on the BrowseComp benchmark.
explanation: Much of a multi-agent system's advantage comes from spending more tokens across parallel context windows, which is also why such runs cost about 15 times a chat. It was the token budget, not the count of agents, that Anthropic found explained most of the variance.
