true_statement: In an agentic workflow the developer's code controls the overall flow of steps, while in an AI agent the model decides the process itself.
false_statement: In an agentic workflow the model decides the overall flow of steps, while in an AI agent the developer's code controls the process itself.
explanation: Anthropic's guidance, followed by LangGraph, splits agentic systems by who controls the flow. Workflows run along predetermined code paths with the model filling in each step; agents choose their own process in feedback loops.
