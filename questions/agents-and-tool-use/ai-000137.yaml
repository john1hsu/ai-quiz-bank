true_statement: In LangGraph a state key without a reducer is overwritten by each update, while an append reducer lets parallel nodes add messages without clobbering each other.
false_statement: In LangGraph a state key without a reducer appends each update, while an overwrite reducer lets parallel nodes add messages without clobbering each other.
explanation: Reducers define how node outputs merge into shared state. Overwrite is the default; when several nodes run in the same super-step, an append reducer is what keeps all their messages instead of the last write winning.
