true_statement: In the CoALA framework, episodic memory stores an agent's past experience such as trajectories, while semantic memory stores knowledge about the world and the agent itself.
false_statement: In the CoALA framework, semantic memory stores an agent's past experience such as trajectories, while episodic memory stores knowledge about the world and the agent itself.
explanation: 'CoALA (Cognitive Architectures for Language Agents) borrows the cognitive-science split: episodes are what happened, semantics are what is known. Keeping them apart helps decide what to log as history and what to distil into facts or profiles.'
