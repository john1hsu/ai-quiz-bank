topic: Model Context Protocol
topic_type: Tool
maturity: emerging
true_statement: In the Model Context Protocol, a host application creates a separate client for each server it connects to, and each client holds that one connection.
false_statement: In the Model Context Protocol, a host application creates a single shared client that holds the connections to all of the servers it uses.
explanation: 'MCP has three roles: the host (an IDE or chat app), one client per server connection, and the servers that provide context. Keeping clients one-to-one with servers isolates each connection, and the host then merges every server''s tools into one registry for the model.'
