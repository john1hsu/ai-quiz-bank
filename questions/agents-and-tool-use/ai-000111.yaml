true_statement: Google announced the Agent2Agent protocol in April 2025, and the Linux Foundation took over the project that June to keep it vendor neutral.
false_statement: Microsoft announced the Agent2Agent protocol in April 2025, and the Linux Foundation took over the project that June to keep it vendor neutral.
explanation: Google launched A2A with more than 50 partners; Microsoft later became an adopter, adding it to Azure AI Foundry and Copilot Studio. Handing a protocol to a neutral foundation is a common way to win cross-vendor adoption.
