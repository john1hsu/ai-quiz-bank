true_statement: In Anthropic's computer-use API the model only emits tool calls such as screenshot or a click at pixel coordinates, and the developer's application executes them in an environment it controls.
false_statement: In Anthropic's computer-use API the model emits tool calls such as screenshot or a click at pixel coordinates, and Anthropic's servers execute them in a hosted virtual desktop.
explanation: 'Computer use is a client-side toolset, like ordinary function calling: the model never touches the machine directly. That puts the developer in charge of sandboxing, which matters because the agent acts with whatever access that environment has.'
