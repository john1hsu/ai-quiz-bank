true_statement: Anthropic released the Model Context Protocol in November 2024, modelling it on the Language Server Protocol, which lets one language integration serve many editors.
false_statement: Google released the Model Context Protocol in November 2024, modelling it on the Language Server Protocol, which lets one language integration serve many editors.
explanation: 'Anthropic launched MCP to replace one-off connectors for every data source with a single protocol. The Language Server Protocol analogy is the key intuition: write a server once and every compatible AI application can use it. Google''s protocol from 2025 is Agent2Agent, which links agents to each other rather than to tools.'
