topic: 'Toolformer: Language Models Can Teach Themselves to Use Tools'
topic_type: Model
maturity: established
true_statement: Toolformer cannot chain tools, because the training calls for each tool were generated independently of the other tools.
false_statement: Toolformer cannot chain tools, because its fine-tuning objective allows at most one API call in each training document.
explanation: Since every tool's examples were sampled and filtered separately, the model never saw one tool's output feeding another's input. It also cannot interact with a tool, such as browsing several search results, which is where ReAct-style loops and full agents differ.
