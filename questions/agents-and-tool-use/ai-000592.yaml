topic: Planning in LLMs
topic_type: Concept
maturity: emerging
true_statement: In LLM+P the language model rewrites a natural-language problem as a PDDL file, a classical planner solves it, and the model turns the resulting plan back into prose.
false_statement: In LLM+P a classical planner rewrites a natural-language problem as a PDDL file, the language model solves it, and the planner turns the resulting plan back into prose.
explanation: The model does what it is good at, translating between language and formal notation, while a sound planner does the search. On the authors' benchmark this returned optimal plans for most problems, where the LLM alone often failed to find any feasible plan.
