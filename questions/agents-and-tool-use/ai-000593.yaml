topic: Planning in LLMs
topic_type: Concept
maturity: emerging
true_statement: In Valmeekam and colleagues' 2023 study on planning-competition-style domains, GPT-4 produced valid plans on its own in only about 12% of instances on average.
false_statement: In Valmeekam and colleagues' 2023 study on planning-competition-style domains, GPT-4 produced valid plans on its own in about 72% of instances on average.
explanation: The low autonomous success rate is the core evidence for the view that LLMs cannot plan reliably alone. Results improved when an external verifier checked plans and sent feedback, the idea behind the later LLM-Modulo framework.
