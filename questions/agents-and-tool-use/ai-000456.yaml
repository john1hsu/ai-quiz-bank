true_statement: ReAct was introduced by Shunyu Yao and colleagues with Google Research's Brain Team, posted to arXiv in October 2022 and published at ICLR 2023.
false_statement: ReAct was introduced by Shunyu Yao and colleagues with Google Research's Brain Team, posted to arXiv in October 2022 and published at NeurIPS 2023.
explanation: ReAct appeared at ICLR 2023. The confusion is natural because Yao's follow-up, Tree of Thoughts, was the NeurIPS 2023 paper; the two together trace a line from interleaved reasoning and acting to explicit search over thoughts.
