true_statement: AI21 Labs' 2022 MRKL paper proposed a router that sends each input to the most suitable expert module, neural or symbolic such as a calculator, with the language model as fallback.
false_statement: Meta AI's 2022 MRKL paper proposed a router that sends each input to the most suitable expert module, neural or symbolic such as a calculator, with the language model as fallback.
explanation: MRKL (Modular Reasoning, Knowledge and Language) came from AI21 Labs, the maker of Jurassic-1, and argued that models lack fresh data and reliable arithmetic, so those jobs should go to external modules. Its hand-built router preceded models that choose tools themselves.
