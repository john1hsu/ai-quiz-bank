true_statement: An A2A server advertises its identity, skills, endpoint and required authentication in an Agent Card, a JSON document clients can fetch from a well-known path.
false_statement: An A2A server advertises its identity, skills, endpoint and required authentication in an Artifact, a JSON document clients can fetch from a well-known path.
explanation: 'Agent Cards are how agents find and size each other up before any work starts. Artifacts are something else: the outputs a remote agent returns when a task is done.'
