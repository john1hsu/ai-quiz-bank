true_statement: Generative agents rank memories by summing recency, importance and relevance, where importance is a 1–10 rating the LLM gives each memory when it is stored.
false_statement: Generative agents rank memories by summing recency, importance and relevance, where importance is the cosine similarity between the memory's embedding and the current query.
explanation: Embedding similarity to the query is the relevance score; importance separates mundane events from poignant ones. Combining the three lets an agent recall what is recent, significant and on-topic rather than just the closest match.
