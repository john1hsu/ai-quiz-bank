true_statement: In the classical textbook view, the agent function maps the full history of percepts to an action, and the agent program is its concrete implementation.
false_statement: In the classical textbook view, the agent program maps the full history of percepts to an action, and the agent function is its concrete implementation.
explanation: Russell and Norvig separate the abstract mapping (the agent function) from the code that realises it on some architecture (the agent program). Keeping them apart lets you reason about what an agent should do before worrying about how it is built.
