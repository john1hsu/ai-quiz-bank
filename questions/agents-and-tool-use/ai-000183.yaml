topic: 'Toolformer: Language Models Can Teach Themselves to Use Tools'
topic_type: Model
maturity: established
true_statement: Toolformer keeps a sampled API call for training only if inserting the call and its result lowers the model's loss on the tokens that follow.
false_statement: Toolformer keeps a sampled API call for training only if the model assigned a high probability to opening an API call at that position.
explanation: 'The probability threshold only chooses where to sample candidate calls. The real filter is usefulness: the result must make the following text easier to predict than no call, or the call without its result. This lets the model build its own tool-use training data with just a few human demonstrations per tool.'
