topic: Agent memory
topic_type: Concept
maturity: emerging
true_statement: LangGraph's docs say writing agent memories in the hot path makes them available at once but adds latency, while writing them in a background task avoids that latency.
false_statement: LangGraph's docs say writing agent memories in a background task makes them available at once but adds latency, while writing them in the hot path avoids that latency.
explanation: Writing in the hot path means the agent pauses to save a memory before replying, so it is fresh immediately but slows the response. Background writes keep responses fast, at the risk that another thread briefly misses a memory that was just written.
