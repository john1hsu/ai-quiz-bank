true_statement: Self-Refine (2023), where one LLM critiques and revises its own output, reported an average gain of about 20 absolute points over one-shot generation.
false_statement: Self-Refine (2023), where one LLM critiques and revises its own output, reported an average gain of about 6 absolute points over one-shot generation.
explanation: Madaan et al. reported roughly 20 points on average across seven tasks with GPT-3.5, ChatGPT and GPT-4, with no extra training. It is the peer-reviewed backing for the evaluator–optimizer loop; about 6% is closer to AFlow's reported gain.
