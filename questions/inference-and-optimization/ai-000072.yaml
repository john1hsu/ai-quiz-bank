true_statement: Speculative decoding pays off most in latency-sensitive, low-traffic serving, because under heavy batched load the spare GPU compute it relies on disappears.
false_statement: Speculative decoding pays off most under heavy batched load, because in latency-sensitive, low-traffic serving the spare GPU compute it relies on disappears.
explanation: At small batch sizes decoding is memory-bound, so verifying several tokens in one pass is almost free. Busy servers already use that compute on other requests, and the wasted work on rejected drafts starts to cost real throughput.
