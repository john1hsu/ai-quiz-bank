true_statement: In 2023 vLLM's developers said sharing KV-cache blocks across sequences with copy-on-write cut memory use for parallel sampling and beam search by up to 55%.
false_statement: In 2023 vLLM's developers said sharing KV-cache blocks across sequences with copy-on-write cut memory use for single-sequence greedy decoding by up to 55%.
explanation: Parallel samples and beam candidates start from the same prompt, so their cache blocks can be shared with reference counts and copied only when a sequence diverges. A lone greedy sequence has nothing to share with, so the saving cannot come from there.
