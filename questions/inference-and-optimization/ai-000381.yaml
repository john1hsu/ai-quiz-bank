true_statement: TensorRT-LLM's FP8 quantization needs Hopper-generation or later NVIDIA GPUs, while its FP4 formats need Blackwell GPUs such as the B200.
false_statement: TensorRT-LLM's FP4 quantization needs Hopper-generation or later NVIDIA GPUs, while its FP8 formats need Blackwell GPUs such as the B200.
explanation: 'Low-precision formats depend on tensor-core hardware support, so each new format arrives with a GPU generation: FP8 with Hopper (H100) and FP4 with Blackwell. This tie to specific NVIDIA hardware is the library''s main lock-in; the false statement swaps the two generations.'
