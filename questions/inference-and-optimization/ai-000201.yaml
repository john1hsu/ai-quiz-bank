true_statement: AWQ picks salient weight channels by the magnitude of their input activations, since choosing them by weight norm barely beat random selection.
false_statement: AWQ picks salient weight channels by the magnitude of their weight norms, since choosing them by input activations barely beat random selection.
explanation: A channel that sees large activations amplifies any rounding error in its weights, so protecting about 1% of channels chosen this way sharply cuts quantisation error. The name, activation-aware weight quantisation, records exactly this insight.
