true_statement: As of 2021, NVIDIA's 2:4 sparsity doubled A100 peak throughput on paper, yet its measured throughput gain on a sparse ResNeXt-101 was up to about 20%.
false_statement: As of 2021, NVIDIA's 2:4 sparsity doubled A100 peak throughput on paper, and its measured throughput gain on a sparse ResNeXt-101 was the full 2x.
explanation: In 2:4 sparsity two of every four contiguous weights are zero, which Sparse Tensor Cores can skip. Peak figures still overstate real speedups, a recurring gap between parameter reductions and measured gains in pruning.
