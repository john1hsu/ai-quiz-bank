topic: Speculative decoding
topic_type: Technique
maturity: established
true_statement: Speculative decoding cuts how many sequential target-model forward passes are needed, while quantization makes each forward pass cheaper.
false_statement: Quantization cuts how many sequential target-model forward passes are needed, while speculative decoding makes each forward pass cheaper.
explanation: The two attack latency from different sides, so they combine well. Speculative decoding lets one target pass verify several drafted tokens, and it is exact, whereas quantization shrinks weights so every pass reads and computes less.
