topic: Beam search
topic_type: Algorithm
maturity: established
true_statement: Beam search usually divides a finished hypothesis's summed log-probability by a power of its length, because each extra token lowers the raw score and would unfairly favour short outputs.
false_statement: Beam search usually divides a finished hypothesis's summed log-probability by a power of its length, because each extra token raises the raw score and would unfairly favour long outputs.
explanation: Log-probabilities are negative, so every added token makes the sum smaller. Length normalisation, typically dividing by L to the power 0.75, offsets that bias so longer, complete answers are not crowded out.
