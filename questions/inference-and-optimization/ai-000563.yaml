true_statement: In 2015 Deep Compression shrank AlexNet's storage about 35-fold, from 240 MB to 6.9 MB, with no reported loss of ImageNet accuracy.
false_statement: In 2015 Deep Compression shrank AlexNet's storage about 3.5-fold, from 240 MB to 69 MB, with no reported loss of ImageNet accuracy.
explanation: A model of a few megabytes fits in on-chip or phone memory, which is why the result became a landmark for mobile vision. It also showed how much redundancy trained networks carry.
