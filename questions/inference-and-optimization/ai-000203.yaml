true_statement: AWQ quantises weights only, so activations and the KV cache stay in higher precision and its speed gains are largest in memory-bound decoding.
false_statement: AWQ quantises activations only, so weights and the KV cache stay in higher precision and its speed gains are largest in compute-bound prefill.
explanation: Token-by-token decoding is limited by how fast weights stream from memory, so 4-bit weights help most there. Prefill is compute-bound, and real speed also depends on kernel quality; vLLM once rated its AWQ support slower than unquantised serving.
