true_statement: Post-training quantization dominates for LLMs, because quantization-aware training would mean retraining billion-parameter models.
false_statement: Quantization-aware training dominates for LLMs, because post-training quantization would mean retraining billion-parameter models.
explanation: PTQ converts a finished model using a small calibration set, so it is cheap. QAT simulates rounding during training so weights learn to survive it, which works well but is costly at LLM scale.
