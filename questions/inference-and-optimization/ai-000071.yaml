id: ai-000071
area: inference-and-optimization
kind: mechanism
topic: Speculative decoding
topic_type: Technique
maturity: established
true_statement: In speculative decoding a drafted token is always kept if the draft model gave it no more probability than the target, and otherwise rejected with probability 1 − p(x)/q(x).
false_statement: In speculative decoding a drafted token is always kept if the draft model gave it no less probability than the target, and otherwise rejected with probability 1 − q(x)/p(x).
explanation: Tokens the draft over-proposes are thinned out, and after a rejection a replacement is drawn from the leftover distribution max(0, p − q). Leviathan et al. prove this yields exactly the samples the target model alone would produce.
