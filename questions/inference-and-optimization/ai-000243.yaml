true_statement: GPTQ quantizes a layer's weight columns in a fixed order and updates the not-yet-quantized weights to compensate, using second-order information from XXᵀ.
false_statement: GPTQ quantizes a layer's weight columns in a fixed order and rounds each independently to the nearest grid value, leaving the other weights unchanged.
explanation: Rounding each weight on its own is round-to-nearest, which collapses at 3 bits on huge models. GPTQ instead spreads each rounding error onto the remaining weights, guided by the layer's Hessian, so the layer's output stays close to the original.
