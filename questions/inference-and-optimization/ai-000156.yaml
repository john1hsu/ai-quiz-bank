topic: Sampling temperature and top-p
topic_type: Technique
maturity: established
true_statement: Top-p sampling keeps the smallest set of tokens whose cumulative probability reaches p, so the candidate set shrinks when the model is confident.
false_statement: Top-k sampling keeps the smallest set of tokens whose cumulative probability reaches k, so the candidate set shrinks when the model is confident.
explanation: 'Nucleus (top-p) sampling adapts to the shape of each step''s distribution: a peaked step may keep one token, a flat one dozens. Top-k always keeps a fixed number of tokens, which cuts good options when the distribution is flat and admits junk when it is peaked.'
