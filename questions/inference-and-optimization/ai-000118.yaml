true_statement: Continuous batching came from the Orca serving system (OSDI 2022), while PagedAttention came with the vLLM engine (SOSP 2023).
false_statement: Continuous batching came with the vLLM engine (SOSP 2023), while PagedAttention came from the Orca serving system (OSDI 2022).
explanation: Orca solved scheduling by letting requests leave and join after every decoding step. vLLM then solved the memory problem that raised, by paging the KV cache so many more requests fit on one GPU at once.
