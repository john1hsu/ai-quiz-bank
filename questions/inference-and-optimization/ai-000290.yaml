id: ai-000290
area: inference-and-optimization
kind: mechanism
topic: 'FlashAttention: Fast and Memory-Efficient Exact Attention with IO-Awareness'
topic_type: Algorithm
maturity: established
true_statement: FlashAttention keeps a running row maximum and sum of exponentials, rescaling partial outputs per block, so it never stores the N×N score matrix.
false_statement: FlashAttention writes the N×N score matrix to high-bandwidth memory once, then reads it back in blocks to apply softmax and multiply by V.
explanation: Softmax normally needs a whole row before normalising, which forces naive attention to write and reread the score matrix. The 'online softmax' trick fixes the normalisation as blocks arrive, so the full computation fuses into one kernel with memory linear in sequence length.
