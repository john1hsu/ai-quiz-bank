true_statement: In affine quantization a real value r is stored as an integer q with r = S(q − Z), and the zero-point Z lets real zero be represented exactly.
false_statement: In affine quantization a real value r is stored as an integer q with r = S(q − Z), and the scale S lets real zero be represented exactly.
explanation: S stretches the integer grid to the real range, while Z is the integer that stands for 0.0. Representing zero exactly matters for operations like zero-padding, where rounding error would otherwise creep in.
