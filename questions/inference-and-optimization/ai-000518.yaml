true_statement: NVIDIA engineers estimated in 2023 that one 4,096-token request to Llama 2 7B in 16-bit precision needs about 2 GB of KV cache, on top of roughly 14 GB of weights.
false_statement: NVIDIA engineers estimated in 2023 that one 4,096-token request to Llama 2 7B in 16-bit precision needs about 14 GB of KV cache, on top of roughly 2 GB of weights.
explanation: Even for a small model, one long request's cache is a sizeable fraction of the weights, and every concurrent request needs its own. That is why cache size, not just model size, caps how many requests fit on a GPU.
