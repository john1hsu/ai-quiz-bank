true_statement: Dettmers et al. found naive 8-bit quantization breaks down in large transformers because a few hidden dimensions carry outlier features of very large magnitude.
false_statement: Dettmers et al. found naive 8-bit quantization breaks down in large transformers because most hidden dimensions carry near-zero values that rounding erases.
explanation: A handful of huge-magnitude dimensions stretch the quantization range and dominate attention. LLM.int8() handles them by routing those dimensions through 16-bit math while keeping over 99.9% of values in 8-bit.
