true_statement: vLLM's OpenAI-compatible chat endpoints need a chat template in the model's tokenizer configuration; without one, chat requests fail unless a template is passed with --chat-template.
false_statement: vLLM's OpenAI-compatible completions endpoint needs a chat template in the model's tokenizer configuration; without one, completion requests fail unless a template is passed with --chat-template.
explanation: A chat request is a list of role-tagged messages, and the template is what turns them into the single prompt string the model was trained on. Plain completions already send a raw prompt, so they need no template; the false statement moves the requirement to the wrong endpoint.
