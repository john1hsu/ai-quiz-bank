true_statement: Koehn and Knowles (2017) found translation quality usually worsens once the beam grows past an optimal size, mainly because wider beams produce shorter translations.
false_statement: Koehn and Knowles (2017) found translation quality usually worsens once the beam grows past an optimal size, mainly because wider beams produce longer translations.
explanation: A wider beam searches harder for high-probability outputs, and short outputs tend to score well, so more search can mean worse translations. They tested beams from 1 to 1,000; length normalisation softened the drop but did not remove it.
