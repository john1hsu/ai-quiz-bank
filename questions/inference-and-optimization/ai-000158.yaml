true_statement: Holtzman et al. found that likelihood-maximising decoding such as greedy or beam search yields bland, repetitive text, while pure unrestricted sampling drifts into incoherence.
false_statement: Holtzman et al. found that likelihood-maximising decoding such as greedy or beam search drifts into incoherence, while pure unrestricted sampling yields bland, repetitive text.
explanation: Chasing the most probable sequence gets stuck in loops, whereas sampling from the full distribution eventually picks tokens from the long unreliable tail. Truncated sampling like top-p sits between the two failure modes, which is why it became the standard for open-ended generation.
