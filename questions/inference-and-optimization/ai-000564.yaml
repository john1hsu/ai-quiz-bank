true_statement: On the knowledge-intensive LLM-KICK benchmark, every pruning method tested degraded noticeably, sometimes at 25–30% sparsity, while quantization held up better.
false_statement: On the knowledge-intensive LLM-KICK benchmark, every quantization method tested degraded noticeably, sometimes at 4-bit precision, while pruning held up better.
explanation: Jaiswal and colleagues built LLM-KICK because perplexity can hide damage that shows up on tasks needing stored knowledge. Pruned models still did well on in-context retrieval and summarization, so the harm is task-dependent.
