true_statement: In 2022 GPTQ quantized the 175-billion-parameter OPT-175B to 4 bits in about 4 hours on one A100, moving WikiText2 perplexity only from 8.34 to 8.37.
false_statement: In 2022 GPTQ quantized the 175-billion-parameter OPT-175B to 4 bits in about 4 hours on one A100, moving WikiText2 perplexity from 8.34 to 10.54.
explanation: 10.54 was what simple round-to-nearest gave at 4 bits. GPTQ's near-lossless result, and a 3-bit model that fit on a single 80GB GPU, showed second-order post-training quantization could shrink the largest open models without retraining.
