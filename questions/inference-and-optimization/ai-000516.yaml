true_statement: In LLM inference, prefill is a matrix-matrix workload that keeps the GPU busy, while decode is a matrix-vector workload whose latency is dominated by memory transfers.
false_statement: In LLM inference, decode is a matrix-matrix workload that keeps the GPU busy, while prefill is a matrix-vector workload whose latency is dominated by memory transfers.
explanation: Prefill processes all prompt tokens at once, giving the GPU plenty of arithmetic per byte loaded. Decode handles one token per step, so weights and cache must be reloaded for little work, which is why most optimizations target the decode phase.
