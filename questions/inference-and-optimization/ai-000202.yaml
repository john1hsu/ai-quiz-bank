true_statement: AWQ protects salient channels by scaling their weights up and their inputs down, rather than storing those weights in higher precision.
false_statement: AWQ protects salient channels by storing those weights in FP16 alongside low-bit weights, rather than scaling their weights up and their inputs down.
explanation: Mixed FP16 and integer formats are accurate but awkward for hardware kernels. Scaling a weight by s and dividing its input by s leaves the output unchanged while shrinking that weight's relative rounding error, keeping one uniform low-bit format.
