true_statement: GPTQ makes the Optimal Brain Quantization procedure from Frantar and Alistarh's Optimal Brain Compression tractable for billion-parameter models.
false_statement: GPTQ makes the activation-aware scaling procedure from Lin and Han's AWQ paper tractable for billion-parameter models.
explanation: OBQ quantised weights greedily one at a time with error compensation, but its cost grew cubically with layer width. GPTQ's fixed column order, lazy batch updates and Cholesky reformulation cut that cost. AWQ came later and is a separate, competing method.
