topic: Sampling temperature and top-p
topic_type: Technique
maturity: established
true_statement: Dividing the logits by a temperature below 1 sharpens the next-token distribution toward likely tokens, while a temperature above 1 flattens it.
false_statement: Dividing the logits by a temperature above 1 sharpens the next-token distribution toward likely tokens, while a temperature below 1 flattens it.
explanation: Smaller temperatures exaggerate the gaps between logits before the softmax, so the top tokens dominate; as temperature approaches 0, sampling becomes greedy decoding. Higher temperatures shrink the gaps, giving unlikely tokens more chance and more diversity at some cost to quality.
