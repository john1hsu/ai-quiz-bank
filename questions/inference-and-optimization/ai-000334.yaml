area: inference-and-optimization
kind: definition
topic: Model pruning
topic_type: Technique
maturity: established
true_statement: Structured pruning removes whole channels, heads or blocks, leaving a smaller dense network, while unstructured pruning zeroes individual weights in an irregular pattern.
false_statement: Unstructured pruning removes whole channels, heads or blocks, leaving a smaller dense network, while structured pruning zeroes individual weights in an irregular pattern.
explanation: Unstructured pruning reaches the highest sparsity for a given accuracy, but its scattered zeros are hard for hardware to exploit. Structured pruning gives up some sparsity so ordinary dense kernels can run the slimmer model faster.
