topic: Orca (LLM serving system)
topic_type: Tool
maturity: established
true_statement: Sarathi-Serve found that mixing phases in one batch, as Orca-style scheduling does, lets a newly admitted prefill-heavy request stall ongoing decodes, which it fixes with chunked prefills.
false_statement: Sarathi-Serve found that mixing phases in one batch, as Orca-style scheduling does, lets a long-running decode stall newly admitted prefills, which it fixes with chunked decodes.
explanation: A long prompt's prefill is a big compute burst, so every decoding request batched with it waits, causing latency spikes. Splitting the prefill into chunks spread over several iterations keeps decodes flowing.
