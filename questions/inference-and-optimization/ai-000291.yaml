topic: 'FlashAttention: Fast and Memory-Efficient Exact Attention with IO-Awareness'
topic_type: Algorithm
maturity: established
true_statement: In 2023 FlashAttention-2 reached 50–73% of an A100's peak FLOPs/s, up from 25–40% for the original FlashAttention.
false_statement: In 2023 FlashAttention-2 reached 25–40% of an A100's peak FLOPs/s, up from 10–20% for the original FlashAttention.
explanation: FlashAttention-2 roughly doubled speed by cutting non-matmul work, parallelising over sequence length and splitting work across warps. Utilisation then fell again on newer hardware, which is why FlashAttention-3 and -4 were redesigned for Hopper and Blackwell.
