topic: Continuous batching and PagedAttention
topic_type: Technique
maturity: established
true_statement: Orca's selective batching merges all requests' tokens for linear layers and layer norm, but runs attention separately for each request.
false_statement: Orca's selective batching merges all requests' tokens for attention, but runs linear layers and layer norm separately for each request.
explanation: Token-wise operations don't care which sequence a token belongs to, so ragged requests can be flattened into one big matrix. Attention must only see tokens of the same sequence, and having no weights to share, it loses little from running per request.
