true_statement: By late 2026 TensorRT-LLM ran models as native PyTorch code and loaded Hugging Face checkpoints directly, having removed its step of compiling a TensorRT engine ahead of time.
false_statement: By late 2026 TensorRT-LLM compiled every model into a TensorRT engine ahead of time with trtllm-build, having removed its PyTorch backend.
explanation: TensorRT-LLM began as an engine-compiling workflow, added a PyTorch backend as a beta in version 0.17, then made PyTorch its sole execution backend and dropped trtllm-build. Despite the name, older tutorials' engine-build step no longer exists, so the false statement has the change backwards.
