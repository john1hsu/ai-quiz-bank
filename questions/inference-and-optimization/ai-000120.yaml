true_statement: Kwon et al. (2023) found only 20.4%–38.2% of KV-cache memory held token states in earlier serving systems, versus about 96% with PagedAttention.
false_statement: Kwon et al. (2023) found only 20.4%–38.2% of KV-cache memory held token states with PagedAttention, versus about 96% in earlier serving systems.
explanation: Earlier systems reserved one contiguous region per request for its maximum length, wasting space that was reserved, unused or fragmented. Paging allocates small blocks on demand, so waste is limited to each sequence's last partly filled block.
