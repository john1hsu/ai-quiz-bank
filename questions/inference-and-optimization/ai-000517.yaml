true_statement: In Zhou et al.'s 2024 taxonomy, system-level inference techniques such as faster kernels and batching are typically lossless, while model-level ones such as quantization risk accuracy.
false_statement: In Zhou et al.'s 2024 taxonomy, model-level inference techniques such as faster kernels and batching are typically lossless, while system-level ones such as quantization risk accuracy.
explanation: Model-level methods change the network itself, through compression or efficient structures, so they can cost quality and often need retraining. System-level work changes how the same computation is run and scheduled, so outputs stay the same.
