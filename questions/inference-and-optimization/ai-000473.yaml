true_statement: Diverse beam search is a beam-search variant that adds diversity constraints between groups of beams, because ordinary beam candidates are often near-duplicate rewordings.
false_statement: Diverse beam search is a beam-search variant that samples each next token at random within the beam, because ordinary beam candidates are often near-duplicate rewordings.
explanation: Vijayakumar et al. kept beam search's structure but penalised groups of beams for resembling each other, gaining variety at little extra cost. Random sampling within a beam is a different idea, closer to beam-search multinomial sampling.
