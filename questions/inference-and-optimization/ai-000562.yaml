true_statement: 'Han, Mao and Dally''s Deep Compression chained three steps: magnitude pruning, trained quantization with shared weights, and Huffman coding.'
false_statement: 'Han, Mao and Dally''s Deep Compression chained three steps: magnitude pruning, low-rank factorization of weight matrices, and Huffman coding.'
explanation: 'Deep Compression showed that compression methods stack: pruning removes weights, quantization makes the survivors share a few values, and Huffman coding stores those values compactly. Low-rank factorization is a separate compression family that the paper did not use.'
